}

// ---------- format helpers ----------
function fmtPct(n){ return isFinite(n) ? (n*100).toFixed(1)+"%" : "0.0%"; }
// 「統計」「①比較表」の打ち筋系・内訳系の率は小数点第一位を四捨五入し、整数%で表示する（着順系はfmtPctの1桁表示のまま）
function fmtPct0(n){ return isFinite(n) ? Math.round(n*100)+"%" : "0%"; }
// 回数系の指標を四捨五入して整数で表示する。個々のプレイヤーは元々整数のため変化しないが、
// 「平均」列（端数を含む単純平均値）を各プレイヤーと同じ桁数（整数）に揃えるために使う。
function fmtCount(n){ return isFinite(n) ? Math.round(n) : 0; }
function fmtAvg(n){ return isFinite(n) ? n.toFixed(2) : "0.00"; }
// 該当半荘が無い場合（null）は「－」表示（座席別平均順位など）
function fmtAvgOrDash(n){ return (typeof n==="number" && isFinite(n)) ? n.toFixed(2) : "－"; }
function fmtPt(n){
  if(n===null || n===undefined || isNaN(n)) return "-";
  const v = Math.round(n*10)/10;
  return (v>0?"+":"") + v.toFixed(1);
}
function fmtSigned(n){
  if(n===null || n===undefined || isNaN(n)) return "-";
  const v = Math.round(n*10)/10;
  return (v>0?"+":"") + v.toFixed(1);
}
function fmtDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso||"-");
  const p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// 全セクション共通の日付期間フィルタ（state.dateRange）に、指定日付が含まれるか判定する
function inDateRange(date){
  const r = state.dateRange;
  return (!r.from || date>=r.from) && (!r.to || date<=r.to);
}
function isDateRangeActive(){ return !!(state.dateRange.from || state.dateRange.to); }
// "YYYY-MM-DD"形式の日付文字列から曜日（0=日〜6=土）を求める。年月日の数値だけからDateを組み立てるため、
// タイムゾーンの影響を受けずその日付自体の曜日を返す。
function dayOfWeekFromDateStr(dateStr){
  if(!dateStr) return null;
  const parts = String(dateStr).split("-").map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return null;
  const [y,m,d] = parts;
  return new Date(y, m-1, d).getDay();
}
function matchesDayFilter(date){
  if(state.dayFilter==="all") return true;
  const dow = dayOfWeekFromDateStr(date);
  if(dow===null) return true;
  const isWeekend = (dow===0 || dow===6);
  return state.dayFilter==="weekend" ? isWeekend : !isWeekend;
}
function isDayFilterActive(){ return state.dayFilter!=="all"; }
function isAnyFilterActive(){ return isDateRangeActive() || isDayFilterActive(); }
// 全セクション共通の絞り込み（期間＋曜日）をまとめて判定する
function passesFilters(date){ return inDateRange(date) && matchesDayFilter(date); }
function escapeAttr(s){ return escapeHtml(s); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; } return h; }
const NEUTRAL_COLOR = "#c9bf9f";
// 選択チップに入れた順にパレット色を固有割当（同時ハイライト数が多くない前提のため、名前ハッシュより衝突しにくい）
function colorForChip(name){
  const idx = state.chips.indexOf(name);
  if(idx < 0) return NEUTRAL_COLOR;
  return CHART_PALETTE[idx % CHART_PALETTE.length];
}
// ③④・マイ牌の色：選手ごとに固定。期間・曜日フィルタに左右されないよう、読み込んだデータ全体の半荘数の多い順にパレットを割り当てる
function globalPlayerOrder(){
  if(globalPlayerOrder._raw === state.raw && globalPlayerOrder._order) return globalPlayerOrder._order;
  const cnt = new Map();
  Object.keys(state.raw.hanchanConfirmed||{}).forEach(key=>{
    if(!state.raw.hanchanConfirmed[key]) return;
    const i = key.lastIndexOf("_");
    namesForHanchan(key.slice(0,i), Number(key.slice(i+1))).forEach(n=>cnt.set(n,(cnt.get(n)||0)+1));
  });
  (state.raw.playerRoster||[]).forEach(n=>{ if(n && !cnt.has(n)) cnt.set(n,0); });
  globalPlayerOrder._raw = state.raw;
  globalPlayerOrder._order = Array.from(cnt.entries()).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  return globalPlayerOrder._order;
}
function entityColor(name, statsList){
  const order = globalPlayerOrder();
  const idx = order.indexOf(name);
  return CHART_PALETTE[(idx<0?0:idx) % CHART_PALETTE.length];
}
function hexToRgb(hex){ hex=hex.replace("#",""); return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)]; }
function mixColor(hex1, hex2, t){
  const a=hexToRgb(hex1), b=hexToRgb(hex2);
  const r=Math.round(a[0]+(b[0]-a[0])*t), g=Math.round(a[1]+(b[1]-a[1])*t), bl=Math.round(a[2]+(b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
}

// ---------- データ集計（入力アプリのロジックを移植） ----------
function namesForHanchan(date, hanchanNo){
  const key = `${date}_${hanchanNo}`;
  const snap = state.raw.recordPlayers && state.raw.recordPlayers[key];
  if(snap && snap.length===4) return snap;
  return state.raw.players || ["P1","P2","P3","P4"];
}

function hanchanGroups(){
  const map = new Map();
  (state.raw.records||[]).forEach(r=>{
    const key = `${r.date}_${r.hanchanNo}`;
    if(!map.has(key)) map.set(key, {date:r.date, hanchanNo:r.hanchanNo});
  });
  Object.keys(state.raw.ranks||{}).forEach(k=>{
    if(!map.has(k) && state.raw.ranks[k]){
      const idx = k.lastIndexOf("_");
      const date = k.slice(0,idx), hanchanNo = Number(k.slice(idx+1));
      if(date) map.set(k, {date, hanchanNo});
    }
  });
  return Array.from(map.values()).sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.hanchanNo - b.hanchanNo;
  });
}

function computeHanchanKyokuStats(date, hanchanNo){
  const recs = (state.raw.records||[]).filter(r=>r.date===date && r.hanchanNo===hanchanNo && r.resultType!=="chombo" && r.resultType!=="resultonly");
  const total = recs.length;
  const ryuukyoku = recs.filter(r=>!r.stats.some(s=>s[K_TSUMO]===1 || s[K_RON]===1)).length;
  return {total, ryuukyoku};
}

function computeOverallStats(){
  const byName = new Map();
  function ensure(name){
    const key = name || "";
    if(!byName.has(key)){
      byName.set(key, {
        name: key,
        riichi:0, fuuro:0, tsumo:0, ron:0, houjuu:0, riichiAgari:0, riichiHoujuu:0, fuuroAgari:0, fuuroHoujuu:0,
        riichiRyuukyoku:0, fuuroRyuukyoku:0,
        agariRiichi:0, agariFuuro:0, agariOther:0, houjuuRiichi:0, houjuuFuuro:0, houjuuOther:0,
        houjuuOpponentRiichi:0, houjuuOpponentFuuro:0, houjuuOpponentOther:0, houjuuOpponentTotal:0,
        chombo:0, chomboPt:0, kyokuCount:0, ranks:[], totalPt:0, scores:[],
        ryuukyoku:0, dailyPts:new Map(), seatRanks:[[],[],[],[]],
        oya:{k:0,ri:0,fu:0,agari:0,ho:0,riAgari:0,renchan:0,kaburi:0},
        ko:{k:0,ri:0,fu:0,agari:0,ho:0,riAgari:0,hoToOya:0}
      });
    }
    return byName.get(key);
  }
  (state.raw.playerRoster||[]).forEach(n=>{ if(n) ensure(n); });

  (state.raw.records||[]).forEach(r=>{
    if(!passesFilters(r.date)) return;
    const names = namesForHanchan(r.date, r.hanchanNo);
    const isChomboResult = r.resultType === "chombo";
    const isResultOnly = r.resultType === "resultonly";
    // その局で誰も和了しなかった（＝流局）かどうかを局単位で1回だけ判定する
    const isRyuukyokuKyoku = !r.stats.some(ps=>ps[K_TSUMO]===1 || ps[K_RON]===1);
    // 放銃相手内訳：その局でロン和了したプレイヤー（複数ロンの場合は全員）の、リーチ／副露フラグを控えておく
    const ronWinners = [];
    for(let j=0;j<4;j++){ if(r.stats[j][K_RON]===1) ronWinners.push({idx:j, ri:r.stats[j][K_RIICHI], fu:r.stats[j][K_FUURO]||0}); }
    // 親番／子番：dealers[半荘キー]は東家から順に並んだプレイヤー番号（recordPlayersのindex）。東n・南n局の親は dealers[n-1]
    const dealerIdx = dealerIndexForRecord(r);
    const tsumoWinnerIdx = r.stats.findIndex(ps=>ps[K_TSUMO]===1);
    r.stats.forEach((s,i)=>{
      const name = names[i] || `P${i+1}`;
      const p = ensure(name);
      const ri=s[K_RIICHI], fu=s[K_FUURO]||0, tsu=s[K_TSUMO], ron=s[K_RON], ho=s[K_HOUJUU];
      p.riichi += ri; p.fuuro += fu; p.tsumo += tsu; p.ron += ron; p.houjuu += ho;
      if(ri && (tsu || ron)) p.riichiAgari += 1;
      if(ri && ho) p.riichiHoujuu += 1;
      if(ri && isRyuukyokuKyoku) p.riichiRyuukyoku += 1;
      if(fu && (tsu || ron)) p.fuuroAgari += 1;
      if(fu && ho) p.fuuroHoujuu += 1;
      if(fu && isRyuukyokuKyoku) p.fuuroRyuukyoku += 1;
      // 和了内訳・放銃内訳：その局でリーチ・副露のどちらも無かった場合を「その他」（ダマテン・面前ツモ等）として振り分ける
      if(tsu || ron){
        if(ri) p.agariRiichi += 1;
        else if(fu) p.agariFuuro += 1;
        else p.agariOther += 1;
      }
      if(ho){
        if(ri) p.houjuuRiichi += 1;
        else if(fu) p.houjuuFuuro += 1;
        else p.houjuuOther += 1;
        // 放銃相手内訳：自分が放銃した相手（ロンしたプレイヤー）のリーチ／副露／ダマテンを分類する（複数ロンなら全員分カウント）
        ronWinners.forEach(w=>{
          if(w.idx===i) return;
          if(w.ri) p.houjuuOpponentRiichi += 1;
          else if(w.fu) p.houjuuOpponentFuuro += 1;
          else p.houjuuOpponentOther += 1;
          p.houjuuOpponentTotal += 1;
        });
      }
      if(!isChomboResult && !isResultOnly){
        p.kyokuCount += 1;
        if(isRyuukyokuKyoku) p.ryuukyoku += 1;
        if(dealerIdx !== null){
          const isOya = i===dealerIdx;
          const b = isOya ? p.oya : p.ko;
          b.k += 1; b.ri += ri; b.fu += fu; b.ho += ho;
          if(tsu || ron) b.agari += 1;
          if(ri && (tsu || ron)) b.riAgari += 1;
          if(isOya){
            if(r.resultType==="renchan") b.renchan += 1;
            if(tsumoWinnerIdx!==-1 && tsumoWinnerIdx!==i) b.kaburi += 1;
          }else if(ho && ronWinners.some(w=>w.idx===dealerIdx)){
            b.hoToOya += 1;
          }
        }
      }
      if(s[K_CHOMBO]){
        p.chombo += 1;
        p.chomboPt -= 15;
        for(let j=0;j<4;j++){ if(j!==i) ensure(names[j] || `P${j+1}`).chomboPt += 5; }
      }
    });
  });

  Object.entries(state.raw.ranks||{}).forEach(([key,arr])=>{
    if(!arr || !state.raw.hanchanConfirmed[key]) return;
    const idx = key.lastIndexOf("_");
    const date = key.slice(0,idx), hanchanNo = Number(key.slice(idx+1));
    if(!passesFilters(date)) return;
    const names = namesForHanchan(date, hanchanNo);
    const pts = state.raw.finalPoints[key];
    const scores = state.raw.finalScores[key];
    // 座席別平均順位：dealers[key]は東家から順に並んだプレイヤー番号。indexOfで各プレイヤーの開始時の座席（0=東家〜3=北家）を求める
    const seats = state.raw.dealers && state.raw.dealers[key];
    const hasSeats = Array.isArray(seats) && seats.length===4;
    arr.forEach((rk,i)=>{
      if(!rk) return;
      const p = ensure(names[i] || `P${i+1}`);
      p.ranks.push(rk);
      if(hasSeats){ const seat = seats.indexOf(i); if(seat>=0) p.seatRanks[seat].push(rk); }
      if(pts) p.totalPt += (pts[i]||0);
      if(pts && pts[i]!==undefined && pts[i]!==null && !isNaN(pts[i])){
        p.dailyPts.set(date, (p.dailyPts.get(date)||0) + pts[i]);
      }
      if(scores && scores[i]!==null && scores[i]!==undefined && !isNaN(scores[i])) p.scores.push(scores[i]);
    });
  });

  return Array.from(byName.values()).map(p=>{
    const n = p.ranks.length;
    const avg = n ? p.ranks.reduce((a,b)=>a+b,0)/n : 0;
    const rankCount = (k)=> p.ranks.filter(x=>x===k).length;
    const rate = (k)=> n ? rankCount(k)/n : 0;
    const agari = p.tsumo + p.ron;
    const scoreN = p.scores.length;
    const hakoCount = p.scores.filter(s=>s<0).length;
    const dayValues = Array.from(p.dailyPts.values());
    const dayCount = dayValues.length;
    const dayWinCount = dayValues.filter(v=>v>0).length;
    return {
      ...p,
      agari,
      hanchanRankedCount: n,
      avgRank: avg,
      dayCount, dailyWinRate: dayCount ? dayWinCount/dayCount : 0,
      ryuukyokuRate: p.kyokuCount ? p.ryuukyoku/p.kyokuCount : 0,
      top: rate(1), second: rate(2), third: rate(3), last: rate(4),
      topCount: rankCount(1), secondCount: rankCount(2), thirdCount: rankCount(3), lastCount: rankCount(4),
      hakoRate: scoreN ? hakoCount/scoreN : 0,
      hakoCount,
      riichiRate: p.kyokuCount ? p.riichi/p.kyokuCount : 0,
      fuuroRate: p.kyokuCount ? p.fuuro/p.kyokuCount : 0,
      agariRate: p.kyokuCount ? agari/p.kyokuCount : 0,
      houjuuRate: p.kyokuCount ? p.houjuu/p.kyokuCount : 0,
      riichiAgariRate: p.riichi ? p.riichiAgari/p.riichi : 0,
      riichiHoujuuRate: p.riichi ? p.riichiHoujuu/p.riichi : 0,
      riichiRyuukyokuRate: p.riichi ? p.riichiRyuukyoku/p.riichi : 0,
      fuuroAgariRate: p.fuuro ? p.fuuroAgari/p.fuuro : 0,
      fuuroHoujuuRate: p.fuuro ? p.fuuroHoujuu/p.fuuro : 0,
      fuuroRyuukyokuRate: p.fuuro ? p.fuuroRyuukyoku/p.fuuro : 0,
      // 和了内訳（リーチ／副露／その他）：それぞれの和了数に占める割合
      agariRiichiRate: agari ? p.agariRiichi/agari : 0,
      agariFuuroRate: agari ? p.agariFuuro/agari : 0,
      agariOtherRate: agari ? p.agariOther/agari : 0,
      // 放銃内訳（リーチ／副露／その他）：それぞれの放銃数に占める割合
      houjuuRiichiRate: p.houjuu ? p.houjuuRiichi/p.houjuu : 0,
      houjuuFuuroRate: p.houjuu ? p.houjuuFuuro/p.houjuu : 0,
      houjuuOtherRate: p.houjuu ? p.houjuuOther/p.houjuu : 0,
      // 放銃相手内訳（リーチ／副露／ダマテン）：放銃した際にロンしたプレイヤーの手の状態別の割合
      houjuuOpponentRiichiRate: p.houjuuOpponentTotal ? p.houjuuOpponentRiichi/p.houjuuOpponentTotal : 0,
      houjuuOpponentFuuroRate: p.houjuuOpponentTotal ? p.houjuuOpponentFuuro/p.houjuuOpponentTotal : 0,
      houjuuOpponentOtherRate: p.houjuuOpponentTotal ? p.houjuuOpponentOther/p.houjuuOpponentTotal : 0,
      seatAvgRank0: seatAvg(p.seatRanks[0]), seatAvgRank1: seatAvg(p.seatRanks[1]),
      seatAvgRank2: seatAvg(p.seatRanks[2]), seatAvgRank3: seatAvg(p.seatRanks[3]),
      seatCount0: p.seatRanks[0].length, seatCount1: p.seatRanks[1].length,
      seatCount2: p.seatRanks[2].length, seatCount3: p.seatRanks[3].length,
      // 親番／子番
      oyaKyoku: p.oya.k,
      oyaAgariRate: p.oya.k ? p.oya.agari/p.oya.k : 0,
      oyaHoujuuRate: p.oya.k ? p.oya.ho/p.oya.k : 0,
      oyaRiichiRate: p.oya.k ? p.oya.ri/p.oya.k : 0,
      oyaFuuroRate: p.oya.k ? p.oya.fu/p.oya.k : 0,
      oyaRiichiAgariRate: p.oya.ri ? p.oya.riAgari/p.oya.ri : 0,
      oyaRenchan: p.oya.renchan,
      oyaRenchanRate: p.oya.k ? p.oya.renchan/p.oya.k : 0,
      oyaKaburi: p.oya.kaburi,
      koKyoku: p.ko.k,
      koAgariRate: p.ko.k ? p.ko.agari/p.ko.k : 0,
      koHoujuuRate: p.ko.k ? p.ko.ho/p.ko.k : 0,
      koRiichiRate: p.ko.k ? p.ko.ri/p.ko.k : 0,
      koFuuroRate: p.ko.k ? p.ko.fu/p.ko.k : 0,
      koRiichiAgariRate: p.ko.ri ? p.ko.riAgari/p.ko.ri : 0,
      koHoujuuToOya: p.ko.hoToOya,
    };
  });
}
function seatAvg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
// 親番／子番：その局の親のプレイヤー番号（recordPlayersのindex）を返す。座席未記録・局名が東n/南n以外ならnull
function dealerIndexForRecord(r){
  const seats = state.raw.dealers && state.raw.dealers[`${r.date}_${r.hanchanNo}`];
  if(!seats || seats.length!==4) return null;
  const m = /^[東南西北]([1-4])$/.exec(r.kyoku||"");
  if(!m) return null;
  const idx = seats[Number(m[1])-1];
  return (typeof idx==="number" && idx>=0 && idx<4) ? idx : null;
}
// 仕様書6.1：①②③の対象は「対局実績（総局数＞0）または半荘実績があるプレイヤー全員」
function computeActiveStats(){ return computeOverallStats().filter(s=>s.kyokuCount>0 || s.hanchanRankedCount>0); }

// 統計タブ：指定プレイヤーの「着順別（1着〜4着）打ち筋スタッツ」を集計する。
// 対象は確定済み半荘（かつサイドバー共通の期間・曜日フィルタの範囲内）でそのプレイヤーの最終着順が判明している半荘のみ。
// 各局の打ち筋系スタッツ（リーチ・副露・ツモ・ロン・放銃等）を、その局が属する半荘での最終着順ごとに振り分けて集計する。
// 見出しの半荘数（例「1着（49半荘）」）は、着順が判明している半荘の総数ではなく、
// そのうち実際に打ち筋系スタッツ（局の詳細）が入力されている半荘数のみをカウントする（「結果のみ入力」の半荘は除く）。
function computeRankSplitStats(playerName){
  const raw = state.raw;
  const rankByHanchan = new Map();
  hanchanGroups().forEach(g=>{
    const key = `${g.date}_${g.hanchanNo}`;
    if(!raw.hanchanConfirmed[key]) return;
    if(!passesFilters(g.date)) return;
    const names = namesForHanchan(g.date, g.hanchanNo);
    const idx = names.indexOf(playerName);
    if(idx===-1) return;
    const ranks = raw.ranks[key];
    if(!ranks) return;
    const rk = ranks[idx];
    if(!rk) return;
    rankByHanchan.set(key, rk);
  });

  function mkBucket(){
    return {
      riichi:0, fuuro:0, tsumo:0, ron:0, houjuu:0,
      riichiAgari:0, riichiHoujuu:0, riichiRyuukyoku:0,
      fuuroAgari:0, fuuroHoujuu:0, fuuroRyuukyoku:0,
      agariRiichi:0, agariFuuro:0, agariOther:0,
      houjuuRiichi:0, houjuuFuuro:0, houjuuOther:0,
      houjuuOpponentRiichi:0, houjuuOpponentFuuro:0, houjuuOpponentOther:0, houjuuOpponentTotal:0,
      kyokuCount:0
    };
  }
  const buckets = {1:mkBucket(), 2:mkBucket(), 3:mkBucket(), 4:mkBucket()};
  // 着順ごとに「打ち筋系スタッツ（局の詳細）が1局でも入力されている半荘」のキー集合を記録する
  const detailHanchanKeysByRank = {1:new Set(), 2:new Set(), 3:new Set(), 4:new Set()};

  (raw.records||[]).forEach(r=>{
    if(!passesFilters(r.date)) return;
    const key = `${r.date}_${r.hanchanNo}`;
    const rk = rankByHanchan.get(key);
    if(!rk) return;
    const names = namesForHanchan(r.date, r.hanchanNo);
    const idx = names.indexOf(playerName);
    if(idx===-1) return;
    const s = r.stats[idx];
    if(!s) return;
    const b = buckets[rk];
    const isChomboResult = r.resultType === "chombo";
    const isResultOnly = r.resultType === "resultonly";
    if(!isResultOnly) detailHanchanKeysByRank[rk].add(key); // 「結果のみ入力」以外＝局の詳細（打ち筋系スタッツ）が入力されている
    // その局で誰も和了しなかった（＝流局）かどうか、その局でロン和了したプレイヤー（複数ロンなら全員）を、①比較表の集計ロジックと同じ方法で判定する
    const isRyuukyokuKyoku = !r.stats.some(ps=>ps[K_TSUMO]===1 || ps[K_RON]===1);
    const ronWinners = [];
    for(let j=0;j<4;j++){ if(r.stats[j][K_RON]===1) ronWinners.push({idx:j, ri:r.stats[j][K_RIICHI], fu:r.stats[j][K_FUURO]||0}); }
    const ri=s[K_RIICHI], fu=s[K_FUURO]||0, tsu=s[K_TSUMO], ron=s[K_RON], ho=s[K_HOUJUU];
    b.riichi += ri; b.fuuro += fu; b.tsumo += tsu; b.ron += ron; b.houjuu += ho;
    if(ri && (tsu || ron)) b.riichiAgari += 1;
    if(ri && ho) b.riichiHoujuu += 1;
    if(ri && isRyuukyokuKyoku) b.riichiRyuukyoku += 1;
    if(fu && (tsu || ron)) b.fuuroAgari += 1;
    if(fu && ho) b.fuuroHoujuu += 1;
    if(fu && isRyuukyokuKyoku) b.fuuroRyuukyoku += 1;
    if(tsu || ron){
      if(ri) b.agariRiichi += 1;
      else if(fu) b.agariFuuro += 1;
      else b.agariOther += 1;
    }
    if(ho){
      if(ri) b.houjuuRiichi += 1;
      else if(fu) b.houjuuFuuro += 1;
      else b.houjuuOther += 1;
      ronWinners.forEach(w=>{
        if(w.idx===idx) return;
        if(w.ri) b.houjuuOpponentRiichi += 1;
        else if(w.fu) b.houjuuOpponentFuuro += 1;
        else b.houjuuOpponentOther += 1;
        b.houjuuOpponentTotal += 1;
      });
    }
    if(!isChomboResult && !isResultOnly) b.kyokuCount += 1;
  });

  const hanchanCountByRank = {
    1: detailHanchanKeysByRank[1].size, 2: detailHanchanKeysByRank[2].size,
    3: detailHanchanKeysByRank[3].size, 4: detailHanchanKeysByRank[4].size,
  };

  const result = {};
  [1,2,3,4].forEach(rk=>{
    const b = buckets[rk];
    const agari = b.tsumo + b.ron;
    result[rk] = {
      hanchanCount: hanchanCountByRank[rk],
      kyokuCount: b.kyokuCount, riichi: b.riichi, fuuro: b.fuuro, agari, houjuu: b.houjuu,
      riichiRate: b.kyokuCount ? b.riichi/b.kyokuCount : 0,
      fuuroRate: b.kyokuCount ? b.fuuro/b.kyokuCount : 0,
      agariRate: b.kyokuCount ? agari/b.kyokuCount : 0,
      houjuuRate: b.kyokuCount ? b.houjuu/b.kyokuCount : 0,
      riichiAgariRate: b.riichi ? b.riichiAgari/b.riichi : 0,
      riichiHoujuuRate: b.riichi ? b.riichiHoujuu/b.riichi : 0,
      riichiRyuukyokuRate: b.riichi ? b.riichiRyuukyoku/b.riichi : 0,
      fuuroAgariRate: b.fuuro ? b.fuuroAgari/b.fuuro : 0,
      fuuroHoujuuRate: b.fuuro ? b.fuuroHoujuu/b.fuuro : 0,
      fuuroRyuukyokuRate: b.fuuro ? b.fuuroRyuukyoku/b.fuuro : 0,
      agariRiichiRate: agari ? b.agariRiichi/agari : 0,
      agariFuuroRate: agari ? b.agariFuuro/agari : 0,
      agariOtherRate: agari ? b.agariOther/agari : 0,
      agariRiichi: b.agariRiichi, agariFuuro: b.agariFuuro, agariOther: b.agariOther,
      houjuuRiichiRate: b.houjuu ? b.houjuuRiichi/b.houjuu : 0,
      houjuuFuuroRate: b.houjuu ? b.houjuuFuuro/b.houjuu : 0,
      houjuuOtherRate: b.houjuu ? b.houjuuOther/b.houjuu : 0,
      houjuuRiichi: b.houjuuRiichi, houjuuFuuro: b.houjuuFuuro, houjuuOther: b.houjuuOther,
      houjuuOpponentRiichiRate: b.houjuuOpponentTotal ? b.houjuuOpponentRiichi/b.houjuuOpponentTotal : 0,
      houjuuOpponentFuuroRate: b.houjuuOpponentTotal ? b.houjuuOpponentFuuro/b.houjuuOpponentTotal : 0,
      houjuuOpponentOtherRate: b.houjuuOpponentTotal ? b.houjuuOpponentOther/b.houjuuOpponentTotal : 0,
      houjuuOpponentRiichi: b.houjuuOpponentRiichi, houjuuOpponentFuuro: b.houjuuOpponentFuuro, houjuuOpponentOther: b.houjuuOpponentOther,
    };
  });
  return result;
}
function renderRankSplitTable(playerName){
  return renderRankSplitTableFromData(computeRankSplitStats(playerName));
}
// 統計タブ：着順別打ち筋スタッツ表の描画本体。playerNameではなく計算済みのdata（1〜4着それぞれのRANKSPLIT_METRICS値＋hanchanCount）を直接受け取る。
// 個別プレイヤー（computeRankSplitStats）・全プレイヤー平均（computeAverageRankSplitStats）のどちらからも同じ描画ロジックを共有するために分離してある。
// 着順別打ち筋スタッツ表・①比較表：行（指標）ごとに、その行の中の最大値・最小値のセルを見分けやすいよう文字色を変える。
// 値が2種類以上ある場合のみ着色し、全列が同値の場合は何も着色しない（比較の意味がないため）。
function extremeCellStyle(v, maxVal, minVal, hasSpread, better){
  // 返り値はclass名。良し悪しのある指標（better:"high"/"low"）は最良＝is-best（緑◎）・最悪＝is-worst（赤△）、
  // 回数・中立の指標（better:"neutral"／未指定）は最大＝is-max（青▲）・最小＝is-min（橙▼）。CSS側で色に加えて記号を付け、色だけに頼らない
  if(!hasSpread || typeof v !== "number" || !isFinite(v)) return "";
  if(better==="high"){ if(v===maxVal) return "is-best"; if(v===minVal) return "is-worst"; return ""; }
  if(better==="low"){ if(v===minVal) return "is-best"; if(v===maxVal) return "is-worst"; return ""; }
  if(v === maxVal) return "is-max";
  if(v === minVal) return "is-min";
  return "";
}
function renderRankSplitTableFromData(data){
  const header = [1,2,3,4].map(rk=>
    `<th>${rk}着<small>${fmtCount(data[rk].hanchanCount)}半荘</small></th>`
  ).join("");
  // ①比較表と同じグループ定義・同じ折りたたみ状態（state.compareGroupCollapsed）を共有するアコーディオン形式で表示する
  const groupBlocks = COMPARE_METRIC_GROUPS.filter(g=>g.key!=="rank" && g.key!=="oyako").map(grp=>{
    const collapsed = state.compareGroupCollapsed[grp.key] === true; // デフォルトは展開
    const groupHeaderRow = `<tr class="compare-group-row" data-toggle-compare-group="${grp.key}">
      <td class="col-name compare-group-cell" colspan="5">
        <span class="compare-group-arrow">${collapsed?'▶':'▼'}</span>${escapeHtml(grp.label)}
      </td>
    </tr>`;
    if(collapsed) return groupHeaderRow;
    let lastSubgroup = null;
    const metricRows = RANKSPLIT_METRICS.filter(m=>m.group===grp.key).map(m=>{
      let subHeaderRow = "";
      if(m.subgroup !== lastSubgroup){
        lastSubgroup = m.subgroup;
        if(m.subgroup){
          const desc = COMPARE_SUBGROUP_DESC[m.subgroup];
          const descHtml = desc ? `<span class="compare-subgroup-desc">${escapeHtml(desc)}</span>` : "";
          subHeaderRow = `<tr class="compare-subgroup-row"><td class="col-name compare-subgroup-cell" colspan="5">${escapeHtml(m.subgroup)}${descHtml}</td></tr>`;
        }
      }
      const vals = [1,2,3,4].map(rk=>data[rk][m.key]).filter(v=>typeof v==="number" && isFinite(v));
      const maxVal = vals.length ? Math.max(...vals) : null;
      const minVal = vals.length ? Math.min(...vals) : null;
      const hasSpread = maxVal !== null && maxVal !== minVal;
      const cells = [1,2,3,4].map(rk=>{
        const v = data[rk][m.key];
        const cls = extremeCellStyle(v, maxVal, minVal, hasSpread, m.better);
        return `<td class="${cls}">${m.fmt(v)}</td>`;
      }).join("");
      const labelClass = m.subgroup ? "col-name compare-metric-indent" : "col-name";
      return subHeaderRow + `<tr><td class="${labelClass}">${tipLabel(m.label, m.desc)}</td>${cells}</tr>`;
    }).join("");
    return groupHeaderRow + metricRows;
  }).join("");
  return `<div class="table-scroll"><table class="stat-mini-table">
    <tr><th class="col-name"></th>${header}</tr>
    ${groupBlocks}
  </table></div>
  <div class="note">※各着順の半荘数は、その着順のうち打ち筋系スタッツ（局の詳細）が入力されている半荘のみをカウント（「結果のみ入力」の半荘は含まない）</div>
  <div class="note" style="margin-top:2px;"><span class="mark-legend"><span><span class="mark-best">最良</span>・<span class="mark-worst">最悪</span></span><span><span class="mark-max">最大</span>・<span class="mark-min">最小</span>（回数・良し悪しのない指標）</span></span></div>`;
}
// 統計タブ：全プレイヤー平均値カード用に、着順別打ち筋スタッツを「各プレイヤーの着順別集計を単純平均」して算出する。
// 対象プレイヤーはcomputeAverageStatsと同じ集合（kyokuCount>0のプレイヤー全員）を渡す想定。
function computeAverageRankSplitStats(statsList){
  if(!statsList.length) return null;
  const perPlayer = statsList.map(s=>computeRankSplitStats(s.name));
  const n = perPlayer.length;
  const result = {};
  [1,2,3,4].forEach(rk=>{
    const obj = { hanchanCount: perPlayer.reduce((a,d)=>a+(d[rk].hanchanCount||0),0)/n };
    RANKSPLIT_METRICS.forEach(m=>{ obj[m.key] = perPlayer.reduce((a,d)=>a+(d[rk][m.key]||0),0)/n; });
    result[rk] = obj;
  });
  return result;
}
// ---------- 統計タブ（プレイヤー別スタッツカード。入力アプリの統計タブを移植） ----------
// 全プレイヤーの打ち筋系スタッツ（率・数）を単純平均した値を算出する（着順系・チョンボ系は対象外）。
// RANKSPLIT_METRICS（＝①比較表の「打ち筋系」「内訳」グループ）に列挙されているキーをそのまま平均するため、
// 比較表の項目変更に自動追随する。
function computeAverageStats(statsList){
  if(!statsList.length) return null;
  const n = statsList.length;
  const avg = (key)=> statsList.reduce((a,p)=>a+(p[key]||0),0)/n;
  const obj = {};
  RANKSPLIT_METRICS.forEach(m=>{ obj[m.key] = avg(m.key); });
  return obj;
}
// 統計タブ：①比較表と同じ指標リスト（グループ/サブグループ付き）から、タイルグリッドのHTMLをまとめて生成する共通ヘルパー。
// サブグループの切り替わりごとに見出し（＋1行説明）を挟み、グリッドを区切る。
// 各指標のfmt（fmtPct/fmtPct0/fmtCount/fmtAvg）が桁数を保証するため、個別プレイヤーでも「平均」でも同じfmtをそのまま使う。
function renderMetricTileSections(statsObj, metrics){
  let html = "";
  let currentSubgroup = "__none__";
  let buffer = [];
  function flush(){
    if(buffer.length){ html += `<div class="stat-grid">${buffer.join("")}</div>`; buffer = []; }
  }
  metrics.forEach(m=>{
    if(m.subgroup !== currentSubgroup){
      flush();
      currentSubgroup = m.subgroup;
      if(m.subgroup){
        const desc = COMPARE_SUBGROUP_DESC[m.subgroup] || "";
        html += `<div class="stat-section-label" style="display:flex; align-items:baseline; gap:8px; margin-top:14px;">${escapeHtml(m.subgroup)}${desc?`<span class="compare-subgroup-desc">${escapeHtml(desc)}</span>`:""}</div>`;
      }
    }
    const rawVal = statsObj[m.key];
    const display = m.fmt(rawVal);
    buffer.push(`<div class="stat-tile"><div class="v">${display}</div><div class="l">${tipLabel(m.label, m.desc)}</div></div>`);
  });
  flush();
  return html;
}

function renderStatsSection(){
  const allStats = computeOverallStats(); // 統計タブは対局実績0のプレイヤーも一覧に含める（入力アプリと同じ挙動）。state.dateRangeの期間フィルタも適用される

function computeHeadToHead(nameA, nameB){
  if(!nameA || !nameB || nameA===nameB) return {count:0};
  const groups = hanchanGroups().filter(g=>state.raw.hanchanConfirmed[`${g.date}_${g.hanchanNo}`] && passesFilters(g.date));
  let count=0, totalKyoku=0, sumRankA=0, sumRankB=0, sumPtA=0, sumPtB=0;
  const rankCountA = {1:0,2:0,3:0,4:0}, rankCountB = {1:0,2:0,3:0,4:0};
  groups.forEach(g=>{
    const key = `${g.date}_${g.hanchanNo}`;
    const names = namesForHanchan(g.date, g.hanchanNo);
    const idxA = names.indexOf(nameA), idxB = names.indexOf(nameB);
    if(idxA===-1 || idxB===-1) return;
    const ranks = state.raw.ranks[key], pts = state.raw.finalPoints[key];
    if(!ranks || !pts) return;
    count++;
    totalKyoku += computeHanchanKyokuStats(g.date, g.hanchanNo).total;
    sumRankA += ranks[idxA]||0; sumRankB += ranks[idxB]||0;
    sumPtA += pts[idxA]||0; sumPtB += pts[idxB]||0;
    if(rankCountA[ranks[idxA]] !== undefined) rankCountA[ranks[idxA]]++;
    if(rankCountB[ranks[idxB]] !== undefined) rankCountB[ranks[idxB]]++;
  });
  if(!count) return {count:0};
  return {
    count, totalKyoku,
    avgRankA: sumRankA/count, avgRankB: sumRankB/count,
    avgPtA: sumPtA/count, avgPtB: sumPtB/count,
    topA: rankCountA[1]/count, secondA: rankCountA[2]/count, thirdA: rankCountA[3]/count, lastA: rankCountA[4]/count,
    topB: rankCountB[1]/count, secondB: rankCountB[2]/count, thirdB: rankCountB[3]/count, lastB: rankCountB[4]/count,
  };
}

function bindLoaderEvents(){
  const input = document.getElementById("file-input");
  if(input) input.addEventListener("change", e=>{ const f=e.target.files[0]; if(f) handleFileObj(f); });
  const dz = document.getElementById("dropzone");
  if(dz){
    ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add("dragover"); }));
    ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove("dragover"); }));
    dz.addEventListener("drop", e=>{
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) handleFileObj(f);
    });
  }
  const serverBtn = document.getElementById("load-from-server-btn");
  if(serverBtn) serverBtn.addEventListener("click", loadFromServer);
}
function handleFileObj(file){
  const errEl = document.getElementById("loader-error");
  if(errEl) errEl.textContent = "";
  const reader = new FileReader();
  reader.onload = ()=>{ processBackupText(reader.result, errEl); };
  reader.onerror = ()=>{ if(errEl) errEl.textContent = "ファイルの読み込みに失敗しました。"; };
  reader.readAsText(file, "utf-8");
}
// バックアップJSONのテキストそのものを受け取って読み込む共通処理（ファイル選択・ドラッグ&ドロップ・サーバー読み込みの全てから呼ばれる）。
function processBackupText(rawText, errEl){
  let parsed;
  try{ parsed = JSON.parse(rawText); }
  catch(e){ if(errEl) errEl.textContent = "JSONファイルとして読み込めませんでした。"; return; }
  if(parsed.app !== "mahjong-stats-backup"){
    if(errEl) errEl.textContent = "麻雀スタッツ入力アプリのバックアップファイルではないようです。";
    return;
  }
  state.raw = parsed;
  state.loaded = true;
  state.section = "compare"; // データ読込後の初期セクションは①比較表
  state.chips = [];
  state.compareTargets = null;
  state.dateRange = {from:"", to:""};
  state.dayFilter = "all";
  state.compatRadarTargets = null;
  state.statsCollapsed = {};
  state.rankGradeTargets = null;
  state.rankGradeView = "rank";
  state.houjuuMatrixTargets = null;
  state.graphReplay = false;
  state.tableDay = null;
  state.meterName = null;
  state.titleEditOpen = false;
  render();
}
// サイト上（このアプリと同じ場所）に置かれているbackup.jsonをfetchで取得して読み込む。
async function loadFromServer(){
  const errEl = document.getElementById("loader-error");
  if(errEl) errEl.textContent = "";
  try{
    const res = await fetch("./backup.json", { cache: "no-store" });
    if(!res.ok){
      if(errEl) errEl.textContent = `サイト上のbackup.jsonを取得できませんでした（${res.status}）`;
      return;
    }
    const text = await res.text();
    processBackupText(text, errEl);
  }catch(e){
    if(errEl) errEl.textContent = "サイト上のbackup.jsonを取得できませんでした（通信エラー）。";
  }
}

// ①比較表：「全体平均」列の値を算出する（対象は常にallStats全員＝現在選択中のチップに関わらず固定）
function computeCompareAverageStat(allStats){
  if(!allStats.length) return null;
  const n = allStats.length;
  const obj = {name: COMPARE_AVERAGE_NAME};
  COMPARE_METRICS.forEach(m=>{
    const vals = allStats.map(p=>p[m.key]).filter(v=>v!==null && v!==undefined);
    obj[m.key] = vals.length ? vals.reduce((a,v)=>a+(v||0),0)/vals.length : null;
  });
  return obj;
}
// ①比較表：チップで選択されたプレイヤー名から、実プレイヤーまたは「全体平均」の統計オブジェクトを解決する
function resolveCompareStat(name, allStats){
  if(name===COMPARE_AVERAGE_NAME) return computeCompareAverageStat(allStats);
  return allStats.find(s=>s.name===name);
}

function renderCompareSection(allStats){
  const allNames = allStats.map(s=>s.name).concat([COMPARE_AVERAGE_NAME]);
  if(state.compareTargets === null){
    // 初期状態：平均列をオンにして先頭に置き、続けて半荘数の多い順に選手を選ぶ
    state.compareTargets = [COMPARE_AVERAGE_NAME].concat(allStats.length<=COMPARE_DEFAULT_TARGET_COUNT ? allStats.map(s=>s.name)
      : allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).slice(0,COMPARE_DEFAULT_TARGET_COUNT).map(s=>s.name));
  }else{
    state.compareTargets = state.compareTargets.filter(n=>allNames.includes(n));
  }
  const targets = state.compareTargets;

  const averageOn = targets.includes(COMPARE_AVERAGE_NAME);
  const averageChip = `<label class="chip roster-chip target-chip ${averageOn?'on':''}">
      <input type="checkbox" data-compare-toggle="${escapeAttr(COMPARE_AVERAGE_NAME)}" ${averageOn?'checked':''}><span class="avg-badge">AVG</span>${escapeHtml(COMPARE_AVERAGE_NAME)}<span class="chip-n">対象${allStats.length}名</span></label>`;

  }).join("");

  let tableHtml;
  if(!targets.length){
    tableHtml = `<div class="empty">プレイヤーを1人以上選択してください。</div>`;
  }else{
    // 平均列は常に先頭
    const ordered = targets.filter(n=>n===COMPARE_AVERAGE_NAME).concat(targets.filter(n=>n!==COMPARE_AVERAGE_NAME));
    const selStats = ordered.map(n=>resolveCompareStat(n, allStats)).filter(Boolean);
    if(compareOrientNow()==="player") tableHtml = renderCompareByPlayer(selStats);
    else{
    const colCount = 1 + selStats.length;
    const headerCells = selStats.map(s=>{
      const isAvg = s.name===COMPARE_AVERAGE_NAME;
      const selected = !isAvg && state.chips.includes(s.name);

      // ②で選択中の選手：色は下線と淡い地色で示し、文字は墨のまま
      const style = selected ? `background:${color}1c; color:var(--ink); box-shadow:inset 0 -3px 0 ${color};` : "";
      return `<th class="${isAvg?'avg-col':''}" style="${style}">${isAvg ? '<span class="avg-badge">AVG</span>' : ""}${escapeHtml(s.name)}</th>`;
    }).join("");
    const scoped = compareMetricsInScope();
    const groupBlocks = COMPARE_METRIC_GROUPS.filter(grp=>scoped.some(m=>m.group===grp.key)).map(grp=>{
      const collapsed = state.compareGroupCollapsed[grp.key] === true; // デフォルトは展開
      const groupHeaderRow = `<tr class="compare-group-row" data-toggle-compare-group="${grp.key}">
        <td class="col-name compare-group-cell" colspan="${colCount}">
          <span class="compare-group-arrow">${collapsed?'▶':'▼'}</span>${escapeHtml(grp.label)}
        </td>
      </tr>`;
      if(collapsed) return groupHeaderRow;
      let lastSubgroup = null;
      const metricRows = scoped.filter(m=>m.group===grp.key).map(m=>{
        let subHeaderRow = "";
        if(m.subgroup !== lastSubgroup){
          lastSubgroup = m.subgroup;
          if(m.subgroup){
            const desc = COMPARE_SUBGROUP_DESC[m.subgroup];
            const descHtml = desc ? `<span class="compare-subgroup-desc">${escapeHtml(desc)}</span>` : "";
            subHeaderRow = `<tr class="compare-subgroup-row"><td class="col-name compare-subgroup-cell" colspan="${colCount}">${escapeHtml(m.subgroup)}${descHtml}</td></tr>`;
          }
        }
        const compareVals = selStats.filter(s=>s.name!==COMPARE_AVERAGE_NAME).map(s=>s[m.key]).filter(v=>typeof v==="number" && isFinite(v));
        const maxVal = compareVals.length ? Math.max(...compareVals) : null;
        const minVal = compareVals.length ? Math.min(...compareVals) : null;
        const hasSpread = maxVal !== null && maxVal !== minVal;
        const cells = selStats.map(s=>{
          const isAvg = s.name===COMPARE_AVERAGE_NAME;
          const selected = !isAvg && state.chips.includes(s.name);
          const color = colorForChip(s.name);
          const style = selected ? `background:${color}12;` : "";
          const extCls = isAvg ? "avg-col" : extremeCellStyle(s[m.key], maxVal, minVal, hasSpread, m.better);
          const seatM = /^seatAvgRank(\d)$/.exec(m.key);
          const seatN = (seatM && !isAvg) ? `<small>${fmtCount(s["seatCount"+seatM[1]])}半荘</small>` : "";
          return `<td class="${extCls}" style="${style}">${m.fmt(s[m.key])}${seatN}</td>`;
        }).join("");
        const labelCellClass = m.subgroup ? "col-name compare-metric-indent" : "col-name";
        return subHeaderRow + `<tr><td class="${labelCellClass}">${tipLabel(m.label, m.desc)}</td>${cells}</tr>`;
      }).join("");
      return groupHeaderRow + metricRows;
    }).join("");
    tableHtml = `
      <div class="table-scroll compare-scroll">
        <table class="stat-mini-table" id="compare-table">
          <thead><tr><th class="col-name"></th>${headerCells}</tr></thead>
          <tbody>${groupBlocks}</tbody>
        </table>
      </div>`;
    }
  }
  const orient = compareOrientNow();
  const orientBtn = (val,label)=>`<button type="button" class="seg-btn ${orient===val?'on':''}" data-compare-orient="${val}" aria-pressed="${orient===val}">${label}</button>`;
  const scopeBtn = (val,label)=>`<button type="button" class="seg-btn ${state.compareScope===val?'on':''}" data-compare-scope="${val}" aria-pressed="${state.compareScope===val}">${label}</button>`;
  const orientSwitch = targets.length ? `<div class="compare-toolbar">
      <div class="compare-switches">
        <div class="seg" role="group" aria-label="表示する指標">${scopeBtn("main","主要指標のみ")}${scopeBtn("all","すべての指標")}</div>
        <div class="seg" role="group" aria-label="表の向き">${orientBtn("metric","行＝指標")}${orientBtn("player","行＝選手")}</div>
      </div>
      <div class="note" style="margin:0;"><span class="mark-legend"><span><span class="mark-best">最良</span>・<span class="mark-worst">最悪</span></span><span><span class="mark-max">最大</span>・<span class="mark-min">最小</span>（回数・良し悪しのない指標）</span></span><span class="legend-sub">「${escapeHtml(COMPARE_AVERAGE_NAME)}」列は比較から除く</span></div>
    </div>` : "";

  return `
    <div class="card">
      <div class="target-select">
        <span class="chip-bar-label">対象選手<small>タップで追加・解除／AVG＝全員の平均</small></span>
        <div class="chip-row">${targetChips}</div>
      </div>
      ${orientSwitch}
      ${tableHtml}
      ${targets.length && (orient==="metric" || state.compareTab==="oyako") ? `<div class="note">※「親番／子番」は座席が記録されている半荘の局のみで集計（連荘数は聴牌連荘を含む／親被り数＝自分が親の局で他家がツモ和了した回数）</div>` : ""}
    </div>`;
}

// ①比較表（行＝選手・列＝指標）：スマホなど狭い画面向け。指標はグループタブで1グループずつ表示して列数を抑える。
// 指標の定義・書式・最大最小の判定は「行＝指標」表示と同じものを使う（列＝指標ごとに、平均を除く選手の中で判定）。
function renderCompareByPlayer(selStats){
  const scoped = compareMetricsInScope();
  const groups = COMPARE_METRIC_GROUPS.filter(g=>scoped.some(m=>m.group===g.key));
  if(!groups.some(g=>g.key===state.compareTab)) state.compareTab = groups[0].key;
  const tabs = groups.map(g=>{
    const on = state.compareTab===g.key;
    return `<button type="button" role="tab" aria-selected="${on}" class="rankgrade-tab ${on?'active':''}" data-compare-tab="${g.key}">${escapeHtml(g.label.replace(/\s+/g,""))}</button>`;
  }).join("");
  const metrics = scoped.filter(m=>m.group===state.compareTab);
  // 見出し1段目：サブグループ（無い指標は空欄）、2段目：指標名
  const spans = [];
  metrics.forEach(m=>{
    const last = spans[spans.length-1];
    if(last && last.sub===(m.subgroup||"")) last.n++; else spans.push({sub:m.subgroup||"", n:1});
  });
  const hasSub = spans.some(x=>x.sub);
  const head1 = hasSub ? `<tr class="cmp-subhead"><th class="col-name"></th>${spans.map(x=>`<th colspan="${x.n}" class="${x.sub?'has-sub':''}">${escapeHtml(x.sub)}</th>`).join("")}</tr>` : "";
  const head2 = `<tr><th class="col-name">選手</th>${metrics.map(m=>`<th>${tipLabel(m.label, m.desc)}</th>`).join("")}</tr>`;
  const ext = metrics.map(m=>{
    const vals = selStats.filter(s=>s.name!==COMPARE_AVERAGE_NAME).map(s=>s[m.key]).filter(v=>typeof v==="number" && isFinite(v));
    const maxVal = vals.length ? Math.max(...vals) : null, minVal = vals.length ? Math.min(...vals) : null;
    return {maxVal, minVal, hasSpread: maxVal!==null && maxVal!==minVal};
  });
  const rows = selStats.map(s=>{
    const isAvg = s.name===COMPARE_AVERAGE_NAME;
    const selected = !isAvg && state.chips.includes(s.name);
    const color = colorForChip(s.name);
    const nameStyle = selected ? ` style="box-shadow:inset 3px 0 0 ${color};"` : "";
    const cells = metrics.map((m,j)=>{
      const cls = isAvg ? "avg-col" : extremeCellStyle(s[m.key], ext[j].maxVal, ext[j].minVal, ext[j].hasSpread, m.better);
      const seatM = /^seatAvgRank(\d)$/.exec(m.key);
      const seatN = (seatM && !isAvg) ? `<small>${fmtCount(s["seatCount"+seatM[1]])}半荘</small>` : "";
      return `<td class="${cls}">${m.fmt(s[m.key])}${seatN}</td>`;
    }).join("");
    return `<tr><td class="col-name ${isAvg?'avg-col':''}"${nameStyle}>${isAvg?'<span class="avg-badge">AVG</span>':''}${escapeHtml(s.name)}</td>${cells}</tr>`;
  }).join("");
  const desc = [...new Set(metrics.map(m=>m.subgroup).filter(Boolean))].map(sg=>COMPARE_SUBGROUP_DESC[sg] ? `${sg}＝${COMPARE_SUBGROUP_DESC[sg]}` : "").filter(Boolean).join("／");
  return `
    <div class="rankgrade-tabs compare-tabs" role="tablist">${tabs}</div>
    <div class="table-scroll compare-scroll">
      <table class="stat-mini-table is-by-player" id="compare-table">
        <thead>${head1}${head2}</thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${desc ? `<div class="note">${escapeHtml(desc)}</div>` : ""}`;
}

// ---------- render: ②スコア推移 ----------
// サイドバー共通の期間指定（state.dateRange）で絞り込んだ範囲に確定した半荘のみを対象に、その範囲内でのスコア推移を計算する
// （範囲より前の半荘の得点は含めない＝期間の先頭で0からの推移になる）。
function renderGraphSection(){
  const groups = hanchanGroups().filter(g=>state.raw.hanchanConfirmed[`${g.date}_${g.hanchanNo}`]);
  const filtered = groups.filter(g=>passesFilters(g.date));

  if(!filtered.length){
    return `<div class="card"><div class="empty">対象期間に確定済みの半荘がありません。サイドバーの期間・曜日フィルタをご確認ください。</div></div>`;
  }

  const allNames = [];
  const seen = new Set();
  filtered.forEach(g=>{
    namesForHanchan(g.date, g.hanchanNo).forEach(nm=>{
      const n = nm || "?";
      if(!seen.has(n)){ seen.add(n); allNames.push(n); }
    });
  });

  const cum = {}; allNames.forEach(n=>{ cum[n]=0; });
  const series = {}; allNames.forEach(n=>{ series[n]=[]; });
  filtered.forEach(g=>{
    const key = `${g.date}_${g.hanchanNo}`;
    const names = namesForHanchan(g.date, g.hanchanNo);
    const pts = state.raw.finalPoints[key] || [0,0,0,0];
    allNames.forEach(n=>{
      const slot = names.indexOf(n);
      if(slot !== -1) cum[n] += (pts[slot]||0);
      series[n].push(cum[n]);
    });
  });

  const w=960, h=440, padL=58, padR=96, padT=22, padB=30; // padR：選択中の線の右端に名前を直接表示する余白
  const n = filtered.length;
  const allVals = allNames.flatMap(nm=>series[nm]).concat([0]);
  const maxV = Math.max(...allVals), minV = Math.min(...allVals);
  const xAt = i => padL + (n<=1 ? 0 : (i*(w-padL-padR)/(n-1)));
  const yAt = v => (h-padB) - ((v-minV)/((maxV-minV)||1))*(h-padT-padB);

  const selectedSet = new Set(state.chips.filter(nm=>allNames.includes(nm)));
  const order = allNames.slice().sort((a,b)=> (selectedSet.has(a)?1:0) - (selectedSet.has(b)?1:0));

  // y軸の目安線（0とmax/min付近）
  // 目盛りは切りの良い値（1・2・5×10^n刻み、4〜6本程度）で引く
  const niceStep = (()=>{ const raw=(maxV-minV||1)/6, mag=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/mag; return (f<1.5?1:f<3?2:f<7?5:10)*mag; })();
  const gridLevels = [];
  for(let v=Math.ceil(minV/niceStep)*niceStep; v<=maxV+1e-9; v+=niceStep){ if(Math.abs(v)>1e-9) gridLevels.push(v); }
  const gridLines = gridLevels.map(v=>{
    const y = yAt(v).toFixed(1);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="${CHART_GRID}" stroke-width="1" stroke-dasharray="3,4"/>
      <text x="${padL-10}" y="${(+y+4).toFixed(1)}" font-size="11.5" fill="${CHART_TEXT}" text-anchor="end">${(v>0?"+":"")+Math.round(v)}</text>`;
  }).join("");
  const zeroY = yAt(0).toFixed(1);
  const zeroLine = (minV<0 && maxV>0) ? `<line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="${CHART_ZERO}" stroke-width="1.2"/>
    <text x="${padL-10}" y="${(+zeroY+4).toFixed(1)}" font-size="11.5" fill="${CHART_TEXT}" text-anchor="end">0</text>` : "";

  const lines = order.map(nm=>{
    const isSel = selectedSet.has(nm);
    const color = isSel ? colorForChip(nm) : NEUTRAL_COLOR;
    const s = series[nm];
    const points = s.map((v,i)=>`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" ");
    const strokeW = isSel ? 2.6 : 1.3;
    const strokeOp = isSel ? 1 : 0.75;
    // パレット8色を超えた9人目以降は破線にして、色の循環後も見分けられるようにする
    const dash = (isSel && state.chips.indexOf(nm) >= CHART_PALETTE.length) ? ` stroke-dasharray="7,4"` : "";
    return `<polyline class="${isSel?'is-sel':'is-dim'}" data-graph-name="${escapeAttr(nm)}" points="${points}" fill="none" stroke="${color}" stroke-opacity="${strokeOp}" stroke-width="${strokeW}" stroke-linejoin="round" stroke-linecap="round"${dash}><title>${escapeHtml(nm)}：${fmtPt(series[nm][n-1])}</title></polyline>`;
  }).join("");
  // 選択中の線の右端に、名前と最終ptを直接表示（重なりは上下に押し広げて回避）
  const endLabels = allNames.filter(nm=>selectedSet.has(nm)).map(nm=>({nm, v:series[nm][n-1], y:yAt(series[nm][n-1])}))
    .sort((a,b)=>a.y-b.y);
  for(let i=1;i<endLabels.length;i++){ if(endLabels[i].y - endLabels[i-1].y < 15) endLabels[i].y = endLabels[i-1].y + 15; }
  const overflow = endLabels.length ? endLabels[endLabels.length-1].y - (h-padB) : 0;
  if(overflow > 0) endLabels.forEach(l=>{ l.y -= overflow; });
  const endLabelSvg = endLabels.map(l=>{
    const x = xAt(n-1);
    return `<circle cx="${x.toFixed(1)}" cy="${yAt(l.v).toFixed(1)}" r="3.5" fill="${colorForChip(l.nm)}" stroke="#f3ecdb" stroke-width="2"/>
      <text x="${(x+10).toFixed(1)}" y="${(l.y+4).toFixed(1)}" font-size="12" font-weight="700" fill="#24231e">${escapeHtml(l.nm)}<tspan fill="${CHART_TEXT}" font-weight="500" dx="5">${fmtPt(l.v)}</tspan></text>`;
  }).join("");

  const legend = allNames.map(nm=>{
    const isSel = selectedSet.has(nm);
    const color = isSel ? colorForChip(nm) : NEUTRAL_COLOR;
    const dashed = isSel && state.chips.indexOf(nm) >= CHART_PALETTE.length ? " border-style:dashed;" : "";
    const style = isSel ? `background:${color}14; border-color:${color};${dashed}` : "";
    return `<button class="chip legend-chip" data-chip-toggle="${escapeAttr(nm)}" style="${style}"><span class="legend-dot" style="background:${color};"></span>${escapeHtml(nm)}</button>`;
  }).join("");

  return `
    <div class="card">
      ${state.graphReplay ? renderReplay() : `<svg viewBox="0 0 ${w} ${h}" id="graph-svg" class="graph-svg" role="img" aria-label="スコア推移">
        ${gridLines}${zeroLine}${lines}${endLabelSvg}
        <text x="${padL}" y="${h-8}" font-size="11.5" fill="${CHART_TEXT}" text-anchor="start">${escapeHtml(filtered[0].date)}</text>
        <text x="${w-padR}" y="${h-8}" font-size="11.5" fill="${CHART_TEXT}" text-anchor="end">${escapeHtml(filtered[n-1].date)}</text>
      </svg>`}
      <div class="chip-row legend-row">${legend}</div>
      <div class="note">対象：確定済み半荘 ${n}件／選手名クリックでハイライトON/OFF</div>
    </div>`;
}
// ---------- render: ③相性レーダーチャート（プレイヤー毎に並べて表示） ----------
// 同卓者別の相性を見る指標：軸＝同卓した相手、値＝「基準プレイヤーの平均得点pt－相手の平均得点pt」
// （確定済み半荘で実際に同卓した範囲のみが対象）。0を基準に、外側＝勝ち越し、内側＝負け越しを表す。
const COMPAT_RADAR_DEFAULT_TARGET_COUNT = 8;
function computeCompatAxes(baseName, stats, targetNames){
  const pool = targetNames ? stats.filter(s=>targetNames.includes(s.name)) : stats;
  return pool.filter(s=>s.name!==baseName).map(s=>{
    const h2h = computeHeadToHead(baseName, s.name);
    return { name: s.name, count: h2h.count||0, diff: h2h.count ? (h2h.avgPtA - h2h.avgPtB) : null };
  }).filter(a=>a.count>0);
}
function renderCompatRadarCard(baseName, axes, color, svgId){
  if(!axes.length){
    return `<div class="radar-grid-card">
      <div class="radar-grid-card-head"><h3>${escapeHtml(baseName)}</h3></div>
      <div class="empty">同卓した確定済み半荘が見つかりませんでした。</div>
    </div>`;
  }
  const maxAbs = Math.max(1, ...axes.map(a=>Math.abs(a.diff)));
  const w=280, h=280, cx=140, cy=140, r=80;
  const n = axes.length;
  const angleFor = i => -Math.PI/2 + i*(2*Math.PI/n);
  const axisLines = axes.map((ax,i)=>{
    const a=angleFor(i); const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${CHART_GRID}" stroke-width="1"/>`;
  }).join("");
  const gridPolys = [0.25,0.5,0.75,1.0].map(level=>{
    const pts = axes.map((ax,i)=>{ const a=angleFor(i), rr=r*level; return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`; }).join(" ");
    return `<polygon points="${pts}" fill="${level===1?'rgba(125,118,98,0.05)':'none'}" stroke="${level===1?CHART_GRID_STRONG:CHART_GRID}" stroke-width="1" stroke-dasharray="${level===1?'0':'2,3'}"/>`;
  }).join("");
  const zeroPts = axes.map((ax,i)=>{ const a=angleFor(i), rr=r*0.5; return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`; }).join(" ");
  const zeroPoly = `<polygon points="${zeroPts}" fill="none" stroke="${CHART_ZERO}" stroke-width="1.3" stroke-dasharray="4,3"/>`;
  const labels = axes.map((ax,i)=>{
    const a=angleFor(i), sinA=Math.sin(a); const x=cx+(r+12)*Math.cos(a), y=cy+(r+11)*sinA + (sinA>0.3?9:sinA<-0.3?-1:4); // 上下の軸はラベルを頂点から離し、左右は縦中央に揃える
    const cosA=Math.cos(a); const anchor = cosA>0.3?"start":cosA<-0.3?"end":"middle";
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="11.5" fill="${CHART_TEXT}" text-anchor="${anchor}">${escapeHtml(ax.name)}</text>`;
  }).join("");
  const dataPts = axes.map((ax,i)=>{
    const a=angleFor(i);
    const frac = Math.max(0, Math.min(1, (ax.diff+maxAbs)/(2*maxAbs)));
    const rr = r*frac;
    return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`;
  }).join(" ");
  const dataPoly = `<polygon points="${dataPts}" fill="${color}" fill-opacity="0.16" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  const dataDots = dataPts.split(" ").map(pt=>{ const [x,y]=pt.split(","); return `<circle cx="${x}" cy="${y}" r="2.6" fill="${color}" stroke="#fbf8ef" stroke-width="1.5"/>`; }).join("");
  // pt差は符号（＋／－）と色の両方で示す
  const legendRows = axes.map(ax=>`
    <div class="compat-legend-row">
      <span>${escapeHtml(ax.name)}</span>
      <span><b style="font-weight:700; color:${ax.diff>=0?'var(--green)':'var(--red)'};">${fmtPt(ax.diff)}</b><small>${ax.count}回同卓</small></span>
    </div>`).join("");
  return `
    <div class="radar-grid-card">
      <div class="radar-grid-card-head">
        <h3>${myTile(baseName,"sm")}${escapeHtml(baseName)}</h3>
      </div>
      <svg viewBox="-2 36 ${w+4} ${h-72}" id="${svgId}" class="radar-svg" role="img" aria-label="${escapeAttr(baseName)}の相性レーダーチャート">
        ${gridPolys}${zeroPoly}${axisLines}${dataPoly}${dataDots}${labels}
      </svg>
      <div class="note" style="margin:0 0 8px;">点線の円＝スコア差0（互角）。外側ほど${escapeHtml(baseName)}さんの勝ち越し。</div>
      ${legendRows}
    </div>`;
}
function renderCompatRadarGridSection(allStats){
  const allNames = allStats.map(s=>s.name);
  if(state.compatRadarTargets === null){
    if(allNames.length <= COMPAT_RADAR_DEFAULT_TARGET_COUNT){
      state.compatRadarTargets = allNames.slice();
    }else{
      state.compatRadarTargets = allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount)
        .slice(0, COMPAT_RADAR_DEFAULT_TARGET_COUNT).map(s=>s.name);
    }
  }else{
    state.compatRadarTargets = state.compatRadarTargets.filter(n=>allNames.includes(n));
  }
  const targets = state.compatRadarTargets;

  const targetChips = allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).map(s=>{
    const on = targets.includes(s.name);
    return `<label class="chip roster-chip target-chip ${on?'on':''}">
      <input type="checkbox" data-compatradar-toggle="${escapeAttr(s.name)}" ${on?'checked':''}>${escapeHtml(s.name)}<span class="chip-n">${s.hanchanRankedCount}半荘</span></label>`;
  }).join("");

  let body;
  if(!targets.length){
    body = `<div class="empty">プレイヤーを1人以上選択してください。</div>`;
  }else{
    const cards = targets.map((name,i)=>{
      const axes = computeCompatAxes(name, allStats, targets);
      const color = entityColor(name, allStats);
      return renderCompatRadarCard(name, axes, color, `compat-radar-svg-${i}`);
    }).join("");
    body = `<div class="radar-grid">${cards}</div>`;
  }

  return `
    <div class="card">
      <div class="target-select">
        <span class="chip-bar-label">対象プレイヤー<small>（初期表示は目安${COMPAT_RADAR_DEFAULT_TARGET_COUNT}名、チップで自由に増減できます）</small></span>
        <div class="chip-row">${targetChips}</div>
      </div>
      ${targets.length ? "" : body}
    </div>
    ${targets.length ? body : ""}`;
}

// ---------- render: ④成績5段階評価（相対評価） ----------
// ③相性レーダーチャートと同じ「選手ごとに個別カード」の枠組み。
// 各軸は選択した対象プレイヤーの実績範囲を5等分したしきい値（RANK_GRADE_AXES）で1〜5に変換した評価値を使う。
// 内部タブ（state.rankGradeView）で「着順系」「打ち筋系」を切替。対象プレイヤー選択は両タブで共有する。
function renderRankGradeSection(stats){
  const allNames = stats.map(s=>s.name);
  if(state.rankGradeTargets === null){
    if(allNames.length <= RANKGRADE_DEFAULT_TARGET_COUNT){
      state.rankGradeTargets = allNames.slice();
    }else{
      state.rankGradeTargets = stats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount)
        .slice(0, RANKGRADE_DEFAULT_TARGET_COUNT).map(s=>s.name);
    }
  }else{
    state.rankGradeTargets = state.rankGradeTargets.filter(n=>allNames.includes(n));
  }
  const targets = state.rankGradeTargets;
  const targetChips = stats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).map(s=>{
    const on = targets.includes(s.name);
    return `<label class="chip roster-chip target-chip ${on?'on':''}">
      <input type="checkbox" data-rankgrade-toggle="${escapeAttr(s.name)}" ${on?'checked':''}>${escapeHtml(s.name)}<span class="chip-n">${s.hanchanRankedCount}半荘</span></label>`;
  }).join("");
  const viewTabs = Object.keys(RANK_GRADE_AXES).map(key=>{
    const active = state.rankGradeView===key;
    return `<button type="button" role="tab" aria-selected="${active}" class="rankgrade-tab ${active?'active':''}" data-rankgrade-view="${key}">${RANK_GRADE_VIEW_LABELS[key]}</button>`;
  }).join("");
  const head = `
    <div class="rankgrade-tabs" role="tablist">${viewTabs}</div>
    <div class="target-select">
      <span class="chip-bar-label">対象プレイヤー<small>（しきい値の基準にも、カード表示にも使用。初期表示は目安${RANKGRADE_DEFAULT_TARGET_COUNT}名、チェックで自由に増減できます）</small></span>
      <div class="chip-row">${targetChips}</div>
    </div>`;
  if(!targets.length){
    return `<div class="card">${head}<div class="empty">対象プレイヤーを1人以上選択してください。</div></div>`;
  }
  const axes = RANK_GRADE_AXES[state.rankGradeView];
  const rankAxes = RANK_GRADE_AXES.rank;
  const RANK_TOTAL_MAX = rankAxes.length*5; // 着順系6軸×5点＝30点固定
  // 着順系の合計値・順位は、タブに関わらず常に「対象プレイヤー全員」を基準に計算する（打ち筋系の対象絞り込みの影響を受けない）。
  const basisStatsFull = stats.filter(s=>targets.includes(s.name));
  const rankDynBandsArr = rankAxes.map(ax=>computeDynamicBands(ax, basisStatsFull));
  const rankGradesByName = {};
  stats.forEach(s=>{
    rankGradesByName[s.name] = rankAxes.map((ax,i)=>levelFromDynamicBands(ax.toDisplay(ax.value(s)), rankDynBandsArr[i], ax.higherBetter));
  });
  const totalByName = {};
  stats.forEach(s=>{ totalByName[s.name] = rankGradesByName[s.name].reduce((a,b)=>a+b,0); });
  const rankOrderFull = basisStatsFull.slice().sort((a,b)=>totalByName[b.name]-totalByName[a.name]);
  const rankByName = {};
  rankOrderFull.forEach((s,i)=>{
    if(i===0){ rankByName[s.name]=1; }
    else{
      const prevName = rankOrderFull[i-1].name;
      rankByName[s.name] = totalByName[s.name]===totalByName[prevName] ? rankByName[prevName] : i+1;
    }
  });
  const RANK_TARGET_COUNT = basisStatsFull.length; // 「◯人中◯位」の分母（対象プレイヤー全員数、タブに依存しない）
  // 打ち筋系は局ごとの詳細記録（リーチ・副露等）が無いと全項目0%になり評価が意味を持たないため、
  // 現在表示中タブの軸のしきい値算出・カード表示に限っては総局数0人を候補から除外する（着順系は半荘の最終着順があれば成立するため除外なし）。
  const isViewEligible = s => state.rankGradeView!=="style" || s.kyokuCount>0;
  const eligibleStats = stats.filter(isViewEligible);
  const excludedByNoKyoku = stats.filter(s=>!isViewEligible(s));
  const basisStats = eligibleStats.filter(s=>targets.includes(s.name));
  if(!basisStats.length){
    const reason = excludedByNoKyoku.length && state.rankGradeView==="style"
      ? "対象プレイヤーの中に、局ごとの詳細記録（総局数）があるプレイヤーがいません。"
      : "対象プレイヤーを1人以上選択してください。";
    return `<div class="card">${head}<div class="empty">${reason}</div></div>`;
  }
  const dynBandsArr = axes.map(ax=>computeDynamicBands(ax, basisStats));
  const gradesByName = {}; // 現在のタブの軸別評価（レーダー形状・凡例・しきい値表用、対象は評価が意味を持つプレイヤーのみ）
  eligibleStats.forEach(s=>{
    gradesByName[s.name] = axes.map((ax,i)=>levelFromDynamicBands(ax.toDisplay(ax.value(s)), dynBandsArr[i], ax.higherBetter));
  });
  function fmtBandNum(ax, v){
    if(ax.unit==="rank") return v.toFixed(2);
    return v.toFixed(1)+"%";
  }
  const thresholdRows = axes.map((ax,i)=>{
    const bands = dynBandsArr[i];
    const cells = [5,4,3,2,1].map(lv=>{
      if(bands.degenerate) return `<td>${fmtBandNum(ax,bands.edges[0])}（全員同値）</td>`;
      const seg = ax.higherBetter ? lv-1 : 5-lv; // セグメント番号（0〜4、低い方から）
      const [first,second] = ax.higherBetter ? [bands.edges[seg+1],bands.edges[seg]] : [bands.edges[seg],bands.edges[seg+1]];
      return `<td>${fmtBandNum(ax,first)}〜${fmtBandNum(ax,second)}</td>`;
    }).join("");
    return `<tr><th class="col-name">${ax.label}</th>${cells}</tr>`;
  }).join("");
  const thresholdTable = `
    <div class="card-title">評価しきい値の判定基準<small>選択した対象プレイヤーの実績を5等分した相対基準</small></div>
    <div class="table-scroll">
      <table class="stat-mini-table">
        <thead><tr><th class="col-name">評価軸</th><th>5</th><th>4</th><th>3</th><th>2</th><th>1</th></tr></thead>
        <tbody>${thresholdRows}</tbody>
      </table>
    </div>`;
  const playerRows = eligibleStats.slice().sort((a,b)=> totalByName[b.name]-totalByName[a.name]).map(s=>{
    const grades = gradesByName[s.name];
    const cells = axes.map((ax,i)=>`<td class="grade-cell">${ax.fmt(ax.value(s))}<small>評価${grades[i]}</small></td>`).join("");
    return `<tr><th class="col-name">${escapeHtml(s.name)}</th>${cells}<td style="font-weight:700;">${totalByName[s.name]}<span class="n-sub" style="margin-left:1px;">/${RANK_TOTAL_MAX}</span></td></tr>`;
  }).join("");
  const playerTableNote = state.rankGradeView==="style" && excludedByNoKyoku.length
    ? `選手別の実測値と評価（対象プレイヤー選択に関わらず表示。局ごとの詳細記録がない${excludedByNoKyoku.length}名は除外：${excludedByNoKyoku.map(s=>escapeHtml(s.name)).join("、")}）`
    : "選手別の実測値と評価（対象プレイヤー選択に関わらず全員分を表示）";
  const playerTable = `
    <div class="card-title">選手別の実測値と評価<small>${playerTableNote.replace(/^選手別の実測値と評価/,"")}</small></div>
    <div class="table-scroll">
      <table class="stat-mini-table">
        <thead><tr><th class="col-name">選手</th>${axes.map(ax=>`<th>${ax.label}</th>`).join("")}<th>合計（着順系）</th></tr></thead>
        <tbody>${playerRows}</tbody>
      </table>
    </div>`;
  const cardStats = basisStats.slice().sort((a,b)=> totalByName[b.name]-totalByName[a.name]);
  const cards = cardStats.map((s,i)=>{
    const grades = gradesByName[s.name];
    const color = entityColor(s.name, stats);
    return renderRankGradeCard(s, grades, totalByName[s.name], RANK_TOTAL_MAX, rankByName[s.name], RANK_TARGET_COUNT, color, `rankgrade-svg-${i}`, axes);
  }).join("");
  const eligibilityNote = state.rankGradeView==="style" && excludedByNoKyoku.length
    ? `対象プレイヤーのうち、局ごとの詳細記録（総局数）がない${excludedByNoKyoku.length}名（${excludedByNoKyoku.filter(s=>targets.includes(s.name)).map(s=>escapeHtml(s.name)).join("、")||"該当者なし"}）はしきい値の算出・カード表示から除外しています。`
    : "";
  return `
    <div class="card">
      ${head}
    </div>
    <div class="radar-grid">${cards}</div>
    <div class="felt-note">各軸は選択中の対象プレイヤーの実績範囲を5等分したしきい値で1〜5段階に変換した評価値（外周＝5、中心＝1）。${RANK_GRADE_VIEW_NOTES[state.rankGradeView]}合計値・順位はタブに関わらず常に「着順系」の評価を基準に表示しています。${eligibilityNote}</div>
    <div class="card">
      ${thresholdTable}
      ${playerTable}
    </div>`;
}

// ④成績5段階評価：選手1人分の個別レーダーカード（③相性レーダーチャートと同じカードUIを流用）。
function renderRankGradeCard(s, grades, total, totalMax, rank, targetCount, color, svgId, axes){
  const w=280, h=280, cx=140, cy=140, r=80;
  const n = axes.length;
  const angleFor = i => -Math.PI/2 + i*(2*Math.PI/n);
  const axisLines = axes.map((ax,i)=>{
    const a=angleFor(i); const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${CHART_GRID}" stroke-width="1"/>`;
  }).join("");
  const gridPolys = [1,2,3,4,5].map(level=>{
    const pts = axes.map((ax,i)=>{ const a=angleFor(i), rr=r*(level/5); return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`; }).join(" ");
    return `<polygon points="${pts}" fill="${level===5?'rgba(125,118,98,0.05)':'none'}" stroke="${level===5?CHART_GRID_STRONG:CHART_GRID}" stroke-width="1" stroke-dasharray="${level===5?'0':'2,3'}"/>`;
  }).join("");
  const labels = axes.map((ax,i)=>{
    const a=angleFor(i), sinA=Math.sin(a); const x=cx+(r+12)*Math.cos(a), y=cy+(r+11)*sinA + (sinA>0.3?9:sinA<-0.3?-1:4); // 上下の軸はラベルを頂点から離し、左右は縦中央に揃える
    const cosA=Math.cos(a); const anchor = cosA>0.3?"start":cosA<-0.3?"end":"middle";
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="11.5" fill="${CHART_TEXT}" text-anchor="${anchor}">${ax.label}</text>`;
  }).join("");
  const dataPts = axes.map((ax,i)=>{
    const a=angleFor(i); const rr = r*(grades[i]/5);
    return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`;
  }).join(" ");
  const dataPoly = `<polygon points="${dataPts}" fill="${color}" fill-opacity="0.16" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  const dataDots = dataPts.split(" ").map(pt=>{ const [x,y]=pt.split(","); return `<circle cx="${x}" cy="${y}" r="2.6" fill="${color}" stroke="#fbf8ef" stroke-width="1.5"/>`; }).join("");
  // 評価は数値＋5段の目盛り（塗りの数）で示す
  const pips = g => `<span class="grade-pips" aria-hidden="true">${[1,2,3,4,5].map(k=>`<i class="${k<=g?'on':''}"></i>`).join("")}</span>`;
  const legendRows = axes.map((ax,i)=>`
    <div class="compat-legend-row" title="評価${grades[i]}">
      <span>${ax.label}</span>
      <span>${ax.fmt(ax.value(s))}<small>評価${grades[i]}</small>${pips(grades[i])}</span>
    </div>`).join("");
  return `
    <div class="radar-grid-card">
      <div class="radar-grid-card-head">
        <h3 style="font-size:18px;">${myTile(s.name,"sm")}${escapeHtml(s.name)}</h3>
        <div class="grade-total"><span style="margin:0 2px 0 0;">合計</span><b>${total}</b><span>/${totalMax}</span><em>着順系・${targetCount}人中${rank}位</em></div>
      </div>
      <svg viewBox="-2 36 ${w+4} ${h-72}" id="${svgId}" class="radar-svg" role="img" aria-label="${escapeAttr(s.name)}の成績レーダーチャート">
        ${gridPolys}${axisLines}${dataPoly}${dataDots}${labels}
      </svg>
      ${legendRows}
    </div>`;
}

// ---------- render: ⑤放銃マトリクス ----------
// 行＝放銃したプレイヤー、列＝その放銃でロン和了したプレイヤー。値＝回数。
// 対象はサイドバー共通の期間・曜日フィルタ内の局（チョンボ・結果のみ入力の局は除く）。複数ロンの場合は和了者それぞれに1回ずつ数える。
const HOUJUU_MATRIX_DEFAULT_TARGET_COUNT = 6;
const HOUJUU_MATRIX_OTHER = "その他";
// ⑤放銃マトリクス（比率表示）の分母：2人が同卓した局数・本人の総局数・対象外の誰かと同卓した局数。
// 対象は放銃の集計と同じ局（期間・曜日フィルタ内、チョンボ・結果のみ入力の局を除く）。
function computeHoujuuCoKyoku(targetSet){
  const pair = new Map(), kyoku = new Map(), otherKyoku = new Map();
  (state.raw.records||[]).forEach(r=>{
    if(!passesFilters(r.date)) return;
    if(r.resultType==="chombo" || r.resultType==="resultonly") return;
    const names = namesForHanchan(r.date, r.hanchanNo).map((n,i)=>n || `P${i+1}`);
    const hasOther = names.some(n=>!targetSet.has(n));
    names.forEach(a=>{
      kyoku.set(a,(kyoku.get(a)||0)+1);
      if(names.some(n=>n!==a && !targetSet.has(n))) otherKyoku.set(a,(otherKyoku.get(a)||0)+1);
      names.forEach(b=>{ if(a!==b) pair.set(a+"\t"+b,(pair.get(a+"\t"+b)||0)+1); });
    });
  });
  return {pair, kyoku, otherKyoku};
}
function computeHoujuuMatrix(){
  const m = new Map(); // "放銃者\t和了者" -> 回数
  (state.raw.records||[]).forEach(r=>{
    if(!passesFilters(r.date)) return;
    if(r.resultType==="chombo" || r.resultType==="resultonly") return;
    const names = namesForHanchan(r.date, r.hanchanNo);
    const ronIdx = [];
    for(let j=0;j<4;j++){ if(r.stats[j] && r.stats[j][K_RON]===1) ronIdx.push(j); }
    if(!ronIdx.length) return;
    r.stats.forEach((s,i)=>{
      if(!s || s[K_HOUJUU]!==1) return;
      const from = names[i] || `P${i+1}`;
      ronIdx.forEach(w=>{
        if(w===i) return;
        const to = names[w] || `P${w+1}`;
        const key = from+"\t"+to;
        m.set(key, (m.get(key)||0)+1);
      });
    });
  });
  return m;
}
function renderHoujuuMatrixSection(allStats){
  const allNames = allStats.map(s=>s.name);
  if(state.houjuuMatrixTargets === null){
    state.houjuuMatrixTargets = allNames.length<=HOUJUU_MATRIX_DEFAULT_TARGET_COUNT ? allNames.slice()
      : allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).slice(0,HOUJUU_MATRIX_DEFAULT_TARGET_COUNT).map(s=>s.name);
  }else{
    state.houjuuMatrixTargets = state.houjuuMatrixTargets.filter(n=>allNames.includes(n));
  }
  const targets = state.houjuuMatrixTargets;
  const targetChips = allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).map(s=>{
    const on = targets.includes(s.name);
    return `<label class="chip roster-chip target-chip ${on?'on':''}">
      <input type="checkbox" data-houjuumatrix-toggle="${escapeAttr(s.name)}" ${on?'checked':''}>${escapeHtml(s.name)}<span class="chip-n">${s.hanchanRankedCount}半荘</span></label>`;
  }).join("");
  const head = `
    <div class="target-select">
      <span class="chip-bar-label">対象プレイヤー<small>（初期表示は目安${HOUJUU_MATRIX_DEFAULT_TARGET_COUNT}名、チップで自由に増減できます。対象外の相手への放銃・からの和了は「${HOUJUU_MATRIX_OTHER}」列・行にまとめます）</small></span>
      <div class="chip-row">${targetChips}</div>
    </div>`;
  if(targets.length < 2){
    return `<div class="card">${head}<div class="empty">対象プレイヤーを2人以上選択してください。</div></div>`;
  }
  const m = computeHoujuuMatrix();
  const get = (a,b)=> m.get(a+"\t"+b)||0;
  const targetSet = new Set(targets);
  const rateMode = state.houjuuMatrixMode === "rate";
  const co = rateMode ? computeHoujuuCoKyoku(targetSet) : null;
  // 対象外プレイヤーとの放銃・和了は「その他」に合算する（行・列の合計が実際の回数と一致するようにする）
  const otherCol = name => { let n=0; m.forEach((v,k)=>{ const [a,b]=k.split("\t"); if(a===name && !targetSet.has(b)) n+=v; }); return n; };
  const otherRow = name => { let n=0; m.forEach((v,k)=>{ const [a,b]=k.split("\t"); if(b===name && !targetSet.has(a)) n+=v; }); return n; };
  const otherCols = targets.map(otherCol), otherRows = targets.map(otherRow);
  const showOther = otherCols.some(v=>v>0) || otherRows.some(v=>v>0);
  // 比率：放銃者・和了者が同卓した局数を分母にする（対局数が違う相手同士でも比べられるように）
  const pairRate = (a,b)=>{ const n = co.pair.get(a+"\t"+b)||0; return n ? get(a,b)/n : null; };
  const fmtR = v => v===null ? "－" : (v*100).toFixed(1)+"%";
  const inner = [];
  targets.forEach(a=>targets.forEach(b=>{ if(a!==b){ const v = rateMode ? pairRate(a,b) : get(a,b); if(v!==null) inner.push(v); } }));
  const maxCell = Math.max(rateMode ? 1e-9 : 1, ...inner);
  const heat = v => v>0 ? `background:rgba(184,50,42,${(0.07 + 0.38*v/maxCell).toFixed(3)}); box-shadow:inset 0 0 0 1.5px #f1eadb;` : ""; // 濃淡セル同士の間に細い地色の隙間
  const colTotals = targets.map((b,j)=> targets.reduce((a,x)=>a+(x===b?0:get(x,b)),0) + otherRows[j]);
  const headerCells = targets.map(n=>`<th>${escapeHtml(n)}</th>`).join("")
    + (showOther ? `<th>${HOUJUU_MATRIX_OTHER}</th>` : "") + `<th>放銃計</th>`;
  const bodyRows = targets.map((a,i)=>{
    const cells = targets.map(b=>{
      if(a===b) return `<td style="color:var(--muted);">－</td>`;
      if(rateMode){
        const v = pairRate(a,b), n = co.pair.get(a+"\t"+b)||0;
        return `<td style="${v?heat(v):""}" title="${get(a,b)}回 ÷ 同卓${n}局">${fmtR(v)}</td>`;
      }
      const v = get(a,b);
      return `<td style="${heat(v)}">${v}</td>`;
    }).join("");
    const rowTotal = targets.reduce((t,b)=>t+(a===b?0:get(a,b)),0) + otherCols[i];
    const otherCell = rateMode ? fmtR(co.otherKyoku.get(a) ? otherCols[i]/co.otherKyoku.get(a) : null) : otherCols[i];
    const totalCell = rateMode ? fmtR(co.kyoku.get(a) ? rowTotal/co.kyoku.get(a) : null) : rowTotal;
    return `<tr><td class="col-name"><span style="display:inline-flex; align-items:center; gap:8px;">${myTile(a,"xs")}${escapeHtml(a)}</span></td>${cells}${showOther?`<td style="color:var(--muted);">${otherCell}</td>`:""}<td style="font-weight:700; border-left:1px solid var(--rule);">${totalCell}</td></tr>`;
  }).join("");
  const otherBodyRow = showOther
    ? `<tr><td class="col-name" style="color:var(--muted);">${HOUJUU_MATRIX_OTHER}</td>${otherRows.map((v,j)=>`<td style="color:var(--muted);">${rateMode ? fmtR(co.otherKyoku.get(targets[j]) ? v/co.otherKyoku.get(targets[j]) : null) : v}</td>`).join("")}<td></td><td></td></tr>` : "";
  const totalRow = `<tr><td class="col-name" style="border-top:1.5px solid var(--rule-strong);">ロン和了計</td>${colTotals.map((v,j)=>`<td style="font-weight:700; border-top:1.5px solid var(--rule-strong);">${rateMode ? fmtR(co.kyoku.get(targets[j]) ? v/co.kyoku.get(targets[j]) : null) : v}</td>`).join("")}${showOther?'<td style="border-top:1.5px solid var(--rule-strong);"></td>':""}<td style="border-top:1.5px solid var(--rule-strong);"></td></tr>`;
  return `
    <div class="card">
      ${head}
      <div class="compare-toolbar">
        <div class="seg" role="group" aria-label="表示">
          <button type="button" class="seg-btn ${rateMode?'':'on'}" data-houjuumatrix-mode="count" aria-pressed="${!rateMode}">回数</button>
          <button type="button" class="seg-btn ${rateMode?'on':''}" data-houjuumatrix-mode="rate" aria-pressed="${rateMode}">比率</button>
        </div>
        <div class="note" style="margin:0;">${rateMode ? "比率＝放銃回数 ÷ その2人が同卓した局数。放銃計・ロン和了計は ÷ 本人の総局数" : "単日など、同じメンバーで打った期間の比較に向いています"}</div>
      </div>
      <div class="table-scroll">
        <table class="stat-mini-table" id="houjuu-matrix-table">
          <tr><th class="col-name">放銃者＼和了者</th>${headerCells}</tr>
          ${bodyRows}${otherBodyRow}${totalRow}
        </table>
      </div>
      <div class="note">※セルの色が濃いほど${rateMode?"比率が高い":"回数が多い"}（対象プレイヤー同士のセルの最大値を基準）。サイドバーの期間・曜日フィルタ内の局が対象（チョンボ・結果のみ入力の局は除く）。ダブロンの場合は和了者それぞれに1回ずつ数える。</div>
    </div>`;
}


// ===================== 見て楽しい分析：マイ牌・称号・卓を囲む・点棒メーター・リプレイ =====================
// マイ牌：名前の1文字目を字牌のように刻んだアイコン。1文字目が他の選手と重なる場合は2文字を小さく刻む。
// 文字はCSSの::before（data-ch）で描くため、表のテキスト（コピー・読み上げ用）には混ざらない。
function myTile(name, size){
  const all = globalPlayerOrder();
  const c = (name||"?").charAt(0);
  const ch = all.filter(n=>n && n.charAt(0)===c).length > 1 ? (name||"").slice(0,2) : c;
  return `<span class="mytile ${size||''} ${ch.length>1?'two':''}" style="--pc:${entityColor(name)};" data-ch="${escapeAttr(ch)}" aria-hidden="true"></span>`;
}

// 称号カード：期間（サイドバーの期間・曜日フィルタ）内の成績で付ける。

// 二つ名は画面上で編集でき、この端末のブラウザに保存する（TITLE_NAMES_KEY）。未設定なら既定の名前。
const TITLE_DEFS = [

  // ここから下は「珍」称号：良い成績ではないが、ユーモアで讃える（バッジは「ワースト」）
  {id:"chaos",  name:"混沌の使者", cat:"珍",     metric:"副露後和了率", badge:"ワースト", desc:"鳴く度に卓がざわつく。……で、どうするの？", key:"fuuroAgariRate", better:"low", fmt:fmtPct, base:"fuuro"},

];
const TITLE_SHARE = 0.3; // 対象条件：期間内の最多の人の何割以上か
const TITLE_NAMES_KEY = "mj-viewer-title-names";
function loadTitleNames(){ try{ return JSON.parse(localStorage.getItem(TITLE_NAMES_KEY)||"{}")||{}; }catch(e){ return {}; } }
function saveTitleNames(obj){ try{ localStorage.setItem(TITLE_NAMES_KEY, JSON.stringify(obj)); return true; }catch(e){ return false; } }
function titleName(def){ const custom = loadTitleNames()[def.id]; return (custom && String(custom).trim()) || def.name; }
function titleThresholds(stats){
  const mx = k => Math.max(0, ...stats.map(s=>s[k]||0));
  const th = (k, floor) => Math.max(floor, Math.ceil(mx(k)*TITLE_SHARE));
  return {rank:th("hanchanRankedCount",2), kyoku:th("kyokuCount",16), riichi:th("riichi",5), fuuro:th("fuuro",5), oya:th("oyaKyoku",4)};
}
const TITLE_BASE_FIELD = {rank:"hanchanRankedCount", kyoku:"kyokuCount", riichi:"riichi", fuuro:"fuuro", oya:"oyaKyoku"};
const TITLE_BASE_UNIT = {rank:"半荘", kyoku:"局", riichi:"リーチ", fuuro:"副露", oya:"親番の局"};
function computeTitles(stats){
  const T = titleThresholds(stats);
  return TITLE_DEFS.map(t=>{
    const pool = stats.filter(s=>(s[TITLE_BASE_FIELD[t.base]]||0) >= T[t.base] && (t.base==="rank" || s.kyokuCount>=T.kyoku));
    if(!pool.length) return {...t, empty:true, need:T[t.base]};
    const sorted = pool.slice().sort((a,b)=> t.better==="high" ? b[t.key]-a[t.key] : a[t.key]-b[t.key]);
    const best = t.fmt(sorted[0][t.key]);
    const winners = sorted.filter(s=>t.fmt(s[t.key])===best);
    const next = sorted.find(s=>t.fmt(s[t.key])!==best) || null;
    return {...t, winners, next, poolSize:pool.length, need:T[t.base]};
  });
}
// 二つ名が長いとき（編集した名前を含む）は、1行に収まるよう字間と文字サイズを段階的に詰める
function ttlNameSize(name){ const n = Array.from(String(name||"")).length; return n>=9 ? "is-long" : n>=7 ? "is-mid" : ""; }
function renderTitleCard(t){

  const head = `<div class="ttl-metric">${escapeHtml(t.metric)}<b>${escapeHtml(t.badge||"1位")}</b></div>

// 期間プリセット：サイドバーの期間フィルタをワンタップで設定する。基準日はデータ上の最新対局日。
function latestDataDate(){ const g = hanchanGroups().filter(g=>state.raw.hanchanConfirmed[`${g.date}_${g.hanchanNo}`]); return g.length ? g[g.length-1].date : ""; }
function shiftDate(dateStr, months){ const [y,m,d]=dateStr.split("-").map(Number); const dt=new Date(y, m-1+months, d+1); const p=n=>String(n).padStart(2,"0"); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
function periodPresets(){
  const last = latestDataDate();
  if(!last) return [{id:"all", label:"全期間", from:"", to:""}];
  return [
    {id:"all", label:"全期間", from:"", to:""},
    {id:"day", label:"直近の対局日", from:last, to:last},

}
function periodLabel(){
  const r = state.dateRange, f = r.from && r.from.replace(/-/g,"/"), t = r.to && r.to.replace(/-/g,"/");
  const base = !f && !t ? "全期間" : (f && t && f===t) ? `${f}（単日）` : `${f||"最初"}〜${t||"最新"}`;
  return base + (state.dayFilter==="weekday" ? "・平日のみ" : state.dayFilter==="weekend" ? "・週末のみ" : "");
}
function renderTitlesBlock(stats){

  return `<div class="stats-hero">
