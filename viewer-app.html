<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻雀スタッツ（PC分析ビューア）</title>
<link rel="icon" href="./favicon-viewer.ico">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-viewer-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-viewer-16.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-viewer.png">
<link rel="manifest" href="./manifest-viewer.json">
<meta name="theme-color" content="#C98A2B">
<meta name="apple-mobile-web-app-title" content="麻雀分析">
<style>
  :root{
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --ink:#242629;
    --muted:#767b83;
    --line:#E4DFD3;
    --primary:#1F6F54;
    --primary-dark:#154A38;
    --primary-tint:#E4EFE9;
    --houjuu:#B23A2E;
    --ron:#2E6DA4;
    --radius:14px;
    --sidebar-w:252px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Segoe UI",sans-serif;
    height:100%;}
  #app{min-height:100vh; display:flex;}

  /* ---------- loader screen ---------- */
  .loader-screen{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .loader-card{max-width:480px; width:100%; text-align:center; padding:44px 36px; border:2px dashed var(--line);
    border-radius:20px; background:var(--surface); transition:border-color .15s, background .15s;}
  .loader-card.dragover{border-color:var(--primary); background:var(--primary-tint);}
  .loader-icon{font-size:40px; margin-bottom:8px;}
  .loader-card h1{font-size:19px; margin:0 0 12px; letter-spacing:.02em;}
  .loader-desc{font-size:13px; color:var(--muted); line-height:1.8; margin:0 0 22px;}
  .file-select-btn{display:inline-block; padding:12px 28px; border-radius:999px; background:var(--primary);
    color:#fff; font-size:14px; font-weight:800; cursor:pointer;}
  .file-select-btn:hover{background:var(--primary-dark);}
  .loader-hint{font-size:12px; color:var(--muted); margin:18px 0 0;}
  .loader-note{font-size:11px; color:var(--muted); margin:20px 0 0; padding-top:16px; border-top:1px solid var(--line);}
  .loader-error{font-size:12px; color:var(--houjuu); font-weight:700; margin-top:12px; min-height:16px;}

  /* ---------- sidebar ---------- */
  .sidebar{width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .app-title{font-size:15px; font-weight:800; line-height:1.4; margin-bottom:16px;}
  .sidebar-summary{border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:16px;}
  .summary-line{font-size:11.5px; color:var(--muted); font-weight:600; line-height:1.9;}
  .sidebar-date-filter{border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:16px;}
  .sidebar-date-filter .chip-bar-label{display:block; margin-bottom:8px;}
  .sidebar-date-label{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px;
    font-weight:700; color:var(--muted); margin-bottom:6px;}
  .sidebar-date-label input[type=date]{border:1.5px solid var(--line); border-radius:8px; padding:5px 6px; font-size:12px;
    font-weight:700; color:var(--ink); background:var(--surface); font-family:inherit; flex:1; min-width:0;}
  .day-filter-row{display:flex; gap:6px; margin-top:6px;}
  .day-filter-btn{flex:1; padding:6px 4px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface);
    color:var(--muted); font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit;}
  .day-filter-btn:hover{background:var(--bg);}
  .day-filter-btn.on{background:var(--primary-tint); border-color:var(--primary); color:var(--primary);}
  .side-nav{display:flex; flex-direction:column; gap:4px;}
  .side-nav button{display:flex; align-items:center; gap:10px; text-align:left; padding:11px 12px; border-radius:11px;
    border:none; background:transparent; font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer;
    font-family:inherit;}
  .side-nav button:hover{background:var(--bg);}
  .side-nav button.active{background:var(--primary-tint); color:var(--primary);}
  .nav-num{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:7px;
    background:var(--bg); font-size:11px; font-weight:800; flex:0 0 auto;}
  .side-nav button.active .nav-num{background:var(--primary); color:#fff;}
  .reload-btn{margin-top:auto; padding:10px 0; border:1px solid var(--line); border-radius:10px; background:var(--surface);
    color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;}
  .reload-btn:hover{background:var(--bg);}

  /* ---------- main ---------- */
  .main{flex:1; padding:28px 36px 60px; max-width:1280px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:20px;}
  .card h2{font-size:16px; font-weight:800; margin:0; letter-spacing:.01em;}
  .card h3{font-size:14px; font-weight:800; margin:0;}
  .n-sub{color:var(--muted); font-weight:600; margin-left:8px; font-size:11.5px;}
  .section-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .tool-btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:12px; font-weight:700;
    border-radius:9px; padding:8px 14px; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .tool-btn:hover{background:var(--bg);}
  .tool-btn:disabled{opacity:.4; cursor:default;}
  .tool-btn.small{padding:5px 10px; font-size:11px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:26px 0;}

  /* chip bar (shared selection, currently used by ②) */
  .chip-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; margin-bottom:20px;}
  .chip-bar-label{font-size:11.5px; font-weight:800; color:var(--muted); margin-right:2px;}
  .chip-bar-empty{font-size:12px; color:var(--muted);}
  .sel-chip{display:inline-flex; align-items:center; gap:6px; border:1.5px solid; border-radius:999px; padding:5px 6px 5px 12px;
    font-size:12.5px; font-weight:800;}
  .sel-chip button{border:none; background:transparent; color:inherit; font-weight:800; font-size:13px; cursor:pointer;
    padding:2px 4px; line-height:1;}
  .chip-clear-btn{margin-left:auto; border:none; background:transparent; color:var(--muted); font-size:11.5px;
    font-weight:700; cursor:pointer; text-decoration:underline; font-family:inherit;}

  /* tables */
  .table-scroll{overflow-x:auto;}
  .stat-mini-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .stat-mini-table th{color:var(--muted); font-weight:700; padding:9px 8px; text-align:center; white-space:nowrap; cursor:default;}
  .stat-mini-table td{padding:10px 8px; text-align:center; font-weight:700; border-top:1px solid var(--line);}
  .stat-mini-table tr:nth-child(even) td{background:rgba(118,123,131,.06);}
  .stat-mini-table .col-name{text-align:left; font-weight:800; white-space:nowrap;}
  #compare-table .col-name{position:sticky; left:0; z-index:1; background:var(--surface);
    box-shadow:2px 0 4px -2px rgba(36,38,41,.18);}
  #compare-table tr:nth-child(even) .col-name{background:var(--bg);}
  #compare-table th.col-name{z-index:2;}
  tr.compare-group-row td.compare-group-cell{background:var(--bg); font-weight:800; text-align:left; cursor:pointer;}
  #compare-table tr.compare-group-row td.compare-group-cell{position:static !important; box-shadow:none !important;}
  .compare-group-arrow{display:inline-block; width:14px; margin-right:4px; font-size:11px; color:var(--muted);}
  tr.compare-subgroup-row td.compare-subgroup-cell{background:transparent; font-weight:800; font-size:12px; color:var(--muted); text-align:left;
    padding-top:12px; padding-bottom:2px; border-top:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #compare-table tr.compare-subgroup-row td.compare-subgroup-cell{position:static !important; box-shadow:none !important;}
  .compare-subgroup-desc{font-weight:500; font-size:10.5px; color:var(--muted); opacity:.75; margin-left:8px;}
  td.compare-metric-indent{padding-left:22px;}
  .stat-mini-table .col-rank{width:44px; color:var(--muted); font-weight:800;}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{padding:6px 12px; border-radius:999px; background:var(--bg); border:1px solid var(--line);
    font-size:12.5px; color:var(--muted); font-weight:700; cursor:pointer; font-family:inherit;}
  .roster-chip input{margin-right:5px; vertical-align:middle;}
  .legend-chip{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:var(--surface);}
  .legend-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .legend-row{margin-top:14px;}
  .axis-note{display:block; margin-top:10px; line-height:1.7;}

  .target-select{margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .target-select .chip-bar-label{display:block; margin-bottom:8px;}
  .target-chip.on{background:var(--primary-tint); border-color:var(--primary); color:var(--primary);}


  /* ---------- 統計タブ：プレイヤー別スタッツカード ---------- */
  .stats-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(360px,100%),1fr)); gap:16px;}
  .stat-player-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
  .stat-name{font-size:16px; font-weight:800;}
  .stat-section-label{font-size:11.5px; font-weight:800; color:var(--muted); letter-spacing:.05em;
    margin:14px 0 8px; text-transform:uppercase;}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat-tile{background:var(--bg); border-radius:10px; padding:10px 8px; text-align:center;}
  .stat-tile .v{font-size:18px; font-weight:800;}
  .stat-tile .l{font-size:11.5px; color:var(--muted); font-weight:700; margin-top:3px;}
  .stat-tile .n{font-size:10.5px; color:var(--muted); font-weight:600; margin-top:1px; opacity:.75;}
  .row-between{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .glossary{font-size:12.5px; color:var(--muted); line-height:1.8; padding-top:2px;}

  .radar-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(300px,100%),1fr)); gap:18px;}
  .radar-grid-card{border:1px solid var(--line); border-radius:12px; padding:16px;}
  .radar-grid-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .radar-grid-card-head h3{font-size:14px; font-weight:800; margin:0;}
  .compat-legend-row{display:flex; justify-content:space-between; padding:3px 0; font-size:12px; color:var(--muted); font-weight:700;}

  .rankgrade-tabs{display:flex; gap:8px; margin:10px 0 16px;}
  .rankgrade-tab{padding:8px 18px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface);
    color:var(--muted); font-weight:800; font-size:13px; cursor:pointer; font-family:inherit;}
  .rankgrade-tab:hover{background:var(--bg);}
  .rankgrade-tab.active{background:var(--primary); border-color:var(--primary); color:#fff;}

  .toast{position:fixed; left:50%; top:24px; transform:translateX(-50%); background:var(--primary-dark); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:50;}
  .toast.show{opacity:1;}

  @media (max-width:900px){
    #app{flex-direction:column;}
    .sidebar{width:100%; flex:0 0 auto; height:auto; position:relative; flex-direction:row; align-items:center; flex-wrap:wrap; gap:12px;}
    .side-nav{flex-direction:row; flex-wrap:wrap;}
    .sidebar-date-filter{border-bottom:none; padding-bottom:0; margin-bottom:0; max-width:220px;}
    .reload-btn{margin-top:0;}
    .main{padding:20px;}
  }
  /* スマホ縦画面など幅が狭い場合は、余白と1タイルあたりの列数をさらに詰める */
  @media (max-width:480px){
    .main{padding:14px;}
    .card{padding:16px 14px;}
    .loader-card{padding:32px 20px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .sidebar-date-filter{max-width:none; width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- 定数 ----------
const K_RIICHI=0, K_FUURO=1, K_TSUMO=2, K_RON=3, K_HOUJUU=4, K_CHOMBO=5;
const CHART_PALETTE = ["#1F6F54","#2E6DA4","#C98A2B","#B23A2E","#6B4FA0","#3B8C6E","#8B94A0","#A9673A"];

// ①比較表：折りたたみ可能なグループ定義
const COMPARE_METRIC_GROUPS = [
  {key:"rank", label:"着順系"},
  {key:"score", label:"打ち筋系"},
  {key:"breakdown", label:"和了/放銃　内訳"},
];
// ①比較表：サブグループ見出し（リーチ後／副露後／和了内訳／放銃内訳／放銃相手内訳）に添える1行説明
const COMPARE_SUBGROUP_DESC = {
  "和了内訳": "プレイヤーの和了形",
  "放銃内訳": "放銃時の自分の手の状態",
  "放銃相手内訳": "放銃した相手の和了形",
};
const COMPARE_METRICS = [
  {key:"kyokuCount", label:"総局数", fmt:fmtCount, group:"score"},
  {key:"hanchanRankedCount", label:"半荘数", fmt:fmtCount, group:"rank"},
  {key:"avgRank", label:"平均順位", fmt:fmtAvg, group:"rank"},
  {key:"top", label:"トップ率", fmt:fmtPct, group:"rank"},
  {key:"second", label:"2着率", fmt:fmtPct, group:"rank"},
  {key:"third", label:"3着率", fmt:fmtPct, group:"rank"},
  {key:"last", label:"ラス率", fmt:fmtPct, group:"rank"},
  {key:"agari", label:"和了数", fmt:fmtCount, group:"score"},
  {key:"agariRate", label:"和了率", fmt:fmtPct0, group:"score"},
  {key:"houjuu", label:"放銃数", fmt:fmtCount, group:"score"},
  {key:"houjuuRate", label:"放銃率", fmt:fmtPct0, group:"score"},
  {key:"riichi", label:"リーチ数", fmt:fmtCount, group:"score"},
  {key:"riichiRate", label:"リーチ率", fmt:fmtPct0, group:"score"},
  {key:"fuuro", label:"副露数", fmt:fmtCount, group:"score"},
  {key:"fuuroRate", label:"副露率", fmt:fmtPct0, group:"score"},
  {key:"riichiAgariRate", label:"和了率", fmt:fmtPct0, group:"score", subgroup:"リーチ後"},
  {key:"riichiHoujuuRate", label:"放銃率", fmt:fmtPct0, group:"score", subgroup:"リーチ後"},
  {key:"riichiRyuukyokuRate", label:"流局率", fmt:fmtPct0, group:"score", subgroup:"リーチ後"},
  {key:"fuuroAgariRate", label:"和了率", fmt:fmtPct0, group:"score", subgroup:"副露後"},
  {key:"fuuroHoujuuRate", label:"放銃率", fmt:fmtPct0, group:"score", subgroup:"副露後"},
  {key:"fuuroRyuukyokuRate", label:"流局率", fmt:fmtPct0, group:"score", subgroup:"副露後"},
  {key:"agariRiichi", label:"リーチ数", fmt:fmtCount, group:"breakdown", subgroup:"和了内訳"},
  {key:"agariRiichiRate", label:"リーチ率", fmt:fmtPct0, group:"breakdown", subgroup:"和了内訳"},
  {key:"agariFuuro", label:"副露数", fmt:fmtCount, group:"breakdown", subgroup:"和了内訳"},
  {key:"agariFuuroRate", label:"副露率", fmt:fmtPct0, group:"breakdown", subgroup:"和了内訳"},
  {key:"agariOther", label:"ダマテン数", fmt:fmtCount, group:"breakdown", subgroup:"和了内訳"},
  {key:"agariOtherRate", label:"ダマテン率", fmt:fmtPct0, group:"breakdown", subgroup:"和了内訳"},
  {key:"houjuuRiichi", label:"リーチ数", fmt:fmtCount, group:"breakdown", subgroup:"放銃内訳"},
  {key:"houjuuRiichiRate", label:"リーチ率", fmt:fmtPct0, group:"breakdown", subgroup:"放銃内訳"},
  {key:"houjuuFuuro", label:"副露数", fmt:fmtCount, group:"breakdown", subgroup:"放銃内訳"},
  {key:"houjuuFuuroRate", label:"副露率", fmt:fmtPct0, group:"breakdown", subgroup:"放銃内訳"},
  {key:"houjuuOther", label:"その他数", fmt:fmtCount, group:"breakdown", subgroup:"放銃内訳"},
  {key:"houjuuOtherRate", label:"その他率", fmt:fmtPct0, group:"breakdown", subgroup:"放銃内訳"},
  {key:"houjuuOpponentRiichi", label:"リーチ数", fmt:fmtCount, group:"breakdown", subgroup:"放銃相手内訳"},
  {key:"houjuuOpponentRiichiRate", label:"リーチ率", fmt:fmtPct0, group:"breakdown", subgroup:"放銃相手内訳"},
  {key:"houjuuOpponentFuuro", label:"副露数", fmt:fmtCount, group:"breakdown", subgroup:"放銃相手内訳"},
  {key:"houjuuOpponentFuuroRate", label:"副露率", fmt:fmtPct0, group:"breakdown", subgroup:"放銃相手内訳"},
  {key:"houjuuOpponentOther", label:"ダマテン数", fmt:fmtCount, group:"breakdown", subgroup:"放銃相手内訳"},
  {key:"houjuuOpponentOtherRate", label:"ダマテン率", fmt:fmtPct0, group:"breakdown", subgroup:"放銃相手内訳"},
];


// ④成績5段階評価：軸ごとに、選択した対象プレイヤーの実績範囲を5等分したしきい値で1〜5に変換する（固定の絶対基準ではなく相対基準）。
// 「着順系」「打ち筋系」の2セットを切替タブで表示する。higherBetter：true＝数値が大きいほど評価が高い、false＝小さいほど評価が高い。
// ラス回避率＝1－ラス率、連対率＝トップ率＋2着率、ダマテン率＝agariOtherRate（和了のうちリーチ・副露なしの割合）をそのまま採用。
// リーチ率・副露率・ダマテン率・流局率のhigherBetter方向は打ち筋の評価観点として暫定的に設定（要調整）。
const RANK_GRADE_AXES = {
  rank: [
    {label:"平均着順", unit:"rank", higherBetter:false, value:s=>s.avgRank||0, toDisplay:v=>v, fmt:v=>fmtAvg(v)},
    {label:"連対率", unit:"pct", higherBetter:true, value:s=>(s.top||0)+(s.second||0), toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"トップ率", unit:"pct", higherBetter:true, value:s=>s.top||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"ラス回避率", unit:"pct", higherBetter:true, value:s=>1-(s.last||0), toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"ハコ率", unit:"pct", higherBetter:false, value:s=>s.hakoRate||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"日別勝率", unit:"pct", higherBetter:true, value:s=>s.dailyWinRate||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
  ],
  style: [
    {label:"リーチ率", unit:"pct", higherBetter:true, value:s=>s.riichiRate||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"放銃率", unit:"pct", higherBetter:false, value:s=>s.houjuuRate||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"和了率", unit:"pct", higherBetter:true, value:s=>s.agariRate||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"副露率", unit:"pct", higherBetter:true, value:s=>s.fuuroRate||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"ダマテン率", unit:"pct", higherBetter:true, value:s=>s.agariOtherRate||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
    {label:"流局率", unit:"pct", higherBetter:false, value:s=>s.ryuukyokuRate||0, toDisplay:v=>v*100, fmt:v=>fmtPct(v)},
  ],
};
const RANK_GRADE_VIEW_LABELS = {rank:"着順系", style:"打ち筋系"};
const RANK_GRADE_VIEW_NOTES = {
  rank: "連対率＝トップ率＋2着率、ラス回避率＝1－ラス率、日別勝率＝対局日ごとの合計ポイントがプラスだった日の割合として計算しています。",
  style: "ダマテン率＝和了のうちリーチ・副露のどちらも無かった割合、流局率＝参加した局のうち流局に終わった割合として計算しています。",
};
// 現在表示中のstats配列から、軸ごとの実績範囲（最小〜最大）を5等分したしきい値バンドを算出する。
// 最も良い実績の選手が必ずlevel5、最も悪い実績の選手が必ずlevel1になる（全員同値の場合はlevel3で揃える）。
function computeDynamicBands(ax, statsArr){
  const values = statsArr.map(s=>ax.toDisplay(ax.value(s)));
  const min = Math.min(...values), max = Math.max(...values);
  if(!isFinite(min) || !isFinite(max) || max===min){
    return {edges:[min,min,min,min,min,max], degenerate:true};
  }
  const step = (max-min)/5;
  const edges = [0,1,2,3,4,5].map(i=> i===5 ? max : min + i*step);
  return {edges, degenerate:false};
}
function levelFromDynamicBands(v, bands, higherBetter){

function dayOfWeekFromDateStr(dateStr){
  if(!dateStr) return null;
  const parts = String(dateStr).split("-").map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return null;
  const [y,m,d] = parts;

}
function matchesDayFilter(date){

// ---------- データ集計（入力アプリのロジックを移植） ----------
function namesForHanchan(date, hanchanNo){
  const key = `${date}_${hanchanNo}`;
  const snap = state.raw.recordPlayers && state.raw.recordPlayers[key];
  if(snap && snap.length===4) return snap;
  return state.raw.players || ["P1","P2","P3","P4"];
}

function hanchanGroups(){
  const map = new Map();
  (state.raw.records||[]).forEach(r=>{
    const key = `${r.date}_${r.hanchanNo}`;
    if(!map.has(key)) map.set(key, {date:r.date, hanchanNo:r.hanchanNo});
  });
  Object.keys(state.raw.ranks||{}).forEach(k=>{
    if(!map.has(k) && state.raw.ranks[k]){
      const idx = k.lastIndexOf("_");
      const date = k.slice(0,idx), hanchanNo = Number(k.slice(idx+1));
      if(date) map.set(k, {date, hanchanNo});
    }
  });
  return Array.from(map.values()).sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.hanchanNo - b.hanchanNo;
  });
}

function computeHanchanKyokuStats(date, hanchanNo){
  const recs = (state.raw.records||[]).filter(r=>r.date===date && r.hanchanNo===hanchanNo && r.resultType!=="chombo" && r.resultType!=="resultonly");
  const total = recs.length;
  const ryuukyoku = recs.filter(r=>!r.stats.some(s=>s[K_TSUMO]===1 || s[K_RON]===1)).length;
  return {total, ryuukyoku};
}

function computeOverallStats(){
  const byName = new Map();
  function ensure(name){
    const key = name || "";
    if(!byName.has(key)){
      byName.set(key, {
        name: key,
        riichi:0, fuuro:0, tsumo:0, ron:0, houjuu:0, riichiAgari:0, riichiHoujuu:0, fuuroAgari:0, fuuroHoujuu:0,
        riichiRyuukyoku:0, fuuroRyuukyoku:0,
        agariRiichi:0, agariFuuro:0, agariOther:0, houjuuRiichi:0, houjuuFuuro:0, houjuuOther:0,
        houjuuOpponentRiichi:0, houjuuOpponentFuuro:0, houjuuOpponentOther:0, houjuuOpponentTotal:0,
        chombo:0, chomboPt:0, kyokuCount:0, ranks:[], totalPt:0, scores:[],
        ryuukyoku:0, dailyPts:new Map()
      });
    }
    return byName.get(key);
  }
  (state.raw.playerRoster||[]).forEach(n=>{ if(n) ensure(n); });

  (state.raw.records||[]).forEach(r=>{
    if(!passesFilters(r.date)) return;
    const names = namesForHanchan(r.date, r.hanchanNo);
    const isChomboResult = r.resultType === "chombo";
    const isResultOnly = r.resultType === "resultonly";
    // その局で誰も和了しなかった（＝流局）かどうかを局単位で1回だけ判定する
    const isRyuukyokuKyoku = !r.stats.some(ps=>ps[K_TSUMO]===1 || ps[K_RON]===1);
    // 放銃相手内訳：その局でロン和了したプレイヤー（複数ロンの場合は全員）の、リーチ／副露フラグを控えておく
    const ronWinners = [];

    r.stats.forEach((s,i)=>{
      const name = names[i] || `P${i+1}`;

      const ri=s[K_RIICHI], fu=s[K_FUURO]||0, tsu=s[K_TSUMO], ron=s[K_RON], ho=s[K_HOUJUU];

      if(ri && (tsu || ron)) p.riichiAgari += 1;
      if(ri && ho) p.riichiHoujuu += 1;
      if(ri && isRyuukyokuKyoku) p.riichiRyuukyoku += 1;
      if(fu && (tsu || ron)) p.fuuroAgari += 1;

      if(fu && isRyuukyokuKyoku) p.fuuroRyuukyoku += 1;
      // 和了内訳・放銃内訳：その局でリーチ・副露のどちらも無かった場合を「その他」（ダマテン・面前ツモ等）として振り分ける
      if(tsu || ron){
        if(ri) p.agariRiichi += 1;
        else if(fu) p.agariFuuro += 1;
        else p.agariOther += 1;
      }
      if(ho){
        if(ri) p.houjuuRiichi += 1;
        else if(fu) p.houjuuFuuro += 1;
        else p.houjuuOther += 1;
        // 放銃相手内訳：自分が放銃した相手（ロンしたプレイヤー）のリーチ／副露／ダマテンを分類する（複数ロンなら全員分カウント）

          if(w.idx===i) return;
          if(w.ri) p.houjuuOpponentRiichi += 1;
          else if(w.fu) p.houjuuOpponentFuuro += 1;

        if(isRyuukyokuKyoku) p.ryuukyoku += 1;

        p.chombo += 1;
        p.chomboPt -= 15;

      agariRate: p.kyokuCount ? agari/p.kyokuCount : 0,
      houjuuRate: p.kyokuCount ? p.houjuu/p.kyokuCount : 0,
      riichiAgariRate: p.riichi ? p.riichiAgari/p.riichi : 0,
      riichiHoujuuRate: p.riichi ? p.riichiHoujuu/p.riichi : 0,
      riichiRyuukyokuRate: p.riichi ? p.riichiRyuukyoku/p.riichi : 0,
      fuuroAgariRate: p.fuuro ? p.fuuroAgari/p.fuuro : 0,
      fuuroHoujuuRate: p.fuuro ? p.fuuroHoujuu/p.fuuro : 0,
      fuuroRyuukyokuRate: p.fuuro ? p.fuuroRyuukyoku/p.fuuro : 0,
      // 和了内訳（リーチ／副露／その他）：それぞれの和了数に占める割合
      agariRiichiRate: agari ? p.agariRiichi/agari : 0,
      agariFuuroRate: agari ? p.agariFuuro/agari : 0,
      agariOtherRate: agari ? p.agariOther/agari : 0,
      // 放銃内訳（リーチ／副露／その他）：それぞれの放銃数に占める割合
      houjuuRiichiRate: p.houjuu ? p.houjuuRiichi/p.houjuu : 0,
      houjuuFuuroRate: p.houjuu ? p.houjuuFuuro/p.houjuu : 0,
      houjuuOtherRate: p.houjuu ? p.houjuuOther/p.houjuu : 0,
      // 放銃相手内訳（リーチ／副露／ダマテン）：放銃した際にロンしたプレイヤーの手の状態別の割合
      houjuuOpponentRiichiRate: p.houjuuOpponentTotal ? p.houjuuOpponentRiichi/p.houjuuOpponentTotal : 0,
      houjuuOpponentFuuroRate: p.houjuuOpponentTotal ? p.houjuuOpponentFuuro/p.houjuuOpponentTotal : 0,
      houjuuOpponentOtherRate: p.houjuuOpponentTotal ? p.houjuuOpponentOther/p.houjuuOpponentTotal : 0,

  });
}
// 仕様書6.1：①②③の対象は「対局実績（総局数＞0）または半荘実績があるプレイヤー全員」
function computeActiveStats(){ return computeOverallStats().filter(s=>s.kyokuCount>0 || s.hanchanRankedCount>0); }

// 統計タブ：指定プレイヤーの「着順別（1着〜4着）打ち筋スタッツ」を集計する。

// 各局の打ち筋系スタッツ（リーチ・副露・ツモ・ロン・放銃等）を、その局が属する半荘での最終着順ごとに振り分けて集計する。

function computeRankSplitStats(playerName){

    const names = namesForHanchan(g.date, g.hanchanNo);

  function mkBucket(){
    return {
      riichi:0, fuuro:0, tsumo:0, ron:0, houjuu:0,
      riichiAgari:0, riichiHoujuu:0, riichiRyuukyoku:0,
      fuuroAgari:0, fuuroHoujuu:0, fuuroRyuukyoku:0,
      agariRiichi:0, agariFuuro:0, agariOther:0,
      houjuuRiichi:0, houjuuFuuro:0, houjuuOther:0,
      houjuuOpponentRiichi:0, houjuuOpponentFuuro:0, houjuuOpponentOther:0, houjuuOpponentTotal:0,
      kyokuCount:0
    };
  }
  const buckets = {1:mkBucket(), 2:mkBucket(), 3:mkBucket(), 4:mkBucket()};
  // 着順ごとに「打ち筋系スタッツ（局の詳細）が1局でも入力されている半荘」のキー集合を記録する
  const detailHanchanKeysByRank = {1:new Set(), 2:new Set(), 3:new Set(), 4:new Set()};

  (raw.records||[]).forEach(r=>{
    if(!passesFilters(r.date)) return;
    const key = `${r.date}_${r.hanchanNo}`;

    if(!rk) return;

    // その局で誰も和了しなかった（＝流局）かどうか、その局でロン和了したプレイヤー（複数ロンなら全員）を、①比較表の集計ロジックと同じ方法で判定する
    const isRyuukyokuKyoku = !r.stats.some(ps=>ps[K_TSUMO]===1 || ps[K_RON]===1);
    const ronWinners = [];
    for(let j=0;j<4;j++){ if(r.stats[j][K_RON]===1) ronWinners.push({idx:j, ri:r.stats[j][K_RIICHI], fu:r.stats[j][K_FUURO]||0}); }
    const ri=s[K_RIICHI], fu=s[K_FUURO]||0, tsu=s[K_TSUMO], ron=s[K_RON], ho=s[K_HOUJUU];
    b.riichi += ri; b.fuuro += fu; b.tsumo += tsu; b.ron += ron; b.houjuu += ho;
    if(ri && (tsu || ron)) b.riichiAgari += 1;
    if(ri && ho) b.riichiHoujuu += 1;
    if(ri && isRyuukyokuKyoku) b.riichiRyuukyoku += 1;
    if(fu && (tsu || ron)) b.fuuroAgari += 1;
    if(fu && ho) b.fuuroHoujuu += 1;
    if(fu && isRyuukyokuKyoku) b.fuuroRyuukyoku += 1;
    if(tsu || ron){
      if(ri) b.agariRiichi += 1;
      else if(fu) b.agariFuuro += 1;
      else b.agariOther += 1;
    }
    if(ho){
      if(ri) b.houjuuRiichi += 1;
      else if(fu) b.houjuuFuuro += 1;
      else b.houjuuOther += 1;
      ronWinners.forEach(w=>{
        if(w.idx===idx) return;
        if(w.ri) b.houjuuOpponentRiichi += 1;

  const result = {};
  [1,2,3,4].forEach(rk=>{

    result[rk] = {

      agariRiichi: b.agariRiichi, agariFuuro: b.agariFuuro, agariOther: b.agariOther,

      houjuuOtherRate: b.houjuu ? b.houjuuOther/b.houjuu : 0,
      houjuuRiichi: b.houjuuRiichi, houjuuFuuro: b.houjuuFuuro, houjuuOther: b.houjuuOther,
      houjuuOpponentRiichiRate: b.houjuuOpponentTotal ? b.houjuuOpponentRiichi/b.houjuuOpponentTotal : 0,
      houjuuOpponentFuuroRate: b.houjuuOpponentTotal ? b.houjuuOpponentFuuro/b.houjuuOpponentTotal : 0,

// 統計タブ：着順別打ち筋スタッツ表の描画本体。playerNameではなく計算済みのdata（1〜4着それぞれのRANKSPLIT_METRICS値＋hanchanCount）を直接受け取る。
// 個別プレイヤー（computeRankSplitStats）・全プレイヤー平均（computeAverageRankSplitStats）のどちらからも同じ描画ロジックを共有するために分離してある。
// 着順別打ち筋スタッツ表・①比較表：行（指標）ごとに、その行の中の最大値・最小値のセルを見分けやすいよう文字色を変える。
// 値が2種類以上ある場合のみ着色し、全列が同値の場合は何も着色しない（比較の意味がないため）。
function extremeCellStyle(v, maxVal, minVal, hasSpread){
  if(!hasSpread || typeof v !== "number" || !isFinite(v)) return "";
  if(v === maxVal) return "color:var(--primary); font-weight:900;";
  if(v === minVal) return "color:var(--houjuu); font-weight:900;";
  return "";
}
function renderRankSplitTableFromData(data){
  const header = [1,2,3,4].map(rk=>
    `<th>${rk}着<span style="display:block; font-weight:600; color:var(--muted); font-size:10px;">(${fmtCount(data[rk].hanchanCount)}半荘)</span></th>`
  ).join("");
  // ①比較表と同じグループ定義・同じ折りたたみ状態（state.compareGroupCollapsed）を共有するアコーディオン形式で表示する
  const groupBlocks = COMPARE_METRIC_GROUPS.filter(g=>g.key!=="rank").map(grp=>{
    const collapsed = state.compareGroupCollapsed[grp.key] === true; // デフォルトは展開
    const groupHeaderRow = `<tr class="compare-group-row" data-toggle-compare-group="${grp.key}">
      <td class="col-name compare-group-cell" colspan="5">
        <span class="compare-group-arrow">${collapsed?'▶':'▼'}</span>${escapeHtml(grp.label)}
      </td>
    </tr>`;
    if(collapsed) return groupHeaderRow;
    let lastSubgroup = null;
    const metricRows = RANKSPLIT_METRICS.filter(m=>m.group===grp.key).map(m=>{
      let subHeaderRow = "";
      if(m.subgroup !== lastSubgroup){
        lastSubgroup = m.subgroup;
        if(m.subgroup){
          const desc = COMPARE_SUBGROUP_DESC[m.subgroup];
          const descHtml = desc ? `<span class="compare-subgroup-desc">${escapeHtml(desc)}</span>` : "";
          subHeaderRow = `<tr class="compare-subgroup-row"><td class="col-name compare-subgroup-cell" colspan="5">${escapeHtml(m.subgroup)}${descHtml}</td></tr>`;
        }
      }
      const vals = [1,2,3,4].map(rk=>data[rk][m.key]).filter(v=>typeof v==="number" && isFinite(v));
      const maxVal = vals.length ? Math.max(...vals) : null;
      const minVal = vals.length ? Math.min(...vals) : null;
      const hasSpread = maxVal !== null && maxVal !== minVal;
      const cells = [1,2,3,4].map(rk=>{
        const v = data[rk][m.key];
        const style = extremeCellStyle(v, maxVal, minVal, hasSpread);
        return `<td style="${style}">${m.fmt(v)}</td>`;
      }).join("");
      const labelClass = m.subgroup ? "col-name compare-metric-indent" : "col-name";
      return subHeaderRow + `<tr><td class="${labelClass}">${escapeHtml(m.label)}</td>${cells}</tr>`;
    }).join("");
    return groupHeaderRow + metricRows;
  }).join("");
  return `<div class="table-scroll"><table class="stat-mini-table">
    <tr><th class="col-name"></th>${header}</tr>
    ${groupBlocks}
  </table></div>
  <div class="n-sub" style="display:block; margin-top:6px;">※各着順の半荘数は、その着順のうち打ち筋系スタッツ（局の詳細）が入力されている半荘のみをカウント（「結果のみ入力」の半荘は含まない）</div>

// 対象プレイヤーはcomputeAverageStatsと同じ集合（kyokuCount>0のプレイヤー全員）を渡す想定。
function computeAverageRankSplitStats(statsList){
  if(!statsList.length) return null;
  const perPlayer = statsList.map(s=>computeRankSplitStats(s.name));
  const n = perPlayer.length;
  const result = {};
  [1,2,3,4].forEach(rk=>{
    const obj = { hanchanCount: perPlayer.reduce((a,d)=>a+(d[rk].hanchanCount||0),0)/n };
    RANKSPLIT_METRICS.forEach(m=>{ obj[m.key] = perPlayer.reduce((a,d)=>a+(d[rk][m.key]||0),0)/n; });
    result[rk] = obj;
  });
  return result;
}
// ---------- 統計タブ（プレイヤー別スタッツカード。入力アプリの統計タブを移植） ----------
// 全プレイヤーの打ち筋系スタッツ（率・数）を単純平均した値を算出する（着順系・チョンボ系は対象外）。
// RANKSPLIT_METRICS（＝①比較表の「打ち筋系」「内訳」グループ）に列挙されているキーをそのまま平均するため、
// 比較表の項目変更に自動追随する。
function computeAverageStats(statsList){
  if(!statsList.length) return null;
  const n = statsList.length;
  const avg = (key)=> statsList.reduce((a,p)=>a+(p[key]||0),0)/n;
  const obj = {};
  RANKSPLIT_METRICS.forEach(m=>{ obj[m.key] = avg(m.key); });
  return obj;
}
// 統計タブ：①比較表と同じ指標リスト（グループ/サブグループ付き）から、タイルグリッドのHTMLをまとめて生成する共通ヘルパー。
// サブグループの切り替わりごとに見出し（＋1行説明）を挟み、グリッドを区切る。
// 各指標のfmt（fmtPct/fmtPct0/fmtCount/fmtAvg）が桁数を保証するため、個別プレイヤーでも「平均」でも同じfmtをそのまま使う。
function renderMetricTileSections(statsObj, metrics){
  let html = "";
  let currentSubgroup = "__none__";
  let buffer = [];
  function flush(){
    if(buffer.length){ html += `<div class="stat-grid">${buffer.join("")}</div>`; buffer = []; }
  }
  metrics.forEach(m=>{
    if(m.subgroup !== currentSubgroup){
      flush();
      currentSubgroup = m.subgroup;
      if(m.subgroup){
        const desc = COMPARE_SUBGROUP_DESC[m.subgroup] || "";
        html += `<div class="stat-section-label" style="display:flex; align-items:baseline; gap:8px; margin-top:14px;">${escapeHtml(m.subgroup)}${desc?`<span class="compare-subgroup-desc">${escapeHtml(desc)}</span>`:""}</div>`;
      }
    }
    const rawVal = statsObj[m.key];
    const display = m.fmt(rawVal);
    buffer.push(`<div class="stat-tile"><div class="v">${display}</div><div class="l">${escapeHtml(m.label)}</div></div>`);
  });
  flush();
  return html;
}

function computeHeadToHead(nameA, nameB){
  if(!nameA || !nameB || nameA===nameB) return {count:0};
  const groups = hanchanGroups().filter(g=>state.raw.hanchanConfirmed[`${g.date}_${g.hanchanNo}`] && passesFilters(g.date));
  let count=0, totalKyoku=0, sumRankA=0, sumRankB=0, sumPtA=0, sumPtB=0;
  const rankCountA = {1:0,2:0,3:0,4:0}, rankCountB = {1:0,2:0,3:0,4:0};
  groups.forEach(g=>{
    const key = `${g.date}_${g.hanchanNo}`;
    const names = namesForHanchan(g.date, g.hanchanNo);
    const idxA = names.indexOf(nameA), idxB = names.indexOf(nameB);
    if(idxA===-1 || idxB===-1) return;
    const ranks = state.raw.ranks[key], pts = state.raw.finalPoints[key];
    if(!ranks || !pts) return;
    count++;
    totalKyoku += computeHanchanKyokuStats(g.date, g.hanchanNo).total;
    sumRankA += ranks[idxA]||0; sumRankB += ranks[idxB]||0;
    sumPtA += pts[idxA]||0; sumPtB += pts[idxB]||0;
    if(rankCountA[ranks[idxA]] !== undefined) rankCountA[ranks[idxA]]++;
    if(rankCountB[ranks[idxB]] !== undefined) rankCountB[ranks[idxB]]++;
  });
  if(!count) return {count:0};
  return {
    count, totalKyoku,
    avgRankA: sumRankA/count, avgRankB: sumRankB/count,
    avgPtA: sumPtA/count, avgPtB: sumPtB/count,
    topA: rankCountA[1]/count, secondA: rankCountA[2]/count, thirdA: rankCountA[3]/count, lastA: rankCountA[4]/count,
    topB: rankCountB[1]/count, secondB: rankCountB[2]/count, thirdB: rankCountB[3]/count, lastB: rankCountB[4]/count,
  };
}

function bindLoaderEvents(){
  const input = document.getElementById("file-input");
  if(input) input.addEventListener("change", e=>{ const f=e.target.files[0]; if(f) handleFileObj(f); });
  const dz = document.getElementById("dropzone");
  if(dz){
    ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add("dragover"); }));
    ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove("dragover"); }));
    dz.addEventListener("drop", e=>{
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) handleFileObj(f);
    });
  }
  const serverBtn = document.getElementById("load-from-server-btn");
  if(serverBtn) serverBtn.addEventListener("click", loadFromServer);
}
function handleFileObj(file){
  const errEl = document.getElementById("loader-error");
  if(errEl) errEl.textContent = "";
  const reader = new FileReader();
  reader.onload = ()=>{ processBackupText(reader.result, errEl); };
  reader.onerror = ()=>{ if(errEl) errEl.textContent = "ファイルの読み込みに失敗しました。"; };
  reader.readAsText(file, "utf-8");
}
// バックアップJSONのテキストそのものを受け取って読み込む共通処理（ファイル選択・ドラッグ&ドロップ・サーバー読み込みの全てから呼ばれる）。
function processBackupText(rawText, errEl){
  let parsed;
  try{ parsed = JSON.parse(rawText); }
  catch(e){ if(errEl) errEl.textContent = "JSONファイルとして読み込めませんでした。"; return; }
  if(parsed.app !== "mahjong-stats-backup"){
    if(errEl) errEl.textContent = "麻雀スタッツ入力アプリのバックアップファイルではないようです。";
    return;
  }
  state.raw = parsed;
  state.loaded = true;
  state.section = "stats";
  state.chips = [];
  state.compareTargets = null;
  state.dateRange = {from:"", to:""};
  state.dayFilter = "all";
  state.compatRadarTargets = null;
  state.statsCollapsed = {};
  state.rankGradeTargets = null;
  state.rankGradeView = "rank";
  render();
}
// サイト上（同じNetlifyサイトのルート）に置かれているbackup.jsonをfetchで取得して読み込む。
async function loadFromServer(){
  const errEl = document.getElementById("loader-error");
  if(errEl) errEl.textContent = "";
  try{
    const res = await fetch("./backup.json", { cache: "no-store" });
    if(!res.ok){
      if(errEl) errEl.textContent = `サイト上のbackup.jsonを取得できませんでした（${res.status}）`;
      return;
    }
    const text = await res.text();
    processBackupText(text, errEl);
  }catch(e){
    if(errEl) errEl.textContent = "サイト上のbackup.jsonを取得できませんでした（通信エラー）。";
  }
}

// ---------- render: shell ----------
function render(){
  const app = document.getElementById("app");
  if(!state.loaded){
    app.innerHTML = renderLoader();
    bindLoaderEvents();
    return;
  }
  const stats = computeActiveStats();
  app.innerHTML = `
    <div class="sidebar">${renderSidebar(stats)}</div>
    <div class="main">${renderSectionWrap(stats)}</div>
  `;
  bindEvents(stats);
}

    ? allGroups.filter(g=>raw.hanchanConfirmed[`${g.date}_${g.hanchanNo}`] && passesFilters(g.date)).length

    </div>
    <div class="sidebar-date-filter">

      <label class="sidebar-date-label">開始<input type="date" data-daterange-from value="${escapeAttr(state.dateRange.from)}"></label>
      <label class="sidebar-date-label">終了<input type="date" data-daterange-to value="${escapeAttr(state.dateRange.to)}"></label>
      <div class="day-filter-row">

      </div>
      ${anyFilterActive ? `<button class="tool-btn small" data-daterange-clear style="margin-top:8px; width:100%;">フィルタ解除</button>` : ""}
    </div>
    <nav class="side-nav">
      ${navBtn("stats","📊","統計")}
      ${navBtn("compare","①","比較表")}
      ${navBtn("graph","②","スコア推移")}
      ${navBtn("compatradar","③","相性レーダーチャート")}

function navBtn(id, num, label){
  return `<button data-section="${id}" class="${state.section===id?'active':''}"><span class="nav-num">${num}</span>${label}</button>`;
}

function renderSectionWrap(stats){
  if(state.section==="stats"){
    return renderStatsSection(); // 統計タブは対局実績0のプレイヤーも含めて表示するため、専用に分岐（他セクションの空判定より前）
  }
  if(stats.length===0){
    return `<div class="card"><div class="empty">対局実績のあるプレイヤーがいません。${isAnyFilterActive() ? "サイドバーの期間・曜日フィルタをご確認いただくか、" : ""}入力アプリでデータを記録してから、書き出したJSONを読み込んでください。</div></div>`;
  }
  let body;
  if(state.section==="compare"){
    body = stats.length>=2 ? renderCompareSection(stats) : renderNeedMorePlayers("①比較表");
  }else if(state.section==="graph"){
    body = renderGraphSection();
  }else if(state.section==="rankgrade"){
    body = stats.length>=2 ? renderRankGradeSection(stats) : renderNeedMorePlayers("④成績5段階評価（相対評価）");
  }else{
    body = renderCompatRadarGridSection(stats);
  }
  const showChipBar = state.section==="graph";
  return (showChipBar ? renderChipBar() : "") + body;
}
function renderNeedMorePlayers(label){
  return `<div class="card"><div class="empty">${escapeHtml(label)}を表示するには、対局実績のあるプレイヤーが2人以上必要です。</div></div>`;
}

function renderChipBar(){
  const chips = state.chips.map(n=>{

  const clearBtn = state.chips.length ? `<button class="chip-clear-btn" data-chip-clear>選択をクリア</button>` : "";
  return `<div class="chip-bar">
    <span class="chip-bar-label">選択中プレイヤー</span>
    ${chips || '<span class="chip-bar-empty">下の凡例をクリックして選択してください</span>'}
    ${clearBtn}
  </div>`;
}

// ①比較表：「全体平均」列の値を算出する（対象は常にallStats全員＝現在選択中のチップに関わらず固定）
function computeCompareAverageStat(allStats){
  if(!allStats.length) return null;
  const n = allStats.length;
  const obj = {name: COMPARE_AVERAGE_NAME};
  COMPARE_METRICS.forEach(m=>{
    obj[m.key] = allStats.reduce((a,p)=>a+(p[m.key]||0),0)/n;
  });
  return obj;
}
// ①比較表：チップで選択されたプレイヤー名から、実プレイヤーまたは「全体平均」の統計オブジェクトを解決する
function resolveCompareStat(name, allStats){
  if(name===COMPARE_AVERAGE_NAME) return computeCompareAverageStat(allStats);
  return allStats.find(s=>s.name===name);
}

// ---------- render: ①比較表 ----------
// 表示するプレイヤーを選択チップ（③相性レーダーチャートと同様のUI）で選ぶ方式にする。
function renderCompareSection(allStats){
  const allNames = allStats.map(s=>s.name).concat([COMPARE_AVERAGE_NAME]);
  if(state.compareTargets === null){
    state.compareTargets = allStats.length<=COMPARE_DEFAULT_TARGET_COUNT ? allStats.map(s=>s.name)
      : allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).slice(0,COMPARE_DEFAULT_TARGET_COUNT).map(s=>s.name);
  }else{
    state.compareTargets = state.compareTargets.filter(n=>allNames.includes(n));
  }
  const targets = state.compareTargets;

  const averageOn = targets.includes(COMPARE_AVERAGE_NAME);
  const averageChip = `<label class="chip roster-chip target-chip ${averageOn?'on':''}">
      <input type="checkbox" data-compare-toggle="${escapeAttr(COMPARE_AVERAGE_NAME)}" ${averageOn?'checked':''}>📊 ${escapeHtml(COMPARE_AVERAGE_NAME)}（対象${allStats.length}名）</label>`;
  const targetChips = averageChip + allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).map(s=>{
    const on = targets.includes(s.name);
    return `<label class="chip roster-chip target-chip ${on?'on':''}">
      <input type="checkbox" data-compare-toggle="${escapeAttr(s.name)}" ${on?'checked':''}>${escapeHtml(s.name)}（${s.hanchanRankedCount}半荘）</label>`;
  }).join("");

  let tableHtml;
  if(!targets.length){
    tableHtml = `<div class="empty">プレイヤーを1人以上選択してください。</div>`;
  }else{
    const selStats = targets.map(n=>resolveCompareStat(n, allStats)).filter(Boolean);
    const colCount = 1 + selStats.length;
    const headerCells = selStats.map(s=>{
      const isAvg = s.name===COMPARE_AVERAGE_NAME;
      const selected = !isAvg && state.chips.includes(s.name);
      const color = colorForChip(s.name);
      const style = selected ? `background:${color}22; color:${color}; border-bottom:3px solid ${color};`
        : isAvg ? `background:var(--bg); font-style:italic;` : "";
      return `<th style="${style}">${isAvg ? "📊 " : ""}${escapeHtml(s.name)}</th>`;
    }).join("");
    const groupBlocks = COMPARE_METRIC_GROUPS.map(grp=>{
      const collapsed = state.compareGroupCollapsed[grp.key] === true; // デフォルトは展開
      const groupHeaderRow = `<tr class="compare-group-row" data-toggle-compare-group="${grp.key}">
        <td class="col-name compare-group-cell" colspan="${colCount}">
          <span class="compare-group-arrow">${collapsed?'▶':'▼'}</span>${escapeHtml(grp.label)}
        </td>
      </tr>`;
      if(collapsed) return groupHeaderRow;
      let lastSubgroup = null;
      const metricRows = COMPARE_METRICS.filter(m=>m.group===grp.key).map(m=>{
        let subHeaderRow = "";
        if(m.subgroup !== lastSubgroup){
          lastSubgroup = m.subgroup;
          if(m.subgroup){
            const desc = COMPARE_SUBGROUP_DESC[m.subgroup];
            const descHtml = desc ? `<span class="compare-subgroup-desc">${escapeHtml(desc)}</span>` : "";
            subHeaderRow = `<tr class="compare-subgroup-row"><td class="col-name compare-subgroup-cell" colspan="${colCount}">${escapeHtml(m.subgroup)}${descHtml}</td></tr>`;
          }
        }
        const compareVals = selStats.filter(s=>s.name!==COMPARE_AVERAGE_NAME).map(s=>s[m.key]).filter(v=>typeof v==="number" && isFinite(v));
        const maxVal = compareVals.length ? Math.max(...compareVals) : null;
        const minVal = compareVals.length ? Math.min(...compareVals) : null;
        const hasSpread = maxVal !== null && maxVal !== minVal;
        const cells = selStats.map(s=>{
          const isAvg = s.name===COMPARE_AVERAGE_NAME;
          const selected = !isAvg && state.chips.includes(s.name);
          const color = colorForChip(s.name);
          const style = selected ? `background:${color}14;` : isAvg ? `background:var(--bg);` : "";
          const extraStyle = isAvg ? "" : extremeCellStyle(s[m.key], maxVal, minVal, hasSpread);
          return `<td style="${style}${extraStyle}">${m.fmt(s[m.key])}</td>`;
        }).join("");
        const labelCellClass = m.subgroup ? "col-name compare-metric-indent" : "col-name";
        return subHeaderRow + `<tr><td class="${labelCellClass}">${escapeHtml(m.label)}</td>${cells}</tr>`;
      }).join("");
      return groupHeaderRow + metricRows;
    }).join("");
    tableHtml = `
      <div class="table-scroll">
        <table class="stat-mini-table" id="compare-table">
          <tr><th class="col-name"></th>${headerCells}</tr>
          ${groupBlocks}
        </table>
      </div>`;
  }

  return `
    <div class="card">
      <div class="section-head">
        <h2>① 比較表<span class="n-sub">選手を選んで比較</span></h2>
        <button class="tool-btn" data-copy-table="compare">📋 表をコピー</button>
      </div>
      <div class="target-select">
        <span class="chip-bar-label">対象プレイヤー（初期表示は目安${COMPARE_DEFAULT_TARGET_COUNT}名、チップで自由に増減できます。「${escapeHtml(COMPARE_AVERAGE_NAME)}」は対象プレイヤー全員の単純平均です）</span>
        <div class="chip-row">${targetChips}</div>
      </div>
      ${targets.length ? `<div class="n-sub" style="display:block; margin-bottom:8px;">※行内の<span style="color:var(--primary); font-weight:900;">最大値</span>・<span style="color:var(--houjuu); font-weight:900;">最小値</span>を色分け表示（「${escapeHtml(COMPARE_AVERAGE_NAME)}」列は比較対象から除く）</div>` : ""}
      ${tableHtml}
    </div>`;
}

// ---------- render: ②スコア推移 ----------
// サイドバー共通の期間指定（state.dateRange）で絞り込んだ範囲に確定した半荘のみを対象に、その範囲内でのスコア推移を計算する
// （範囲より前の半荘の得点は含めない＝期間の先頭で0からの推移になる）。
function renderGraphSection(){
  const groups = hanchanGroups().filter(g=>state.raw.hanchanConfirmed[`${g.date}_${g.hanchanNo}`]);
  const filtered = groups.filter(g=>passesFilters(g.date));

  if(!filtered.length){
    return `<div class="card"><div class="section-head"><h2>② スコア推移</h2></div><div class="empty">対象期間に確定済みの半荘がありません。サイドバーの期間・曜日フィルタをご確認ください。</div></div>`;
  }

  const allNames = [];
  const seen = new Set();
  filtered.forEach(g=>{
    namesForHanchan(g.date, g.hanchanNo).forEach(nm=>{
      const n = nm || "?";
      if(!seen.has(n)){ seen.add(n); allNames.push(n); }
    });
  });

  const cum = {}; allNames.forEach(n=>{ cum[n]=0; });
  const series = {}; allNames.forEach(n=>{ series[n]=[]; });
  filtered.forEach(g=>{
    const key = `${g.date}_${g.hanchanNo}`;
    const names = namesForHanchan(g.date, g.hanchanNo);
    const pts = state.raw.finalPoints[key] || [0,0,0,0];
    allNames.forEach(n=>{
      const slot = names.indexOf(n);
      if(slot !== -1) cum[n] += (pts[slot]||0);
      series[n].push(cum[n]);
    });
  });

  const w=900, h=420, padL=54, padR=20, padT=20, padB=32;
  const n = filtered.length;
  const allVals = allNames.flatMap(nm=>series[nm]).concat([0]);
  const maxV = Math.max(...allVals), minV = Math.min(...allVals);
  const xAt = i => padL + (n<=1 ? 0 : (i*(w-padL-padR)/(n-1)));
  const yAt = v => (h-padB) - ((v-minV)/((maxV-minV)||1))*(h-padT-padB);

  const selectedSet = new Set(state.chips.filter(nm=>allNames.includes(nm)));
  const order = allNames.slice().sort((a,b)=> (selectedSet.has(a)?1:0) - (selectedSet.has(b)?1:0));

  // y軸の目安線（0とmax/min付近）
  const gridLevels = [minV, (minV+maxV)/2, maxV];
  const gridLines = gridLevels.map(v=>{
    const y = yAt(v).toFixed(1);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#E4DFD3" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="${padL-8}" y="${(+y+4).toFixed(1)}" font-size="11" fill="#767b83" text-anchor="end">${fmtPt(v)}</text>`;
  }).join("");
  const zeroY = yAt(0).toFixed(1);
  const zeroLine = (minV<0 && maxV>0) ? `<line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#767b83" stroke-width="1.2"/>` : "";

  const lines = order.map(nm=>{
    const isSel = selectedSet.has(nm);
    const color = isSel ? colorForChip(nm) : NEUTRAL_COLOR;
    const s = series[nm];
    const points = s.map((v,i)=>`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" ");
    const strokeW = isSel ? 3 : 1.4;
    const strokeOp = isSel ? 1 : 0.4;
    return `<polyline data-graph-name="${escapeAttr(nm)}" points="${points}" fill="none" stroke="${color}" stroke-opacity="${strokeOp}" stroke-width="${strokeW}"/>`;
  }).join("");

  const legend = allNames.map(nm=>{
    const isSel = selectedSet.has(nm);
    const color = isSel ? colorForChip(nm) : NEUTRAL_COLOR;
    const style = isSel ? `background:${color}22; border-color:${color}; color:${color};` : "";
    return `<button class="chip legend-chip" data-chip-toggle="${escapeAttr(nm)}" style="${style}"><span class="legend-dot" style="background:${color};"></span>${escapeHtml(nm)}</button>`;
  }).join("");

  return `
    <div class="card">
      <div class="section-head">
        <h2>② スコア推移<span class="n-sub">確定済み半荘・プレイヤー名単位で集計（サイドバーの期間・曜日フィルタ適用範囲のスコアのみで算出）</span></h2>
      </div>
      <svg viewBox="0 0 ${w} ${h}" id="graph-svg" style="width:100%; height:auto; margin-top:14px;">
        <rect x="0" y="0" width="${w}" height="${h}" fill="#FFFFFF"/>
        ${gridLines}${zeroLine}${lines}
      </svg>
      <div class="chip-row legend-row">${legend}</div>
      <div class="n-sub" style="display:block; margin-top:8px;">対象：確定済み半荘 ${n}件／選手名クリックでハイライトON/OFF</div>
    </div>`;
}
// ---------- render: ③相性レーダーチャート（プレイヤー毎に並べて表示） ----------
// 同卓者別の相性を見る指標：軸＝同卓した相手、値＝「基準プレイヤーの平均得点pt－相手の平均得点pt」
// （確定済み半荘で実際に同卓した範囲のみが対象）。0を基準に、外側＝勝ち越し、内側＝負け越しを表す。
const COMPAT_RADAR_DEFAULT_TARGET_COUNT = 8;
function computeCompatAxes(baseName, stats, targetNames){
  const pool = targetNames ? stats.filter(s=>targetNames.includes(s.name)) : stats;
  return pool.filter(s=>s.name!==baseName).map(s=>{
    const h2h = computeHeadToHead(baseName, s.name);
    return { name: s.name, count: h2h.count||0, diff: h2h.count ? (h2h.avgPtA - h2h.avgPtB) : null };
  }).filter(a=>a.count>0);
}
function renderCompatRadarCard(baseName, axes, color, svgId){
  if(!axes.length){
    return `<div class="radar-grid-card">
      <div class="radar-grid-card-head"><h3>${escapeHtml(baseName)}</h3></div>
      <div class="empty">同卓した確定済み半荘が見つかりませんでした。</div>
    </div>`;
  }
  const maxAbs = Math.max(1, ...axes.map(a=>Math.abs(a.diff)));
  const w=280, h=280, cx=140, cy=140, r=70;
  const n = axes.length;
  const angleFor = i => -Math.PI/2 + i*(2*Math.PI/n);
  const axisLines = axes.map((ax,i)=>{
    const a=angleFor(i); const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E4DFD3" stroke-width="1"/>`;
  }).join("");
  const gridPolys = [0.25,0.5,0.75,1.0].map(level=>{
    const pts = axes.map((ax,i)=>{ const a=angleFor(i), rr=r*level; return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`; }).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="#E4DFD3" stroke-width="1" stroke-dasharray="${level===1?'0':'2,2'}"/>`;
  }).join("");
  const zeroPts = axes.map((ax,i)=>{ const a=angleFor(i), rr=r*0.5; return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`; }).join(" ");
  const zeroPoly = `<polygon points="${zeroPts}" fill="none" stroke="#767b83" stroke-width="1.4" stroke-dasharray="4,2"/>`;
  const labels = axes.map((ax,i)=>{
    const a=angleFor(i); const x=cx+(r+12)*Math.cos(a), y=cy+(r+9)*Math.sin(a);
    const cosA=Math.cos(a); const anchor = cosA>0.3?"start":cosA<-0.3?"end":"middle";
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="12" fill="#767b83" text-anchor="${anchor}">${escapeHtml(ax.name)}</text>`;
  }).join("");
  const dataPts = axes.map((ax,i)=>{
    const a=angleFor(i);
    const frac = Math.max(0, Math.min(1, (ax.diff+maxAbs)/(2*maxAbs)));
    const rr = r*frac;
    return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`;
  }).join(" ");
  const dataPoly = `<polygon points="${dataPts}" fill="${color}" fill-opacity="0.18" stroke="${color}" stroke-width="2"/>`;
  const legendRows = axes.map(ax=>`
    <div class="compat-legend-row">
      <span>${escapeHtml(ax.name)}</span>
      <span style="font-weight:800; color:${ax.diff>=0?'#1F6F54':'#B23A2E'};">${fmtPt(ax.diff)}（${ax.count}回同卓）</span>
    </div>`).join("");
  return `
    <div class="radar-grid-card">
      <div class="radar-grid-card-head">
        <h3>${escapeHtml(baseName)}</h3>
      </div>
      <svg viewBox="0 0 ${w} ${h}" id="${svgId}" style="width:100%; height:auto; display:block;">
        <rect x="0" y="0" width="${w}" height="${h}" fill="#FFFFFF"/>
        ${gridPolys}${zeroPoly}${axisLines}${dataPoly}${labels}
      </svg>
      <div class="n-sub" style="display:block; margin:6px 0 8px;">点線の円＝スコア差0（互角）。外側ほど${escapeHtml(baseName)}さんの勝ち越し。</div>
      ${legendRows}
    </div>`;
}
function renderCompatRadarGridSection(allStats){
  const allNames = allStats.map(s=>s.name);
  if(state.compatRadarTargets === null){
    if(allNames.length <= COMPAT_RADAR_DEFAULT_TARGET_COUNT){
      state.compatRadarTargets = allNames.slice();
    }else{
      state.compatRadarTargets = allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount)
        .slice(0, COMPAT_RADAR_DEFAULT_TARGET_COUNT).map(s=>s.name);
    }
  }else{
    state.compatRadarTargets = state.compatRadarTargets.filter(n=>allNames.includes(n));
  }
  const targets = state.compatRadarTargets;

  const targetChips = allStats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).map(s=>{
    const on = targets.includes(s.name);
    return `<label class="chip roster-chip target-chip ${on?'on':''}">
      <input type="checkbox" data-compatradar-toggle="${escapeAttr(s.name)}" ${on?'checked':''}>${escapeHtml(s.name)}（${s.hanchanRankedCount}半荘）</label>`;
  }).join("");

  let body;
  if(!targets.length){
    body = `<div class="empty">プレイヤーを1人以上選択してください。</div>`;
  }else{
    const cards = targets.map((name,i)=>{
      const axes = computeCompatAxes(name, allStats, targets);
      const color = CHART_PALETTE[i % CHART_PALETTE.length];
      return renderCompatRadarCard(name, axes, color, `compat-radar-svg-${i}`);
    }).join("");
    body = `<div class="radar-grid">${cards}</div>`;
  }

  return `
    <div class="card">
      <div class="section-head">
        <h2>③ 相性レーダーチャート<span class="n-sub">選手ごとに、同卓した相手との平均得点pt差を表示</span></h2>
      </div>
      <div class="target-select">
        <span class="chip-bar-label">対象プレイヤー（初期表示は目安${COMPAT_RADAR_DEFAULT_TARGET_COUNT}名、チップで自由に増減できます）</span>
        <div class="chip-row">${targetChips}</div>
      </div>
      ${body}
    </div>`;
}

// ---------- render: ④成績5段階評価（相対評価） ----------
// ③相性レーダーチャートと同じ「選手ごとに個別カード」の枠組み。
// 各軸は選択した対象プレイヤーの実績範囲を5等分したしきい値（RANK_GRADE_AXES）で1〜5に変換した評価値を使う。
// 内部タブ（state.rankGradeView）で「着順系」「打ち筋系」を切替。対象プレイヤー選択は両タブで共有する。
function renderRankGradeSection(stats){
  const allNames = stats.map(s=>s.name);
  if(state.rankGradeTargets === null){
    if(allNames.length <= RANKGRADE_DEFAULT_TARGET_COUNT){
      state.rankGradeTargets = allNames.slice();
    }else{
      state.rankGradeTargets = stats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount)
        .slice(0, RANKGRADE_DEFAULT_TARGET_COUNT).map(s=>s.name);
    }
  }else{
    state.rankGradeTargets = state.rankGradeTargets.filter(n=>allNames.includes(n));
  }
  const targets = state.rankGradeTargets;
  const targetChips = stats.slice().sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount).map(s=>{
    const on = targets.includes(s.name);
    return `<label class="chip roster-chip target-chip ${on?'on':''}">
      <input type="checkbox" data-rankgrade-toggle="${escapeAttr(s.name)}" ${on?'checked':''}>${escapeHtml(s.name)}（${s.hanchanRankedCount}半荘）</label>`;
  }).join("");
  const viewTabs = Object.keys(RANK_GRADE_AXES).map(key=>{
    const active = state.rankGradeView===key;
    return `<button type="button" class="rankgrade-tab ${active?'active':''}" data-rankgrade-view="${key}">${RANK_GRADE_VIEW_LABELS[key]}</button>`;
  }).join("");
  const head = `
    <div class="section-head">
      <h2>④ 成績5段階評価（相対評価）<span class="n-sub">選手ごとに個別のレーダーチャートで表示</span></h2>
    </div>
    <div class="rankgrade-tabs">${viewTabs}</div>
    <div class="target-select">
      <span class="chip-bar-label">対象プレイヤー（しきい値の基準にも、カード表示にも使用。初期表示は目安${RANKGRADE_DEFAULT_TARGET_COUNT}名、チェックで自由に増減できます）</span>
      <div class="chip-row">${targetChips}</div>
    </div>`;
  if(!targets.length){
    return `<div class="card">${head}<div class="empty">対象プレイヤーを1人以上選択してください。</div></div>`;
  }
  const axes = RANK_GRADE_AXES[state.rankGradeView];
  const rankAxes = RANK_GRADE_AXES.rank;
  const RANK_TOTAL_MAX = rankAxes.length*5; // 着順系6軸×5点＝30点固定
  // 着順系の合計値・順位は、タブに関わらず常に「対象プレイヤー全員」を基準に計算する（打ち筋系の対象絞り込みの影響を受けない）。
  const basisStatsFull = stats.filter(s=>targets.includes(s.name));
  const rankDynBandsArr = rankAxes.map(ax=>computeDynamicBands(ax, basisStatsFull));
  const rankGradesByName = {};
  stats.forEach(s=>{
    rankGradesByName[s.name] = rankAxes.map((ax,i)=>levelFromDynamicBands(ax.toDisplay(ax.value(s)), rankDynBandsArr[i], ax.higherBetter));
  });
  const totalByName = {};
  stats.forEach(s=>{ totalByName[s.name] = rankGradesByName[s.name].reduce((a,b)=>a+b,0); });
  const rankOrderFull = basisStatsFull.slice().sort((a,b)=>totalByName[b.name]-totalByName[a.name]);
  const rankByName = {};
  rankOrderFull.forEach((s,i)=>{
    if(i===0){ rankByName[s.name]=1; }
    else{
      const prevName = rankOrderFull[i-1].name;
      rankByName[s.name] = totalByName[s.name]===totalByName[prevName] ? rankByName[prevName] : i+1;
    }
  });
  const RANK_TARGET_COUNT = basisStatsFull.length; // 「◯人中◯位」の分母（対象プレイヤー全員数、タブに依存しない）
  // 打ち筋系は局ごとの詳細記録（リーチ・副露等）が無いと全項目0%になり評価が意味を持たないため、
  // 現在表示中タブの軸のしきい値算出・カード表示に限っては総局数0人を候補から除外する（着順系は半荘の最終着順があれば成立するため除外なし）。
  const isViewEligible = s => state.rankGradeView!=="style" || s.kyokuCount>0;
  const eligibleStats = stats.filter(isViewEligible);
  const excludedByNoKyoku = stats.filter(s=>!isViewEligible(s));
  const basisStats = eligibleStats.filter(s=>targets.includes(s.name));
  if(!basisStats.length){
    const reason = excludedByNoKyoku.length && state.rankGradeView==="style"
      ? "対象プレイヤーの中に、局ごとの詳細記録（総局数）があるプレイヤーがいません。"
      : "対象プレイヤーを1人以上選択してください。";
    return `<div class="card">${head}<div class="empty">${reason}</div></div>`;
  }
  const dynBandsArr = axes.map(ax=>computeDynamicBands(ax, basisStats));
  const gradesByName = {}; // 現在のタブの軸別評価（レーダー形状・凡例・しきい値表用、対象は評価が意味を持つプレイヤーのみ）
  eligibleStats.forEach(s=>{
    gradesByName[s.name] = axes.map((ax,i)=>levelFromDynamicBands(ax.toDisplay(ax.value(s)), dynBandsArr[i], ax.higherBetter));
  });
  function fmtBandNum(ax, v){
    if(ax.unit==="rank") return v.toFixed(2);
    return v.toFixed(1)+"%";
  }
  const thresholdRows = axes.map((ax,i)=>{
    const bands = dynBandsArr[i];
    const cells = [5,4,3,2,1].map(lv=>{
      if(bands.degenerate) return `<td>${fmtBandNum(ax,bands.edges[0])}（全員同値）</td>`;
      const seg = ax.higherBetter ? lv-1 : 5-lv; // セグメント番号（0〜4、低い方から）
      const [first,second] = ax.higherBetter ? [bands.edges[seg+1],bands.edges[seg]] : [bands.edges[seg],bands.edges[seg+1]];
      return `<td>${fmtBandNum(ax,first)}〜${fmtBandNum(ax,second)}</td>`;
    }).join("");
    return `<tr><th class="col-name">${ax.label}</th>${cells}</tr>`;
  }).join("");
  const thresholdTable = `
    <div class="n-sub" style="margin-top:18px; margin-bottom:6px; font-weight:800;">評価しきい値の判定基準（下で選択した対象プレイヤーの実績を5等分した相対基準）</div>
    <div class="table-scroll">
      <table class="stat-mini-table">
        <thead><tr><th class="col-name">評価軸</th><th>5</th><th>4</th><th>3</th><th>2</th><th>1</th></tr></thead>
        <tbody>${thresholdRows}</tbody>
      </table>
    </div>`;
  const playerRows = eligibleStats.slice().sort((a,b)=> totalByName[b.name]-totalByName[a.name]).map(s=>{
    const grades = gradesByName[s.name];
    const cells = axes.map((ax,i)=>`<td>${ax.fmt(ax.value(s))}<br><span class="n-sub">評価${grades[i]}</span></td>`).join("");
    return `<tr><th class="col-name">${escapeHtml(s.name)}</th>${cells}<td>${totalByName[s.name]}/${RANK_TOTAL_MAX}</td></tr>`;
  }).join("");
  const playerTableNote = state.rankGradeView==="style" && excludedByNoKyoku.length
    ? `選手別の実測値と評価（対象プレイヤー選択に関わらず表示。局ごとの詳細記録がない${excludedByNoKyoku.length}名は除外：${excludedByNoKyoku.map(s=>escapeHtml(s.name)).join("、")}）`
    : "選手別の実測値と評価（対象プレイヤー選択に関わらず全員分を表示）";
  const playerTable = `
    <div class="n-sub" style="margin-top:18px; margin-bottom:6px; font-weight:800;">${playerTableNote}</div>
    <div class="table-scroll">
      <table class="stat-mini-table">
        <thead><tr><th class="col-name">選手</th>${axes.map(ax=>`<th>${ax.label}</th>`).join("")}<th>合計（着順系）</th></tr></thead>
        <tbody>${playerRows}</tbody>
      </table>
    </div>`;
  const cardStats = basisStats.slice().sort((a,b)=> totalByName[b.name]-totalByName[a.name]);
  const cards = cardStats.map((s,i)=>{
    const grades = gradesByName[s.name];
    const color = CHART_PALETTE[i % CHART_PALETTE.length];
    return renderRankGradeCard(s, grades, totalByName[s.name], RANK_TOTAL_MAX, rankByName[s.name], RANK_TARGET_COUNT, color, `rankgrade-svg-${i}`, axes);
  }).join("");
  const eligibilityNote = state.rankGradeView==="style" && excludedByNoKyoku.length
    ? `対象プレイヤーのうち、局ごとの詳細記録（総局数）がない${excludedByNoKyoku.length}名（${excludedByNoKyoku.filter(s=>targets.includes(s.name)).map(s=>escapeHtml(s.name)).join("、")||"該当者なし"}）はしきい値の算出・カード表示から除外しています。`
    : "";
  return `
    <div class="card">
      ${head}
      <div class="radar-grid">${cards}</div>
      <div class="n-sub axis-note">各軸は選択中の対象プレイヤーの実績範囲を5等分したしきい値で1〜5段階に変換した評価値（外周＝5、中心＝1）。${RANK_GRADE_VIEW_NOTES[state.rankGradeView]}合計値・順位はタブに関わらず常に「着順系」の評価を基準に表示しています。${eligibilityNote}</div>
      ${thresholdTable}
      ${playerTable}
    </div>`;
}

// ④成績5段階評価：選手1人分の個別レーダーカード（③相性レーダーチャートと同じカードUIを流用）。
function renderRankGradeCard(s, grades, total, totalMax, rank, targetCount, color, svgId, axes){
  const w=280, h=280, cx=140, cy=140, r=70;
  const n = axes.length;
  const angleFor = i => -Math.PI/2 + i*(2*Math.PI/n);
  const axisLines = axes.map((ax,i)=>{
    const a=angleFor(i); const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E4DFD3" stroke-width="1"/>`;
  }).join("");
  const gridPolys = [1,2,3,4,5].map(level=>{
    const pts = axes.map((ax,i)=>{ const a=angleFor(i), rr=r*(level/5); return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`; }).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="#E4DFD3" stroke-width="1" stroke-dasharray="${level===5?'0':'2,2'}"/>`;
  }).join("");
  const labels = axes.map((ax,i)=>{
    const a=angleFor(i); const x=cx+(r+12)*Math.cos(a), y=cy+(r+9)*Math.sin(a);
    const cosA=Math.cos(a); const anchor = cosA>0.3?"start":cosA<-0.3?"end":"middle";
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="12" fill="#767b83" text-anchor="${anchor}">${ax.label}</text>`;
  }).join("");
  const dataPts = axes.map((ax,i)=>{
    const a=angleFor(i); const rr = r*(grades[i]/5);
    return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`;
  }).join(" ");
  const dataPoly = `<polygon points="${dataPts}" fill="${color}" fill-opacity="0.2" stroke="${color}" stroke-width="2.2"/>`;
  const legendRows = axes.map((ax,i)=>`
    <div class="compat-legend-row">
      <span>${ax.label}</span>
      <span style="font-weight:800;">${ax.fmt(ax.value(s))}（評価${grades[i]}）</span>
    </div>`).join("");
  return `
    <div class="radar-grid-card">
      <div class="radar-grid-card-head">
        <h3 style="font-size:19px;">${escapeHtml(s.name)}</h3>
        <span style="font-size:17px; font-weight:800; color:${color}; white-space:nowrap;">合計${total}/${totalMax}<span class="n-sub" style="font-size:15px; font-weight:800; margin-left:5px;">（着順系・${targetCount}人中${rank}位）</span></span>
      </div>
      <svg viewBox="0 0 ${w} ${h}" id="${svgId}" style="width:100%; height:auto; display:block;">
        <rect x="0" y="0" width="${w}" height="${h}" fill="#FFFFFF"/>
        ${gridPolys}${axisLines}${dataPoly}${labels}
      </svg>
      ${legendRows}
    </div>`;
}

// ---------- 選択チップの共通操作 ----------
function toggleChip(name){
  const idx = state.chips.indexOf(name);
  if(idx>=0) state.chips.splice(idx,1); else state.chips.push(name);
  render();
}

// ---------- 表のコピー（①比較表） ----------
function copyCompareTsv(allStats){
  const targets = state.compareTargets || [];
  const stats = targets.map(n=>resolveCompareStat(n, allStats)).filter(Boolean);
  const header = [""].concat(stats.map(s=>s.name));
  const lines = [header.join("\t")];
  COMPARE_METRICS.forEach(m=>{
    lines.push([m.label].concat(stats.map(s=>String(m.fmt(s[m.key])))).join("\t"));
  });
  copyText(lines.join("\n"));
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("表をコピーしました")).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); toast("表をコピーしました"); }
  catch(e){ toast("コピーに失敗しました"); }
  document.body.removeChild(ta);
}

// ---------- イベント束縛 ----------
function bindEvents(stats){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-section]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.section = btn.dataset.section; render(); });
  });

  app.querySelectorAll("[data-toggle-stats-collapse]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.dataset.toggleStatsCollapse;
      const defaultExpanded = el.dataset.toggleDefault === "expanded";
      const collapsedNow = isStatsCollapsed(key, defaultExpanded);
      state.statsCollapsed[key] = collapsedNow ? false : true;
      render();
    });
  });

  app.querySelectorAll("[data-toggle-compare-group]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.dataset.toggleCompareGroup;
      const collapsedNow = state.compareGroupCollapsed[key] === true;
      state.compareGroupCollapsed[key] = collapsedNow ? false : true;
      render();
    });
  });

  const reloadBtn = app.querySelector("[data-reload]");
  if(reloadBtn) reloadBtn.addEventListener("click", ()=>{
    if(confirm("表示中のデータを破棄して、別のファイルを読み込みますか？")){
      state.raw = null; state.loaded = false; render();
    }
  });

  app.querySelectorAll("[data-chip-toggle]").forEach(el=>{
    el.addEventListener("click", ()=> toggleChip(el.dataset.chipToggle));
  });
  app.querySelectorAll("[data-graph-name]").forEach(el=>{
    el.addEventListener("click", ()=> toggleChip(el.dataset.graphName));
  });
  const dateFrom = app.querySelector("[data-daterange-from]");
  if(dateFrom) dateFrom.addEventListener("change", ()=>{ state.dateRange.from = dateFrom.value; render(); });
  const dateTo = app.querySelector("[data-daterange-to]");
  if(dateTo) dateTo.addEventListener("change", ()=>{ state.dateRange.to = dateTo.value; render(); });
  app.querySelectorAll("[data-dayfilter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.dayFilter = btn.dataset.dayfilter; render(); });
  });
  const dateClear = app.querySelector("[data-daterange-clear]");
  if(dateClear) dateClear.addEventListener("click", ()=>{ state.dateRange = {from:"", to:""}; state.dayFilter = "all"; render(); });
  app.querySelectorAll("[data-chip-remove]").forEach(btn=>{
    btn.addEventListener("click", e=>{ e.stopPropagation(); toggleChip(btn.dataset.chipRemove); });
  });
  const clearBtn = app.querySelector("[data-chip-clear]");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ state.chips = []; render(); });

  app.querySelectorAll("[data-compare-toggle]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.compareToggle;
      const idx = state.compareTargets.indexOf(name);
      if(idx>=0) state.compareTargets.splice(idx,1); else state.compareTargets.push(name);
      render();
    });
  });
  app.querySelectorAll("[data-compatradar-toggle]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.compatradarToggle;
      const idx = state.compatRadarTargets.indexOf(name);
      if(idx>=0) state.compatRadarTargets.splice(idx,1); else state.compatRadarTargets.push(name);
      render();
    });
  });
  app.querySelectorAll("[data-rankgrade-toggle]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.rankgradeToggle;
      const idx = state.rankGradeTargets.indexOf(name);
      if(idx>=0) state.rankGradeTargets.splice(idx,1); else state.rankGradeTargets.push(name);
      render();
    });
  });
  app.querySelectorAll("[data-rankgrade-view]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.rankGradeView = btn.dataset.rankgradeView;
      render();
    });
  });

  app.querySelectorAll("[data-copy-table]").forEach(btn=>{
    btn.addEventListener("click", ()=> copyCompareTsv(stats));
  });
}

// input-appの「Viewerを開く」から遷移した場合、localStorage経由で引き継がれたバックアップデータを
// 1回だけ自動的に読み込む（同一オリジンのlocalStorageを利用した端末内引き継ぎ。サーバー通信は行わない）。
// 読み込み後は必ずキーを削除し、通常のリロード時は従来どおり手動読み込みに戻す。
(function tryAutoLoadFromHandoff(){
  const KEY = "mj-viewer-handoff";
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      localStorage.removeItem(KEY);
      processBackupText(raw);
    }
  }catch(e){ /* 読み込み失敗時は通常のローダー画面にフォールバック */ }
})();

render();
</script>
