// 点棒メーター：率を点棒の長さでも示す。縦の緑線＝対象選手の平均。対象は称号と同じ条件（期間に合わせた3割基準）。
const METER_ROWS = [
  {key:"top", label:"トップ率", fmt:fmtPct, better:"high"},
  {key:"last", label:"ラス率", fmt:fmtPct, better:"low"},
  {key:"agariRate", label:"和了率", fmt:fmtPct0, better:"high"},
  {key:"houjuuRate", label:"放銃率", fmt:fmtPct0, better:"low"},
  {key:"riichiRate", label:"リーチ率", fmt:fmtPct0, better:null},
  {key:"fuuroRate", label:"副露率", fmt:fmtPct0, better:null},
];
function renderMeterBlock(stats){
  const T = titleThresholds(stats);
  const pool = stats.filter(x=>x.hanchanRankedCount>=T.rank && x.kyokuCount>=T.kyoku).sort((a,b)=>b.hanchanRankedCount-a.hanchanRankedCount);
  if(!pool.length) return "";
  if(!state.meterName || !pool.some(s=>s.name===state.meterName)) state.meterName = pool[0].name;
  const s = pool.find(x=>x.name===state.meterName);
  const picks = pool.map(x=>`<button type="button" class="pick ${x.name===s.name?'on':''}" data-meter-pick="${escapeAttr(x.name)}">${myTile(x.name,"xs")}${escapeHtml(x.name)}</button>`).join("");
  const rows = METER_ROWS.map(m=>{
    const vals = pool.map(x=>x[m.key]); const max = Math.max(...vals, 0.0001)*1.12;
    const avg = vals.reduce((a,b)=>a+b,0)/(vals.length||1);
    const w = Math.min(100, s[m.key]/max*100), aw = Math.min(100, avg/max*100);
    const diff = s[m.key]-avg, near = Math.abs(diff) < 0.005;
    const tag = near ? `<em>平均並み</em>` : m.better ? ((m.better==="high") === (diff>=0) ? `<em class="good">平均より良い</em>` : `<em class="bad">平均より悪い</em>`) : `<em>平均${diff>=0?"より多い":"より少ない"}</em>`;
    return `<div class="meter-row">
      <div class="meter-head"><span>${m.label}</span><b data-countup="${s[m.key]*100}" data-dec="${m.fmt===fmtPct?1:0}" data-suffix="%">${m.fmt(s[m.key])}</b></div>
      <div class="tenbou" style="--w:${w.toFixed(1)}%; --avg:${aw.toFixed(1)}%;"><span class="tenbou-bar"><i></i><i></i><i></i></span><span class="tenbou-avg" title="平均 ${m.fmt(avg)}"></span></div>
      <div class="meter-foot">平均 ${m.fmt(avg)}・${tag}</div>
    </div>`;
  }).join("");
  return `<div class="stats-hero">
    <div class="hero-head">点棒メーター<small>率を点棒の長さで。縦の線は対象${pool.length}人の平均</small></div>
    <div class="card">
      <div class="pick-row">${picks}</div>
      <div class="meter-card">
        <div class="meter-card-head">${myTile(s.name,"lg")}<div><div class="meter-name">${escapeHtml(s.name)}</div><div class="meter-sub">${s.hanchanRankedCount}半荘・平均順位 <b data-countup="${s.avgRank}" data-dec="2">${fmtAvg(s.avgRank)}</b></div></div></div>
        ${rows}
      </div>
    </div>
  </div>`;
}

// ⑥卓を囲む：選んだ対局日の確定済み半荘から、その日のメンバー（半荘数の多い順に4人）を東南西北に座らせる。
// 座る位置はその日の合計ptの順（東＝1位、南＝2位、西＝3位、北＝4位）。実際の座席ではない。
function tableDays(){
  const set = new Set();
  hanchanGroups().forEach(g=>{ if(state.raw.hanchanConfirmed[`${g.date}_${g.hanchanNo}`] && passesFilters(g.date)) set.add(g.date); });
  return Array.from(set).sort().reverse();
}
function computeDayTable(date){
  const per = new Map(); let hc = 0;
  hanchanGroups().forEach(g=>{
    if(g.date!==date) return;
    const key = `${g.date}_${g.hanchanNo}`;
    if(!state.raw.hanchanConfirmed[key]) return;
    hc++;
    const names = namesForHanchan(g.date, g.hanchanNo), ranks = state.raw.ranks[key]||[], pts = state.raw.finalPoints[key]||[];
    names.forEach((n,i)=>{
      if(!per.has(n)) per.set(n,{name:n, n:0, pt:0, ranks:[0,0,0,0], hist:[]});
      const p = per.get(n); p.n++; p.pt += (pts[i]||0); if(ranks[i]) p.ranks[ranks[i]-1]++; p.hist.push(ranks[i]||0);
    });
  });
  const all = Array.from(per.values()).sort((a,b)=>b.n-a.n || b.pt-a.pt);
  return {hc, four: all.slice(0,4).sort((a,b)=>b.pt-a.pt), others: all.slice(4)};
}
function renderDayTableSection(){
  const days = tableDays();
  if(!days.length) return `<div class="card"><div class="empty">対象期間に確定済みの半荘がありません。サイドバーの期間・曜日フィルタをご確認ください。</div></div>`;
  if(!state.tableDay || !days.includes(state.tableDay)) state.tableDay = days[0];
  const d = computeDayTable(state.tableDay);
  const seats = d.four.map((p,i)=>{
    const avg = p.n ? (p.ranks[0]+p.ranks[1]*2+p.ranks[2]*3+p.ranks[3]*4)/p.n : 0;
    const hist = p.hist.map(r=>`<i class="r${r}">${r||"-"}</i>`).join("");
    return `<div class="seat seat-${i}">
      <div class="seat-rank r${i+1}">${i+1}<small>位</small></div>
      <div class="seat-who">${myTile(p.name,"md")}<span>${escapeHtml(p.name)}</span></div>
      <div class="seat-pt ${p.pt>=0?'plus':'minus'}"><span data-countup="${p.pt}" data-dec="1" data-sign="1">${fmtPt(p.pt)}</span><small>pt</small></div>
      <div class="seat-hist" aria-label="着順の推移">${hist}</div>
      <div class="seat-sub">平均${avg.toFixed(2)}位・${p.n}半荘</div>
    </div>`;
  }).join("");
  const opts = days.map(x=>`<option value="${x}" ${x===state.tableDay?'selected':''}>${x.replace(/-/g,"/")}</option>`).join("");
  const top = d.four[0];
  return `<div class="card">
    <div class="table-toolbar">
      <label class="day-select">対局日<select data-table-day>${opts}</select></label>
      <span class="note" style="margin:0;">その日の確定済み${d.hc}半荘。並びはその日の合計ptの順</span>
    </div>
    <div class="mj-table"><div class="mj-felt">
      <div class="mj-center"><div class="mj-center-in">
        <div class="mj-date">${escapeHtml(state.tableDay.replace(/-/g,"."))}</div>
        <div class="mj-hc">${d.hc}<small>半荘</small></div>
        ${top ? `<div class="mj-mvp">本日のトップ<b>${escapeHtml(top.name)}</b></div>` : ""}
      </div></div>
      ${seats}
    </div></div>
    ${d.others.length ? `<div class="note">この日はほかに ${d.others.map(o=>escapeHtml(o.name)+"（"+o.n+"半荘）").join("、")} も参加（半荘数の多い4人を表示）</div>` : ""}
  </div>`;
}

// ②スコア推移のリプレイ：半荘ごとに折れ線が伸び、順位表が入れ替わる。描画済みのDOMをその場で更新して動かす（render()は呼ばない）。
// 対象：②で選択中のプレイヤーがいればその人たち（最大8人・チップの色）、いなければ期間内で半荘数の多い8人（選手固定色）。
const REPLAY_MAX_PLAYERS = 8;
function replayRowH(){ return (typeof window!=="undefined" && window.innerWidth<=760) ? 31 : 40; }
function buildReplayData(){
  const groups = hanchanGroups().filter(g=>state.raw.hanchanConfirmed[`${g.date}_${g.hanchanNo}`] && passesFilters(g.date));
  const count = new Map();
  groups.forEach(g=>namesForHanchan(g.date,g.hanchanNo).forEach(n=>count.set(n,(count.get(n)||0)+1)));
  const chosen = state.chips.filter(n=>count.has(n)).slice(0,REPLAY_MAX_PLAYERS);
  const useChips = chosen.length > 0;
  const players = useChips ? chosen : Array.from(count.entries()).sort((a,b)=>b[1]-a[1]).slice(0,REPLAY_MAX_PLAYERS).map(x=>x[0]);
  const color = n => useChips ? colorForChip(n) : entityColor(n);
  const cum = {}, series = {}; players.forEach(n=>{ cum[n]=0; series[n]=[0]; });
  const dates = [groups.length ? groups[0].date : ""];
  groups.forEach(g=>{
    const key=`${g.date}_${g.hanchanNo}`, names=namesForHanchan(g.date,g.hanchanNo), pts=state.raw.finalPoints[key]||[];
    players.forEach(n=>{ const i=names.indexOf(n); if(i!==-1) cum[n]+= (pts[i]||0); series[n].push(cum[n]); });
    dates.push(g.date);
  });
  return {players, series, dates, n:groups.length, color, useChips};
}
function renderReplay(){
  const d = buildReplayData();
  if(d.n < 2) return `<div class="empty">リプレイには確定済みの半荘が2件以上必要です。</div>`;
  const rh = replayRowH();
  const rows = d.players.map(n=>`<div class="rp-row" data-rp-row="${escapeAttr(n)}"><span class="rp-rank">-</span>${myTile(n,"sm")}<span class="rp-name">${escapeHtml(n)}</span><span class="rp-pt">0.0</span><span class="rp-bar"><i style="background:${d.color(n)}"></i></span></div>`).join("");
  return `
    <div class="rp-wrap" data-replay>
      <div class="rp-chart">
        <div class="rp-date"><span class="rp-date-v">${escapeHtml(d.dates[0])}</span><small class="rp-count">0 / ${d.n}半荘</small></div>
        <svg viewBox="0 0 640 340" class="rp-svg" role="img" aria-label="スコア推移のリプレイ"></svg>
      </div>
      <div class="rp-board" style="height:${d.players.length*rh}px;">${rows}</div>
    </div>
    <div class="rp-controls">
      <button type="button" class="rp-play" data-rp-play aria-label="再生"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path class="rp-ico-play" d="M3 1.5v11l9-5.5z" fill="currentColor"/><g class="rp-ico-pause" fill="currentColor"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1"/><rect x="8.3" y="1.5" width="3.2" height="11" rx="1"/></g></svg><span>再生</span></button>
      <input type="range" class="rp-seek" data-rp-seek min="0" max="${d.n}" value="0" aria-label="位置">
      <div class="seg rp-speed" role="group" aria-label="速度"><button type="button" class="seg-btn on" data-rp-speed="1">1×</button><button type="button" class="seg-btn" data-rp-speed="3">3×</button><button type="button" class="seg-btn" data-rp-speed="8">8×</button></div>
    </div>
    <div class="note">${d.useChips ? `選択中の${d.players.length}人が対象` : `期間内で半荘数の多い${d.players.length}人が対象（下の凡例で選手を選ぶと、その人たちで再生できます）`}。順位表は、その時点の累計ptの順に入れ替わります。</div>`;
}
function setupReplay(root){
  const wrap = root.querySelector("[data-replay]"); if(!wrap) return;
  const d = buildReplayData();
  const svg = wrap.querySelector(".rp-svg"), W=640, H=340, padL=44, padR=14, padT=14, padB=24;
  const all = d.players.flatMap(n=>d.series[n]).concat([0]);
  const maxV=Math.max(...all), minV=Math.min(...all);
  const xAt=i=>padL + i*(W-padL-padR)/d.n, yAt=v=>(H-padB)-((v-minV)/((maxV-minV)||1))*(H-padT-padB);
  const step=(()=>{ const raw=(maxV-minV||1)/5, mag=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/mag; return (f<1.5?1:f<3?2:f<7?5:10)*mag; })();
  let grid="";
  for(let v=Math.ceil(minV/step)*step; v<=maxV+1e-9; v+=step){ const z=Math.abs(v)<1e-9, y=yAt(v).toFixed(1); grid+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="${z?CHART_ZERO:CHART_GRID}" stroke-width="${z?1.2:1}" ${z?"":'stroke-dasharray="3,4"'}/><text x="${padL-8}" y="${(+y+4).toFixed(1)}" font-size="11" fill="${CHART_TEXT}" text-anchor="end">${(v>0?"+":"")+Math.round(v)}</text>`; }
  svg.innerHTML = grid + d.players.map((n,k)=>`<polyline data-l="${k}" fill="none" stroke="${d.color(n)}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle data-c="${k}" r="4" fill="${d.color(n)}" stroke="#f3ecdb" stroke-width="2"/>`).join("");
  const rows = Array.from(wrap.querySelectorAll("[data-rp-row]"));
  const lines = d.players.map((n,k)=>svg.querySelector(`[data-l="${k}"]`)), dots = d.players.map((n,k)=>svg.querySelector(`[data-c="${k}"]`));
  const absMax = Math.max(1, ...all.map(Math.abs)), rowH = replayRowH();
  const dateEl=wrap.querySelector(".rp-date-v"), countEl=wrap.querySelector(".rp-count");
  const ctl = root.querySelector(".rp-controls"), playBtn=ctl.querySelector("[data-rp-play]"), seek=ctl.querySelector("[data-rp-seek]");
  let pos=0, playing=false, speed=1, last=0, raf=0;
  function draw(p){
    const k=Math.floor(p), t=p-k;
    const val = n => { const s=d.series[n]; return k>=d.n ? s[d.n] : s[k]+(s[k+1]-s[k])*t; };
    d.players.forEach((n,j)=>{
      const s=d.series[n], pts=[]; for(let i=0;i<=Math.min(k,d.n);i++) pts.push(`${xAt(i).toFixed(1)},${yAt(s[i]).toFixed(1)}`);
      const v=val(n); if(k<d.n) pts.push(`${xAt(p).toFixed(1)},${yAt(v).toFixed(1)}`);
      lines[j].setAttribute("points", pts.join(" ")); dots[j].setAttribute("cx", xAt(Math.min(p,d.n)).toFixed(1)); dots[j].setAttribute("cy", yAt(v).toFixed(1));
    });
    d.players.map((n,j)=>({j, v:val(n)})).sort((a,b)=>b.v-a.v).forEach((o,i)=>{
      const r=rows[o.j]; r.style.transform=`translateY(${i*rowH}px)`; r.querySelector(".rp-rank").textContent=i+1;
      const pt=r.querySelector(".rp-pt"); pt.textContent=fmtPt(o.v); pt.className="rp-pt "+(o.v>=0?"plus":"minus");
      const bar=r.querySelector(".rp-bar i"); bar.style.width=(Math.abs(o.v)/absMax*100).toFixed(1)+"%"; bar.style.opacity=o.v>=0?1:.45;
    });
    dateEl.textContent = d.dates[Math.min(Math.ceil(p), d.n)] || ""; countEl.textContent = `${Math.min(Math.round(p),d.n)} / ${d.n}半荘`;
    seek.value = Math.round(p);
  }
  function setPlaying(v){ playing=v; playBtn.classList.toggle("is-playing", v); playBtn.querySelector("span").textContent = v?"一時停止":(pos>=d.n?"もう一度":"再生"); playBtn.setAttribute("aria-label", v?"一時停止":"再生"); }
  function tick(now){
    if(!document.body.contains(wrap)){ cancelAnimationFrame(raf); return; }
    if(playing){ const dt=Math.min(0.1,(now-last)/1000); pos=Math.min(d.n, pos + dt*speed*Math.max(6, d.n/14)); draw(pos); if(pos>=d.n) setPlaying(false); }
    last=now; raf=requestAnimationFrame(tick);
  }
  playBtn.addEventListener("click", ()=>{ if(!playing && pos>=d.n) pos=0; setPlaying(!playing); });
  seek.addEventListener("input", ()=>{ pos=+seek.value; draw(pos); if(playing) setPlaying(false); });
  ctl.querySelectorAll("[data-rp-speed]").forEach(b=>b.addEventListener("click", ()=>{ speed=+b.dataset.rpSpeed; ctl.querySelectorAll("[data-rp-speed]").forEach(x=>x.classList.toggle("on", x===b)); }));
  draw(0); setPlaying(false); last=performance.now(); raf=requestAnimationFrame(tick);
}
// 数字の演出：data-countup を持つ数値を0から最終値までカウントアップする（動きを減らす設定では行わない）
function runCountUp(root){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const items = Array.from(root.querySelectorAll("[data-countup]")).map(el=>({el, to:parseFloat(el.dataset.countup)||0, dec:+(el.dataset.dec||0), suf:el.dataset.suffix||"", sign:el.dataset.sign==="1", final:el.textContent}));
  if(!items.length) return;
  const t0 = performance.now(), dur = 900;
  const fmt = (it,v)=> (it.sign && v>0 ? "+" : "") + v.toFixed(it.dec) + it.suf;
  (function step(now){
    const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
    items.forEach(it=>{ it.el.textContent = k<1 ? fmt(it, it.to*e) : it.final; });
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

// ---------- 選択チップの共通操作 ----------
function toggleChip(name){
  const idx = state.chips.indexOf(name);
  if(idx>=0) state.chips.splice(idx,1); else state.chips.push(name);
  render();
}

// ---------- 表のコピー（①比較表） ----------
function copyCompareTsv(allStats){
  const targets = state.compareTargets || [];
  const ordered = targets.filter(n=>n===COMPARE_AVERAGE_NAME).concat(targets.filter(n=>n!==COMPARE_AVERAGE_NAME));
  const stats = ordered.map(n=>resolveCompareStat(n, allStats)).filter(Boolean);
  const header = [filterCondLabel()].concat(stats.map(s=>s.name)); // 左上セルに絞り込み条件を入れる
  const lines = [header.join("\t")];
  compareMetricsInScope().forEach(m=>{
    lines.push([m.label].concat(stats.map(s=>String(m.fmt(s[m.key])))).join("\t"));
  });
  copyText(lines.join("\n"));
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("表をコピーしました")).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); toast("表をコピーしました"); }
  catch(e){ toast("コピーに失敗しました"); }
  document.body.removeChild(ta);
}

// ---------- 指標の定義ツールチップ（document全体で1つ。再描画しても使い回す） ----------
(function setupTips(){
  const pop = document.createElement("div"); pop.className = "tip-pop"; pop.setAttribute("role","tooltip"); document.body.appendChild(pop);
  let cur = null, shownAt = 0;
  function show(el){
    if(cur !== el) shownAt = Date.now();
    cur = el; pop.innerHTML = `<b>${escapeHtml(el.textContent)}</b>${escapeHtml(el.dataset.tip)}`;
    pop.classList.add("show");
    const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8), y = r.bottom + 8;
    if(y + ph > window.innerHeight - 8) y = r.top - ph - 8;
    pop.style.left = x+"px"; pop.style.top = y+"px";
  }
  function hide(){ cur = null; pop.classList.remove("show"); }
  document.addEventListener("mouseover", e=>{ const el = e.target.closest && e.target.closest("[data-tip]"); if(el) show(el); else if(cur) hide(); });
  document.addEventListener("focusin", e=>{ const el = e.target.closest && e.target.closest("[data-tip]"); if(el) show(el); });
  document.addEventListener("focusout", hide);
  document.addEventListener("click", e=>{ const el = e.target.closest && e.target.closest("[data-tip]"); if(el){ if(cur===el && Date.now()-shownAt > 450) hide(); else show(el); } else hide(); }); // タップ直前のmouseoverで表示した直後は閉じない
  window.addEventListener("scroll", hide, true);
})();

    state.dateRange = {from:pr.from, to:pr.to}; render._countupNext = true; render();
  }));
  app.querySelectorAll("[data-title-edit]").forEach(b=>b.addEventListener("click", ()=>{ state.titleEditOpen = !state.titleEditOpen; render(); }));

  if(tSave) tSave.addEventListener("click", ()=>{

    toast(saveTitleNames(obj) ? "二つ名を保存しました" : "このブラウザでは保存できませんでした");
    state.titleEditOpen = false; render();

  const tReset = app.querySelector("[data-title-reset]");

  app.querySelectorAll("[data-meter-pick]").forEach(b=>b.addEventListener("click", ()=>{ state.meterName = b.dataset.meterPick; render._countupNext = true; render(); }));
  const tDay = app.querySelector("[data-table-day]");
  if(tDay) tDay.addEventListener("change", ()=>{ state.tableDay = tDay.value; render._countupNext = true; render(); });
  const gReplay = app.querySelector("[data-graph-replay]");
  if(gReplay) gReplay.addEventListener("click", ()=>{ state.graphReplay = !state.graphReplay; render(); });
  const mToggle = app.querySelector("[data-m-filter-toggle]");
  if(mToggle) mToggle.addEventListener("click", ()=>{ state.mobileMenuOpen = !state.mobileMenuOpen; render(); });

  app.querySelectorAll("[data-toggle-stats-collapse]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.dataset.toggleStatsCollapse;
      const defaultExpanded = el.dataset.toggleDefault === "expanded";
      const collapsedNow = isStatsCollapsed(key, defaultExpanded);
      state.statsCollapsed[key] = collapsedNow ? false : true;
      render();
    });
  });

  app.querySelectorAll("[data-toggle-compare-group]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.dataset.toggleCompareGroup;
      const collapsedNow = state.compareGroupCollapsed[key] === true;
      state.compareGroupCollapsed[key] = collapsedNow ? false : true;
      render();
    });
  });

  const reloadBtn = app.querySelector("[data-reload]");
  if(reloadBtn) reloadBtn.addEventListener("click", ()=>{
    if(confirm("表示中のデータを破棄して、別のファイルを読み込みますか？")){
      state.raw = null; state.loaded = false; render();
    }
  });

  app.querySelectorAll("[data-chip-toggle]").forEach(el=>{
    el.addEventListener("click", ()=> toggleChip(el.dataset.chipToggle));
  });
  app.querySelectorAll("[data-graph-name]").forEach(el=>{
    el.addEventListener("click", ()=> toggleChip(el.dataset.graphName));
  });
  const dateFrom = app.querySelector("[data-daterange-from]");
  if(dateFrom) dateFrom.addEventListener("change", ()=>{ state.dateRange.from = dateFrom.value; render(); });
  const dateTo = app.querySelector("[data-daterange-to]");
  if(dateTo) dateTo.addEventListener("change", ()=>{ state.dateRange.to = dateTo.value; render(); });
  app.querySelectorAll("[data-dayfilter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.dayFilter = btn.dataset.dayfilter; render(); });
  });
  const dateClear = app.querySelector("[data-daterange-clear]");
  if(dateClear) dateClear.addEventListener("click", ()=>{ state.dateRange = {from:"", to:""}; state.dayFilter = "all"; render(); });
  app.querySelectorAll("[data-chip-remove]").forEach(btn=>{
    btn.addEventListener("click", e=>{ e.stopPropagation(); toggleChip(btn.dataset.chipRemove); });
  });
  const clearBtn = app.querySelector("[data-chip-clear]");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ state.chips = []; render(); });

  app.querySelectorAll("[data-compare-toggle]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.compareToggle;
      const idx = state.compareTargets.indexOf(name);
      if(idx>=0) state.compareTargets.splice(idx,1);
      else if(name===COMPARE_AVERAGE_NAME) state.compareTargets.unshift(name); // 平均列は先頭
      else state.compareTargets.push(name);
      render();
    });
  });
  app.querySelectorAll("[data-compatradar-toggle]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.compatradarToggle;
      const idx = state.compatRadarTargets.indexOf(name);
      if(idx>=0) state.compatRadarTargets.splice(idx,1); else state.compatRadarTargets.push(name);
      render();
    });
  });
  app.querySelectorAll("[data-rankgrade-toggle]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.rankgradeToggle;
      const idx = state.rankGradeTargets.indexOf(name);
      if(idx>=0) state.rankGradeTargets.splice(idx,1); else state.rankGradeTargets.push(name);
      render();
    });
  });
  app.querySelectorAll("[data-houjuumatrix-mode]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.houjuuMatrixMode = btn.dataset.houjuumatrixMode; render(); });
  });
  app.querySelectorAll("[data-houjuumatrix-toggle]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.houjuumatrixToggle;
      const idx = state.houjuuMatrixTargets.indexOf(name);
      if(idx>=0) state.houjuuMatrixTargets.splice(idx,1); else state.houjuuMatrixTargets.push(name);
      render();

  app.querySelectorAll("[data-rankgrade-view]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.rankGradeView = btn.dataset.rankgradeView;
      render();
    });
  });

  app.querySelectorAll("[data-compare-scope]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.compareScope = btn.dataset.compareScope; render(); });
  });
  app.querySelectorAll("[data-compare-orient]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.compareOrient = btn.dataset.compareOrient; render(); });
  });
  app.querySelectorAll("[data-compare-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.compareTab = btn.dataset.compareTab; render(); });
  });
  app.querySelectorAll("[data-copy-table]").forEach(btn=>{
    btn.addEventListener("click", ()=> copyCompareTsv(stats));
  });
}

// input-appの「Viewerを開く」から遷移した場合、localStorage経由で引き継がれたバックアップデータを
// 1回だけ自動的に読み込む（同一オリジンのlocalStorageを利用した端末内引き継ぎ。サーバー通信は行わない）。
// 読み込み後は必ずキーを削除し、通常のリロード時は従来どおり手動読み込みに戻す。
(function tryAutoLoadFromHandoff(){
  const KEY = "mj-viewer-handoff";
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      localStorage.removeItem(KEY);
      processBackupText(raw);
    }
  }catch(e){ /* 読み込み失敗時は通常のローダー画面にフォールバック */ }
})();

render();
