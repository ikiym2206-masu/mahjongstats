// ---------- 和了者／放銃者／流局／チョンボ選択オーバーレイ ----------
function renderOverlay(){
  const ov = state.overlay;
  if(!ov) return "";
  if(ov.type === "winner"){
    const title = ov.action === "tsumo" ? "誰がツモりましたか？" : "誰がロンしましたか？";
    const btns = state.players.map((name,i)=>
      `<button type="button" class="overlay-btn" data-pick-winner="${i}">
        <span>${escapeHtml(name||"プレイヤー"+(i+1))}</span><span class="pos">${POS_LABELS[i]}</span>
      </button>`).join("");
    return overlaySheet(title, "和了したプレイヤーを選んでください", `<div class="overlay-grid">${btns}</div>`);
  }
  if(ov.type === "loser"){
    const winnerName = state.players[ov.winner] || "プレイヤー"+(ov.winner+1);
    const btns = state.players.map((name,i)=>{
      if(i===ov.winner) return "";
      return `<button type="button" class="overlay-btn" data-pick-loser="${i}">
        <span>${escapeHtml(name||"プレイヤー"+(i+1))}</span><span class="pos">${POS_LABELS[i]}</span>
      </button>`;
    }).join("");
    return overlaySheet(`誰の放銃ですか？`, `${escapeHtml(winnerName)}さんのロン・放銃者を選んでください`, `<div class="overlay-grid">${btns}</div>`);
  }
  if(ov.type === "ryuukyoku"){
    const btns = `
      <button type="button" class="overlay-btn" data-pick-ryuukyoku="oya">聴牌<span class="pos">親は連荘</span></button>
      <button type="button" class="overlay-btn" data-pick-ryuukyoku="noten">ノーテン<span class="pos">次の局へ</span></button>`;
    return overlaySheet("流局", "親のテンパイ有無を選んでください", `<div class="overlay-grid">${btns}</div>`);
  }
  if(ov.type === "chombo"){
    const sel = ov.selected;
    const btns = state.players.map((name,i)=>
      `<button type="button" class="overlay-btn ${sel[i]?'selected':''}" data-pick-chombo="${i}">
        <span>${escapeHtml(name||"プレイヤー"+(i+1))}</span><span class="pos">${POS_LABELS[i]}</span>
      </button>`).join("");
    const any = sel.some(Boolean);
    return overlaySheet("チョンボ", "チョンボしたプレイヤーを選んでください（複数選択可）",
      `<div class="overlay-grid">${btns}</div>
       <button type="button" class="overlay-confirm" id="confirmChomboBtn" ${any?'':'disabled'}>この内容でチョンボを記録</button>`);
  }
  return "";
}
function overlaySheet(title, sub, body){
  return `
    <div class="overlay-backdrop" id="overlayBackdrop">
      <div class="overlay-sheet">
        <div class="overlay-title">${title}</div>
        <div class="overlay-sub">${sub}</div>
        ${body}
        <button type="button" class="overlay-cancel" id="overlayCancelBtn">キャンセル</button>
      </div>
    </div>`;
}

// ---- 麻雀卓UIのアクション（ツモ・ロン・流局・チョンボ）フロー ----
function openTsumoFlow(){ state.overlay = {type:"winner", action:"tsumo"}; render(); }
function openRonFlow(){ state.overlay = {type:"winner", action:"ron"}; render(); }
function openRyuukyokuFlow(){ state.overlay = {type:"ryuukyoku"}; render(); }
function openChomboFlow(){
  state.overlay = {type:"chombo", selected: state.current.toggles.map(t=>t[K_CHOMBO]?1:0)};
  render();
}
// オーバーレイを取り消す：フロー途中で仮に付いたツモ／ロン／放銃フラグ（リーチ・副露は対象外）を消してから閉じる
function closeOverlay(){
  state.current.toggles.forEach(t=>{ t[K_TSUMO]=0; t[K_RON]=0; t[K_HOUJUU]=0; });
  state.overlay = null;
  render();
}

function pickWinner(idx){
  const action = state.overlay.action;
  toggleStat(idx, action==="tsumo" ? K_TSUMO : K_RON);
  if(action==="tsumo"){
    finalizeAgari(idx);
  }else{
    state.overlay = {type:"loser", winner: idx};
    render();
  }
}
function pickLoser(idx){
  toggleStat(idx, K_HOUJUU);
  finalizeAgari(state.overlay.winner);
}
function finalizeAgari(winnerIdx){
  const cur = state.current;
  const seatOrder = getSeatOrder(cur.date, cur.hanchanNo);
  const dealerIndex = seatOrder[cur.kyoku % 4];
  const resultType = winnerIdx === dealerIndex ? "renchan" : "next";
  if(!validateAgariHoujuuConsistency()){ return; } // ロンで放銃者未選択のまま呼ばれることは無いはずだが念のため
  state.overlay = null;
  if(state.editingId) commitEdit(resultType); else onSave(resultType);
}
function pickRyuukyokuOutcome(oyaTenpai){
  const resultType = oyaTenpai ? "renchan" : "ryuukyoku";
  state.overlay = null;
  if(state.editingId) commitEdit(resultType); else onSave(resultType);
}
function toggleChomboSelect(idx){
  state.overlay.selected[idx] = state.overlay.selected[idx] ? 0 : 1;
  render();
}
function confirmChombo(){
  const sel = state.overlay.selected;
  if(!sel.some(Boolean)){ toast("チョンボしたプレイヤーを選んでください"); return; }
  sel.forEach((v,i)=>{
    const desired = v ? 1 : 0;
    if(state.current.toggles[i][K_CHOMBO] !== desired) toggleStat(i, K_CHOMBO);
  });
  state.overlay = null;
  if(state.editingId) commitEdit("chombo"); else onSave("chombo");
}

// プレイヤーindex(0-3)から座席ラベル（東家/南家/西家/北家）を求める
function seatLabelForPlayer(seatOrder, playerIdx){
  const pos = seatOrder.indexOf(playerIdx);
  return pos===-1 ? "-" : SEAT_LABELS[pos];
}

function renderHanchanTab(){
  const allGroups = hanchanGroups();
  if(!allGroups.length) return `<div class="card"><div class="empty">局入力タブでデータを入力すると、ここに半荘ごとの集計が表示されます。</div></div>`;
  const filter = state.hanchanMonthFilter;
  const weekdayFilter = state.hanchanWeekdayFilter;
  let groups = filter ? allGroups.filter(g=>g.date.slice(0,7)===filter) : allGroups;
  if(weekdayFilter && weekdayFilter !== "all"){
    groups = groups.filter(g => weekdayFilter==="weekend" ? isWeekendDate(g.date) : !isWeekendDate(g.date));
  }
  const filterBar = `
    <div class="card" style="padding:12px 14px;">
      <div class="graph-range" style="margin-bottom:0;">
        <span class="n-sub" style="font-weight:800; color:var(--ink);">年月で絞り込み</span>
        <input type="month" id="hanchanMonthFilter" value="${filter}">
        ${filter ? `<button type="button" class="chip" id="hanchanMonthClear">すべて表示</button>` : ""}
      </div>
      <div class="mode-switch weekday-switch" style="margin-top:10px; margin-bottom:0;">
        <button type="button" data-hanchan-weekday="all" class="${weekdayFilter==='all'?'active':''}">すべて</button>
        <button type="button" data-hanchan-weekday="weekday" class="${weekdayFilter==='weekday'?'active':''}">平日</button>
        <button type="button" data-hanchan-weekday="weekend" class="${weekdayFilter==='weekend'?'active':''}">週末</button>
      </div>
    </div>`;
  if(!groups.length){
    const msg = filter ? `${filter.slice(0,4)}年${filter.slice(5,7)}月に該当する半荘がありません` : `該当する半荘がありません`;
    return filterBar + `<div class="card"><div class="empty">${msg}</div></div>`;
  }
  return filterBar + groups.map(({date,hanchanNo})=>{
    const key = `${date}_${hanchanNo}`;
    const names = namesForHanchan(date, hanchanNo);
    const totals = computeHanchanTotals(date, hanchanNo);
    const kyokuStats = computeHanchanKyokuStats(date, hanchanNo);
    const chomboPt = computeHanchanChomboPt(date, hanchanNo);
    const ranks = state.ranks[key] || [null,null,null,null];
    const scores = state.finalScores[key] || [null,null,null,null];
    const points = state.finalPoints[key] || [null,null,null,null];
    const confirmed = !!state.hanchanConfirmed[key];
    const seatOrder = getSeatOrder(date, hanchanNo);
    const isResultOnlyHanchan = state.records.some(r=>r.date===date && r.hanchanNo===hanchanNo && r.resultType==="resultonly");
    // 結果のみ入力の半荘は座席データを記録・保持しないため、座席表示も常に「-」とする（seatLabelForPlayerを呼ばない）
    const seatLabel = (i)=> isResultOnlyHanchan ? "-" : seatLabelForPlayer(seatOrder, i);
    const headMeta = `<span class="n">半荘No.${hanchanNo}</span> <span class="n-sub">${isResultOnlyHanchan ? "結果のみ入力（局の詳細なし）" : `総局数${kyokuStats.total} ・ 流局数${kyokuStats.ryuukyoku}`}</span>`;

    if(confirmed){
      // ---- 確定済み：順位の昇順（1着→4着、同着は同じ順位）に並べ替えて表示 ----
      // 最小化⇔展開：最小化時はヘッダー情報（見出し）のみ表示し、展開時に集計テーブルを表示する。デフォルトは最小化。
      const collapsed = state.hanchanCollapsed[key] !== false;
      const order = [0,1,2,3].sort((a,b)=>(ranks[a]||9)-(ranks[b]||9) || a-b);
      const rows = order.map(i=>{
        const name = names[i];
        const score = scores[i];
        const pt = points[i];
        return `
        <tr>
          <td class="rank-cell"><span class="rank-chip on-${ranks[i]}" style="pointer-events:none">${ranks[i]||"-"}</span></td>
          <td style="text-align:left; font-weight:800">${escapeHtml(name||"P"+(i+1))}${chomboMark(totals[i].chombo)}</td>
          <td class="n-sub">${seatLabel(i)}</td>
          <td class="score-cell ${score<0?'neg':''}">${score===null||score===undefined?"-":score.toLocaleString()}</td>
          <td class="score-cell ${pt<0?'neg':''}">${fmtPt(pt)}</td>
          <td>${totals[i].riichi}</td><td>${totals[i].fuuro}</td><td>${totals[i].tsumo}</td><td>${totals[i].ron}</td><td>${totals[i].houjuu}</td>
        </tr>`;
      }).join("");
      return `
      <div class="card" id="hanchan-${key}">
        <div class="row-between" data-toggle-hanchan-collapse="${key}" style="cursor:pointer;">
          <h2 style="margin:0">${fmtDate(date)} ${headMeta}</h2>
          <span class="n-sub" style="font-size:13px;">${collapsed?'▶':'▼'}</span>
        </div>
        ${collapsed ? "" : `
        <div class="row-between" style="margin-top:8px;">
          <div></div>
          <div style="display:flex; gap:6px;">
            <button class="chip" data-edit-hanchan="${key}" style="color:var(--primary); font-weight:800; border-color:var(--primary);">✎ 編集</button>
            <button class="chip" data-delete-hanchan="${key}" style="color:var(--houjuu); font-weight:800; border-color:var(--houjuu);">🗑 削除</button>
          </div>
        </div>
        <table class="stat-mini-table" style="margin-top:10px;">
          <tr><th></th><th style="text-align:left">選手</th><th>座席</th><th>持ち点</th><th>得点pt</th><th>リーチ</th><th>副露</th><th>ツモ</th><th>ロン</th><th>放銃</th></tr>
          ${rows}
        </table>
        `}
      </div>`;
    }

    // ---- 編集中：最終持ち点(素点)を入力する段階（順位・得点ptは素点＋チョンボ罰則から自動算出） ----
    const recordList = renderHanchanRecordList(date, hanchanNo, names);
    const previewRanks = computeRanksFromScores(scores) || [null,null,null,null];
    const previewBasePoints = computeFinalPoints(scores, seatOrder);
    const previewPoints = previewBasePoints ? previewBasePoints.map((p,i)=>p+chomboPt[i]) : null;
    const diff = scoreSumDiff(scores);
    const sumNow = scores.every(s=>s!==null && s!==undefined && s!=="" && !isNaN(s)) ? scores.reduce((a,b)=>a+Number(b),0) : null;
    const rows = [0,1,2,3].map(i=>`
      <tr>
        <td style="text-align:left; font-weight:800">${escapeHtml(names[i]||"P"+(i+1))}${chomboMark(totals[i].chombo)}</td>
        <td class="n-sub">${seatLabel(i)}</td>
        <td>${totals[i].riichi}</td><td>${totals[i].fuuro}</td><td>${totals[i].tsumo}</td><td>${totals[i].ron}</td><td>${totals[i].houjuu}</td>
      </tr>`).join("");
    const scoreRows = [0,1,2,3].map(i=>{
      const r = previewRanks[i];
      const val = (scores[i]===null || scores[i]===undefined) ? "" : scores[i];
      const ptPreview = previewPoints ? fmtPt(previewPoints[i]) : "-";
      return `
      <div class="score-row">
        <div class="nm">${escapeHtml(names[i]||"P"+(i+1))} <span class="n-sub">${seatLabel(i)}</span></div>
        <div class="score-input-wrap">
          <span class="rank-chip rank-preview ${r?'on-'+r:''}">${r||"-"}</span>
          <input type="number" inputmode="numeric" step="100" class="score-input" placeholder="0"
            data-score-key="${key}" data-score-p="${i}" value="${val}">
          <span class="n-sub" style="min-width:44px; text-align:right;">${ptPreview}</span>
        </div>
      </div>`;
    }).join("");
    const sumNote = sumNow===null
      ? `<div class="empty" style="text-align:left; padding:6px 0 0;">4人分の最終持ち点（素点）を入力すると、合計と得点pt（オカ・ウマ・チョンボ罰則反映）が自動計算されます。</div>`
      : diff===null
        ? `<div class="empty" style="text-align:left; padding:6px 0 0; color:var(--primary);">合計 ${sumNow.toLocaleString()}点（OK：配給原点合計100,000点と一致）</div>`
        : `<div class="empty" style="text-align:left; padding:6px 0 0; color:var(--houjuu);">合計 ${sumNow.toLocaleString()}点（100,000点との差分：${diff>0?'+':''}${diff}点）。合計が100,000点になるよう修正してください。</div>`;
    return `
      <div class="card" id="hanchan-${key}">
        <div class="row-between">
          <h2 style="margin:0">${fmtDate(date)} ${headMeta}</h2>
          <button class="chip" data-delete-hanchan="${key}" style="color:var(--houjuu); font-weight:800; border-color:var(--houjuu);">🗑 削除</button>
        </div>
        <table class="stat-mini-table">
          <tr><th style="text-align:left">選手</th><th>座席</th><th>リーチ</th><th>副露</th><th>ツモ</th><th>ロン</th><th>放銃</th></tr>
          ${rows}
        </table>
        <h2 style="margin-top:14px">最終持ち点（素点）</h2>
        ${scoreRows}
        ${sumNote}
        <button class="btn-confirm-rank" data-confirm-hanchan="${key}">順位を確定する</button>
        ${recordList}
      </div>`;
  }).join("");
}

// チョンボは発生することが稀なため、他の数値と同じ列で常に表示するのではなく、
// 発生した場合のみ小さなマークとして選手名の隣に添える。
function chomboMark(count){
  return count>0 ? ` <span class="chombo-mark">⚠️チョンボ×${count}</span>` : "";
}

// 半荘集計カード内に、その半荘を構成する局ごとの記録一覧を表示する（局入力タブと同じ✎編集／×削除操作が可能）。
function renderHanchanRecordList(date, hanchanNo, names){
  const recs = state.records.filter(r=>r.date===date && r.hanchanNo===hanchanNo);
  if(!recs.length) return "";
  const rows = recs.map(r=>{
    const tags = [];
    r.stats.forEach((s,i)=>{
      const t=[]; if(s[K_RIICHI])t.push("リ"); if(s[K_FUURO])t.push("副"); if(s[K_TSUMO])t.push("ツ"); if(s[K_RON])t.push("ロ"); if(s[K_HOUJUU])t.push("放"); if(s[K_CHOMBO])t.push("チョ");
      if(t.length) tags.push(`${names[i]}:${t.join("")}`);
    });
    const desc = tags.join(" / ") || "変化なし";
    const short = RESULT_SHORT[r.resultType];
    const honbaTag = r.honba ? `${r.honba}本場` : "";
    const tag = `${r.kyoku}${honbaTag?"・"+honbaTag:""}${short?"・"+short:""}`;
    return `<div class="history-item">
      <span class="tag">${tag}</span>
      <span class="desc">${escapeHtml(desc)}</span>
      <button class="edit" data-hanchan-edit-record="${r.id}">✎</button>
      <button class="del" data-hanchan-del-record="${r.id}">×</button>
    </div>`;
  }).join("");
  return `<div class="stat-section-label" style="margin-top:12px;">局ごとの記録（${recs.length}局）</div>${rows}`;
}
function renderSettings(){
  const roster = state.playerRoster;
  const rosterChips = roster.length ? `
    <div class="chip-row">${roster.map(n=>`
      <span class="chip">${escapeHtml(n)}<button type="button" class="chip-del" data-roster-del="${escapeAttr(n)}">×</button></span>`).join("")}</div>`
    : `<div class="empty">まだリストに名前が登録されていません。</div>`;
  const selects = state.players.map((name,i)=>{
    const opts = [`<option value="">未選択</option>`].concat(
      roster.map(n=>`<option value="${escapeAttr(n)}" ${name===n?'selected':''}>${escapeHtml(n)}</option>`)
    ).join("");
    return `
    <div class="field">
      <label>プレイヤー${i+1}</label>
      <select data-player-select="${i}" style="width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; background:var(--surface); color:var(--ink); font-weight:700; font-family:inherit;">
        ${opts}
      </select>
    </div>`;
  }).join("");
  return `
    <div class="card">
      <h2>プレイヤー名リスト（事前登録）</h2>
      <div class="field" style="display:flex; gap:8px; align-items:flex-end; margin-bottom:6px;">
        <div style="flex:1;"><input type="text" id="rosterNameInput" placeholder="名前を入力して追加"></div>
        <button type="button" class="btn-ghost" id="addRosterBtn" style="width:auto; padding:11px 16px; margin-top:0;">＋追加</button>
      </div>
      ${rosterChips}
    </div>
    <div class="card">
      <h2>対局メンバー（4人）</h2>
      <div class="empty" style="text-align:left; padding:0 0 10px;">上のリストから、今回対局する4人を選んでください。ここでの変更は今後の入力にのみ適用され、<b style="color:var(--ink);">過去に記録した半荘の選手名（半荘集計・統計タブでの表示）は変わりません</b>（記録した時点のメンバーで固定されます）。</div>
      ${selects}
    </div>
    <div class="card">
      <h2>Viewerで見る</h2>
      <div class="empty" style="text-align:left; padding:0 0 10px;">対局記録の集計・分析はViewer（PC向け）で確認できます。</div>
      <a class="btn-ghost" href="viewer-app.html" id="openViewerBtn" style="display:block; text-align:center; box-sizing:border-box; text-decoration:none;">📊 Viewerを開く</a>
    </div>
    <div class="card">
      <h2>データ管理</h2>
      <button class="btn-ghost" id="exportBtn">CSVで書き出す</button>
      <label class="btn-ghost" style="display:block; text-align:center; margin-top:8px; cursor:pointer;">
        CSVから読み込む
        <input type="file" id="importCsvInput" accept=".csv,text/csv" style="display:none;">
      </label>
      <button class="btn-ghost" id="importCsvUrlBtn" style="margin-top:8px;">🌐 サイト上のhanchan.csvを読み込む</button>
      <div class="empty" style="text-align:left; padding:14px 0 6px;">半荘の順位・スコアだけを記録した過去大会データ（局の詳細なし）も取り込めます。「半荘ID,プレイヤー,素点」の列（旧集計表の元データ形式もそのまま可）があればOKです。</div>
    </div>
    <div class="card">
      <h2>データのバックアップ</h2>
      <div class="empty" style="text-align:left; padding:0 0 10px;">記録はこの端末のブラウザ内（ローカル）に保存されています。ブラウザのキャッシュ削除や機種変更でデータが消えないよう、バックアップファイルの保存をおすすめします。</div>
      <button class="btn-ghost" id="exportBackupBtn">📤 バックアップをダウンロード（JSON）</button>
      <label class="btn-ghost" style="display:block; text-align:center; margin-top:8px; cursor:pointer;">
        📥 バックアップから復元
        <input type="file" id="importBackupInput" accept="application/json" style="display:none;">
      </label>
      <button class="btn-ghost" id="importBackupUrlBtn" style="margin-top:8px;">🌐 サイト上のbackup.jsonから復元</button>
    </div>
    <div class="card">
      <h2 style="color:var(--houjuu);">危険な操作</h2>
      <div class="empty" style="text-align:left; padding:0 0 10px;">この端末に保存されている、このアプリの記録・設定を<b style="color:var(--houjuu);">すべて削除</b>します。元に戻せません。実行前に「バックアップをダウンロード」で保存しておくことをおすすめします。</div>
      <button class="btn-ghost" id="resetAllDataBtn" style="border-color:var(--houjuu); color:var(--houjuu);">🗑 このアプリのデータを全削除する</button>
    </div>
  `;
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// ---------- events ----------
function bindEvents(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; state.overlay=null; render(); });

  if(state.tab==="input"){
    const dateInput = document.getElementById("dateInput");
    if(dateInput) dateInput.onchange = ()=>{
      const val = dateInput.value;
      if(!val) return;
      state.current.date = val;
      const pos = resumePositionForDate(val);
      state.current.hanchanNo = pos.hanchanNo;
      state.current.kyoku = pos.kyoku;
      state.current.honba = pos.honba;
      state.current.toggles = emptyToggles();
      render();
    };
    document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
      const delta = Number(b.dataset.day);
      const d = new Date(state.current.date+"T00:00:00");
      d.setDate(d.getDate()+delta);
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
      const newDate = `${y}-${m}-${day}`;
      state.current.date = newDate;
      const pos = resumePositionForDate(newDate);
      state.current.hanchanNo = pos.hanchanNo;
      state.current.kyoku = pos.kyoku;
      state.current.honba = pos.honba;
      state.current.toggles = emptyToggles();
      render();
    });
    document.querySelectorAll("[data-seat]").forEach(sel=>{
      sel.onchange = ()=>{
        const seatI = Number(sel.dataset.seat);
        const newPlayer = Number(sel.value);
        const order = getSeatOrder(state.current.date, state.current.hanchanNo).slice();
        const oldPlayer = order[seatI];
        const conflictSeat = order.findIndex((p,i)=> i!==seatI && p===newPlayer);
        if(conflictSeat !== -1) order[conflictSeat] = oldPlayer; // 入れ替え先の座席に元の人を移す
        order[seatI] = newPlayer;
        setSeatOrder(state.current.date, state.current.hanchanNo, order);
        render();
      };
    });
    const shuffleBtn = document.getElementById("shuffleSeats");
    if(shuffleBtn) shuffleBtn.onclick = ()=>{
      const order = [0,1,2,3];
      for(let i=order.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [order[i],order[j]] = [order[j],order[i]];
      }
      setSeatOrder(state.current.date, state.current.hanchanNo, order);
      render();
      toast("座席をシャッフルしました");
    };
    document.querySelectorAll("[data-kyoku]").forEach(b=>b.onclick=()=>{
      // 局を手動で切り替えた場合は積み場を0から入力し直す（必要なら「積み場」の±で調整）
      state.current.kyoku = Number(b.dataset.kyoku);
      state.current.honba = 0;
      render();
    });
    document.querySelectorAll("[data-hanchan]").forEach(b=>b.onclick=()=>{
      const newHanchanNo = Math.max(1, state.current.hanchanNo + Number(b.dataset.hanchan));
      const pos = resumePositionForDateHanchan(state.current.date, newHanchanNo);
      state.current.hanchanNo = pos.hanchanNo;
      state.current.kyoku = pos.kyoku;
      state.current.honba = pos.honba;
      state.current.toggles = emptyToggles();
      render();
    });
    document.querySelectorAll("[data-honba]").forEach(b=>b.onclick=()=>{
      state.current.honba = Math.max(0, state.current.honba + Number(b.dataset.honba)); render();
    });
    document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
      toggleStat(Number(b.dataset.p), Number(b.dataset.k));
      render();
    });
    document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
      const mode = b.dataset.mode;
      if(mode === state.inputMode) return;
      state.inputMode = mode;
      state.overlay = null;
      saveSettings();
      render();
    });
    const headerSummaryToggle = document.getElementById("headerSummaryToggle");
    if(headerSummaryToggle) headerSummaryToggle.onclick = ()=>{ state.tableHeaderCollapsed = !state.tableHeaderCollapsed; render(); };
    const tableCenterToggle = document.getElementById("tableCenterToggle");
    if(tableCenterToggle) tableCenterToggle.onclick = ()=>{ state.tableHeaderCollapsed = !state.tableHeaderCollapsed; render(); };
    const resultOnlyBtn = document.getElementById("resultOnlyBtn");
    if(resultOnlyBtn) resultOnlyBtn.onclick = onSaveResultOnly;

    // ツモ／ロン／流局／チョンボ：大型アクションボタン（和了者・放銃者の選択オーバーレイを開く）
    const actTsumo = document.getElementById("actTsumo");
    if(actTsumo) actTsumo.onclick = openTsumoFlow;
    const actRon = document.getElementById("actRon");
    if(actRon) actRon.onclick = openRonFlow;
    const actRyuukyoku = document.getElementById("actRyuukyoku");
    if(actRyuukyoku) actRyuukyoku.onclick = openRyuukyokuFlow;
    const actChombo = document.getElementById("actChombo");
    if(actChombo) actChombo.onclick = openChomboFlow;

    // 選択オーバーレイ（和了者・放銃者・流局・チョンボ）
    const overlayBackdrop = document.getElementById("overlayBackdrop");
    if(overlayBackdrop) overlayBackdrop.onclick = (e)=>{ if(e.target === overlayBackdrop) closeOverlay(); };
    const overlayCancelBtn = document.getElementById("overlayCancelBtn");
    if(overlayCancelBtn) overlayCancelBtn.onclick = closeOverlay;
    document.querySelectorAll("[data-pick-winner]").forEach(b=>b.onclick=()=>pickWinner(Number(b.dataset.pickWinner)));
    document.querySelectorAll("[data-pick-loser]").forEach(b=>b.onclick=()=>pickLoser(Number(b.dataset.pickLoser)));
    document.querySelectorAll("[data-pick-ryuukyoku]").forEach(b=>b.onclick=()=>pickRyuukyokuOutcome(b.dataset.pickRyuukyoku==="oya"));
    document.querySelectorAll("[data-pick-chombo]").forEach(b=>b.onclick=()=>toggleChomboSelect(Number(b.dataset.pickChombo)));
    const confirmChomboBtn = document.getElementById("confirmChomboBtn");
    if(confirmChomboBtn) confirmChomboBtn.onclick = confirmChombo;

    document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>startEdit(b.dataset.edit));
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    if(cancelEditBtn) cancelEditBtn.onclick = cancelEdit;
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      if(state.editingId === b.dataset.del){ state.editingId = null; state.editBackup = null; }
      state.records = state.records.filter(r=>r.id!==b.dataset.del);
      saveRecords(); render(); toast("削除しました");
    });
  }
  if(state.tab==="hanchan"){
    const monthFilter = document.getElementById("hanchanMonthFilter");
    if(monthFilter) monthFilter.onchange = ()=>{ state.hanchanMonthFilter = monthFilter.value; render(); };
    const monthClear = document.getElementById("hanchanMonthClear");
    if(monthClear) monthClear.onclick = ()=>{ state.hanchanMonthFilter = ""; render(); };
    document.querySelectorAll("[data-hanchan-weekday]").forEach(b=>b.onclick=()=>{
      state.hanchanWeekdayFilter = b.dataset.hanchanWeekday; render();
    });
    document.querySelectorAll("[data-toggle-hanchan-collapse]").forEach(el=>el.onclick=()=>{
      const key = el.dataset.toggleHanchanCollapse;
      const wasCollapsed = state.hanchanCollapsed[key] !== false;
      state.hanchanCollapsed[key] = wasCollapsed ? false : true;
      render();
    });
    document.querySelectorAll("[data-score-key]").forEach(inp=>{
      inp.onchange = ()=>{
        const key = inp.dataset.scoreKey, p = Number(inp.dataset.scoreP);
        if(!state.finalScores[key]) state.finalScores[key] = [null,null,null,null];
        const raw = inp.value.trim();
        state.finalScores[key][p] = raw==="" ? null : Math.trunc(Number(raw));
        saveFinalScores(); render();
      };
    });
    document.querySelectorAll("[data-confirm-hanchan]").forEach(b=>b.onclick=()=>{
      const key = b.dataset.confirmHanchan;
      const idx = key.lastIndexOf("_");
      const date = key.slice(0,idx), hanchanNo = Number(key.slice(idx+1));
      const res = tryConfirmHanchan(date, hanchanNo);
      if(!res.ok){ toast(res.reason); return; }
      saveRanks(); saveFinalPoints(); saveHanchanConfirmed();
      render();
      toast("順位を確定しました");
    });
    document.querySelectorAll("[data-edit-hanchan]").forEach(b=>b.onclick=()=>{
      const key = b.dataset.editHanchan;
      state.hanchanConfirmed[key] = false;
      saveHanchanConfirmed();
      render();
    });
    document.querySelectorAll("[data-delete-hanchan]").forEach(b=>b.onclick=()=>{
      const key = b.dataset.deleteHanchan;
      if(!confirm("この半荘の記録（局データ・順位・持ち点）をすべて削除します。よろしいですか？")) return;
      const idx = key.lastIndexOf("_");
      const date = key.slice(0,idx), hanchanNo = Number(key.slice(idx+1));
      state.records = state.records.filter(r=>!(r.date===date && r.hanchanNo===hanchanNo));
      delete state.ranks[key]; delete state.finalScores[key]; delete state.finalPoints[key];
      delete state.hanchanConfirmed[key]; delete state.dealers[key]; delete state.recordPlayers[key];
      saveRecords(); saveRanks(); saveFinalScores(); saveFinalPoints(); saveHanchanConfirmed(); saveDealers(); saveRecordPlayers();
      render();
      toast("半荘を削除しました");
    });
    document.querySelectorAll("[data-hanchan-edit-record]").forEach(b=>b.onclick=()=>{
      state.tab = "input";
      startEdit(b.dataset.hanchanEditRecord);
    });
    document.querySelectorAll("[data-hanchan-del-record]").forEach(b=>b.onclick=()=>{
      const id = b.dataset.hanchanDelRecord;
      if(!confirm("この局の記録を削除します。よろしいですか？")) return;
      if(state.editingId === id){ state.editingId = null; state.editBackup = null; }
      state.records = state.records.filter(r=>r.id!==id);
      saveRecords(); render(); toast("削除しました");
    });
  }
  if(state.tab==="ranking"){
    const rankingFrom = document.getElementById("rankingFrom");
    if(rankingFrom) rankingFrom.onchange = ()=>{ state.rankingRange.from = rankingFrom.value; render(); };
    const rankingTo = document.getElementById("rankingTo");
    if(rankingTo) rankingTo.onchange = ()=>{ state.rankingRange.to = rankingTo.value; render(); };
    document.querySelectorAll("[data-weekday]").forEach(b=>b.onclick=()=>{
      state.rankingRange.weekday = b.dataset.weekday; render();
    });
  }
  if(state.tab==="settings"){
    const exp = document.getElementById("exportBtn");
    if(exp) exp.onclick = exportCsv;
    const importCsvInput = document.getElementById("importCsvInput");
    if(importCsvInput) importCsvInput.onchange = ()=>{
      if(importCsvInput.files && importCsvInput.files[0]) importCsvFile(importCsvInput.files[0]);
      importCsvInput.value = "";
    };
    const importCsvUrlBtn = document.getElementById("importCsvUrlBtn");
    if(importCsvUrlBtn) importCsvUrlBtn.onclick = importCsvFromServer;
    const addRosterBtn = document.getElementById("addRosterBtn");
    const rosterInput = document.getElementById("rosterNameInput");
    if(addRosterBtn) addRosterBtn.onclick = ()=>{
      const val = (rosterInput.value||"").trim();
      if(!val){ toast("名前を入力してください"); return; }
      if(state.playerRoster.includes(val)){ toast("すでにリストにあります"); return; }
      state.playerRoster.push(val);
      saveSettings(); render(); toast("リストに追加しました");
    };
    document.querySelectorAll("[data-roster-del]").forEach(b=>b.onclick=()=>{
      const name = b.dataset.rosterDel;
      state.playerRoster = state.playerRoster.filter(n=>n!==name);
      saveSettings(); render(); toast("リストから削除しました");
    });
    document.querySelectorAll("[data-player-select]").forEach(sel=>{
      sel.onchange = ()=>{
        const i = Number(sel.dataset.playerSelect);
        state.players[i] = sel.value;
        saveSettings(); render(); toast("保存しました");
      };
    });
    const exportBackupBtn = document.getElementById("exportBackupBtn");
    if(exportBackupBtn) exportBackupBtn.onclick = exportBackup;
    const importBackupInput = document.getElementById("importBackupInput");
    if(importBackupInput) importBackupInput.onchange = ()=>{
      if(importBackupInput.files && importBackupInput.files[0]) importBackupFile(importBackupInput.files[0]);
      importBackupInput.value = "";
    };
    const openViewerBtn = document.getElementById("openViewerBtn");
    if(openViewerBtn) openViewerBtn.addEventListener("click", handoffToViewer);
    const importBackupUrlBtn = document.getElementById("importBackupUrlBtn");
    if(importBackupUrlBtn) importBackupUrlBtn.onclick = importBackupFromServer;
    const resetAllDataBtn = document.getElementById("resetAllDataBtn");
    if(resetAllDataBtn) resetAllDataBtn.onclick = resetAllData;
  }
}

// 直近の入力の「✎」から呼ばれる：既存レコードの内容を入力フォームに読み込んで編集状態にする
function startEdit(id){
  const rec = state.records.find(r=>r.id===id);
  if(!rec) return;
  state.editBackup = JSON.parse(JSON.stringify(state.current)); // 編集キャンセル時に戻すための退避
  state.editingId = id;
  state.current.date = rec.date;
  state.current.hanchanNo = rec.hanchanNo;
  state.current.kyoku = KYOKU_LIST.indexOf(rec.kyoku);
  state.current.honba = rec.honba || 0;
  state.current.toggles = rec.stats.map(t=>t.slice());
  render();
}
function cancelEdit(){
  if(state.editBackup) state.current = state.editBackup;
  state.editBackup = null;
  state.editingId = null;
  render();
  toast("編集をキャンセルしました");
}
function commitEdit(resultType){
  const idx = state.records.findIndex(r=>r.id===state.editingId);
  if(idx===-1){ state.editingId = null; state.editBackup = null; render(); return; }
  const cur = state.current;
  ensureRecordPlayersSnapshot(cur.date, cur.hanchanNo);
  state.records[idx] = {
    ...state.records[idx],
    date: cur.date, hanchanNo: cur.hanchanNo, kyoku: KYOKU_LIST[cur.kyoku], honba: cur.honba,
    resultType, stats: cur.toggles.map(t=>t.slice())
  };
  saveRecords();
  state.current = state.editBackup || state.current; // 編集前の入力位置に戻る（進行状態は動かさない）
  state.editBackup = null;
  state.editingId = null;
  render();
  toast("更新しました");
}

// 「結果のみ入力する」：局の詳細（リーチ・副露・ツモ・ロン・放銃など）を記録せず、
// この半荘そのものを「詳細なし」の1件のマーカーレコードとして記録し、即座に半荘集計タブへ遷移して
// 最終持ち点・順位の入力を促す。このレコードは総局数・流局数・打点系スタッツのいずれの集計対象にも含めない（resultType==="resultonly"）。
// 局を実際にプレイしていないため、座席（起家〜北家の割り当て）も意味を持たない。
// 将来的にCSV出力後のデータ加工などで「座席と成績の相関」を扱う可能性があるため、
// 紛らわしい座席データが残らないよう、この半荘の座席設定は明示的にクリアする
// （すでに他の局の記録がある半荘に対して押した場合は、その局の座席データを壊さないよう座席クリアは行わない）。
function onSaveResultOnly(){
  const cur = state.current;
  ensureRecordPlayersSnapshot(cur.date, cur.hanchanNo);
  const hasOtherRecords = state.records.some(r=>r.date===cur.date && r.hanchanNo===cur.hanchanNo);
  const rec = {
    id: uid(), date: cur.date, hanchanNo: cur.hanchanNo, kyoku: "-", honba: cur.honba,
    resultType: "resultonly",
    stats: emptyToggles()
  };
  state.records.push(rec);
  saveRecords();

  if(!hasOtherRecords){
    const key = `${cur.date}_${cur.hanchanNo}`;
    if(state.dealers[key] !== undefined){
      delete state.dealers[key];
      saveDealers();
    }
  }

  const pos = nextPositionFromRecord(rec);
  cur.hanchanNo = pos.hanchanNo;
  cur.kyoku = pos.kyoku;
  cur.honba = pos.honba;
  cur.toggles = emptyToggles();

  state.tab = "hanchan";
  state.hanchanMonthFilter = ""; // 遷移先の半荘が確実に見えるよう、月・曜日フィルタは解除する
  state.hanchanWeekdayFilter = "all";
  state.scrollToHanchanKey = `${rec.date}_${rec.hanchanNo}`;
  render();
  toast("結果のみ入力で記録しました。順位を入力しましょう");
}


// ・「次の局へ」ボタン＝子のアガリが発生していればその局は子のアガリ扱い　　→ 次局へ進行し、積み場は消滅（0にリセット）
// 　　　　　　　　　　誰もアガっていなければ自動的に「流局」（親ノーテン想定）扱い　→ 次局へ進行するが、積み場は+1のまま維持
// ・「連荘」ボタン＝親のアガリ、または親テンパイでの流局　→ 同一局のまま積み場+1（局・半荘Noは進めない）
// ・小さな「チョンボ」ボタン＝反則によるその局のやり直し　→ 同一局・同一積み場のまま
// ※子のアガリが発生している局は連荘を選べず、親のアガリが発生している局は「次の局へ」を選べないよう、ボタン側で制御する。
// ※南4局で「次の局へ」が発生した場合（子のアガリ・流局のいずれも）は、その半荘の最終局のため半荘は終了。
//   次の半荘No.の東1・積み場0からとなり、半荘集計タブで順位を入力できるよう自動的に切り替える。
function onSave(resultType){
  const cur = state.current;
  ensureRecordPlayersSnapshot(cur.date, cur.hanchanNo); // この半荘の対局者名を、記録時点のメンバーで固定する
  const rec = {
    id: uid(), date: cur.date, hanchanNo: cur.hanchanNo, kyoku: KYOKU_LIST[cur.kyoku], honba: cur.honba,
    resultType: resultType,
    stats: cur.toggles.map(t=>t.slice())
  };
  state.records.push(rec);
  saveRecords();

  const hanchanEnded = cur.kyoku === 7 && resultType !== "renchan" && resultType !== "chombo"; // 南4で子のアガリ／親ノーテン流局（チョンボは局のやり直しなので半荘は終了しない）
  const pos = nextPositionFromRecord(rec);
  cur.hanchanNo = pos.hanchanNo;
  cur.kyoku = pos.kyoku;
  cur.honba = pos.honba;
  cur.toggles = emptyToggles();

  if(hanchanEnded){
    state.tab = "hanchan";
    state.hanchanMonthFilter = ""; // 遷移先の半荘が確実に見えるよう、月・曜日フィルタは解除する
    state.hanchanWeekdayFilter = "all";
    state.scrollToHanchanKey = `${rec.date}_${rec.hanchanNo}`;
    render();
    toast("半荘が終了しました。順位を入力しましょう");
  }else{
    render();
    toast(`保存しました（${RESULT_LABEL[resultType]}）`);
  }
}

// 各行にその半荘の対局者名も含める（プレイヤー名リストは今後変わりうるため、行ごとに自己完結させる。
// Excelなど外部ツールでの加工や、後日別セッションのCSVを取り込む際にも、記録当時の名前を正しく復元できる）。
// CSVは「局データ（リーチ・副露などの詳細）」と「半荘の最終素点（順位確定に使う値）」を1行＝1局の
// ワイド形式1種類に統一して書き出す。各プレイヤーの列は 名前/リーチ/副露/ツモ/ロン/放銃/チョンボ/素点 の8列で、
// 素点はその半荘が「確定済み」の場合のみ、同じ半荘の全行に同じ値を繰り返し記載する（未確定なら空欄）。
// 局の詳細を持たない「結果のみ入力」の半荘も、局="-"・トグル全OFFの1行として同じ形式でそのまま書き出される。
function exportCsv(){
  const header = ["日付","半荘No","局","本場","結果", ...[0,1,2,3].flatMap(i=>[`P${i+1}_名前`,`P${i+1}_リーチ`,`P${i+1}_副露`,`P${i+1}_ツモ`,`P${i+1}_ロン`,`P${i+1}_放銃`,`P${i+1}_チョンボ`,`P${i+1}_素点`])];
  const lines = [header.join(",")];
  state.records.forEach(r=>{
    const names = namesForHanchan(r.date, r.hanchanNo);
    const key = `${r.date}_${r.hanchanNo}`;
    const confirmed = !!state.hanchanConfirmed[key];
    const scores = confirmed ? (state.finalScores[key] || [null,null,null,null]) : [null,null,null,null];
    const perPlayer = [0,1,2,3].flatMap(i=>[
      names[i]||`P${i+1}`, ...r.stats[i],
      (scores[i]===null||scores[i]===undefined) ? "" : scores[i]
    ]);
    const row = [fmtDate(r.date), r.hanchanNo, r.kyoku, r.honba||0, RESULT_LABEL[r.resultType]||"", ...perPlayer];
    lines.push(row.join(","));
  });
  if(lines.length<2){ toast("書き出せるデータがありません"); return; }
  const blob = new Blob(["\uFEFF"+lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "hanchan.csv"; a.click();
  URL.revokeObjectURL(url);
}

// 「局データをCSVで書き出す」で出力した形式（日付,半荘No,局,本場,結果, 選手ごとに 名前/リーチ/副露/ツモ/ロン/放銃/チョンボ ×4人）のCSVを読み込み、
// 既存の局データに追加する（上書きではなく追記。日付は "YYYY/MM/DD" 表記を "YYYY-MM-DD" に変換して取り込む）。
// あわせて、CSV内の名前列からその半荘の名前スナップショット(recordPlayers)も復元する（既存のスナップショットがある場合は上書きしない）。
function reverseResultLabel(label){
  const entry = Object.entries(RESULT_LABEL).find(([k,v])=>v===label);
  return entry ? entry[0] : "next";
}
function parseCsvDate(s){
  const parts = (s||"").trim().split("/");
  if(parts.length!==3) return null;
  const [y,m,d] = parts;
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
// CSVの読み込みは1種類の入力窓口（importCsvFile）に統一する。ヘッダーに「半荘ID」列があれば、
// 局の詳細を持たない過去大会の結果データ（旧集計表の元データ形式も含む）とみなしてロング形式で読み込み、
// それ以外はこのアプリの標準書き出し形式（1行＝1局のワイド形式、末尾に各プレイヤーの素点列を含む）として読み込む。
function importCsvFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{ processCsvText(String(reader.result||"")); };
  reader.readAsText(file, "utf-8");
}
// CSVテキストそのものを受け取って取り込む共通処理（ファイル選択・サーバー読み込みの両方から呼ばれる）。
function processCsvText(rawText){
  const text = String(rawText||"").replace(/^\uFEFF/, "");
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
  if(lines.length < 2){ toast("読み込めるデータがありません"); return; }
  const header = lines[0].split(",").map(h=>h.trim());
  if(header.includes("半荘ID")){
    importLegacyHanchanResultsCsv(lines, header);
  }else{
    importWideKyokuCsv(lines);
  }
}
// サイト上（同じNetlifyサイトのルート）に置かれているhanchan.csvをfetchで取得して取り込む。
// input-app.htmlとhanchan.csvが同じオリジンに配置されている前提（index.htmlからの相対パスと同じ）。
async function importCsvFromServer(){
  if(!checkSitePassword()) return;
  try{
    const res = await fetch("./hanchan.csv", { cache: "no-store" });
    if(!res.ok){ toast(`サーバーのCSVを取得できませんでした（${res.status}）`); return; }
    const text = await res.text();
    processCsvText(text);
  }catch(e){
    toast("サーバーのCSVを取得できませんでした（通信エラー）");
  }
}

// 局データの「重複」判定キー。日付・半荘No・局・本場・結果種別・各プレイヤーのスタッツが
// すべて一致する場合のみ同一の局とみなす（チョンボ後のやり直しなど、同じ局・本場でも
// 結果種別やスタッツが異なる正当なレコードは別物として扱う）。
function kyokuRecordSignature(r){
  return [r.date, r.hanchanNo, r.kyoku, r.honba, r.resultType, JSON.stringify(r.stats)].join("|");
}

// 標準形式（日付,半荘No,局,本場,結果, [名前,リーチ,副露,ツモ,ロン,放銃,チョンボ,素点]×4人）を読み込む。
// 素点列が無い古い書き出し（名前あり／名前なし）も引き続き読み込める。
// 既存データと内容が完全一致する局（同じ日付・半荘No・局・本場・結果・スタッツ）は重複として取り込まない。
function importWideKyokuCsv(lines){
  const colsPerPlayerScore = 8; // 名前 + 6スタッツ + 素点（現行形式）
  const colsPerPlayerNew = 7;   // 名前 + 6スタッツ（素点列を追加する前の形式）
  const colsPerPlayerOld = 6;   // 6スタッツのみ（最旧形式・名前列なし）
  const requiredColsScore = 5 + 4*colsPerPlayerScore;
  const requiredColsNew = 5 + 4*colsPerPlayerNew;
  const requiredColsOld = 5 + 4*colsPerPlayerOld;
  const newRecords = [];
  const snapshotsToApply = {}; // key -> [name0..3]（既存スナップショットが無い半荘にのみ後で適用）
  const scoresByHanchan = {};  // key -> [素点0..3]（4人分そろった半荘のみ、後でまとめて確定判定する）
  const seenSignatures = new Set(state.records.map(kyokuRecordSignature)); // 既存レコード＋今回取り込み済み分
  let skippedDuplicate = 0;
  for(let li=1; li<lines.length; li++){
    const cols = lines[li].split(",");
    const hasScore = cols.length >= requiredColsScore;
    const hasNames = hasScore || cols.length >= requiredColsNew;
    if(!hasNames && cols.length < requiredColsOld) continue;
    const colsPerPlayer = hasScore ? colsPerPlayerScore : (hasNames ? colsPerPlayerNew : colsPerPlayerOld);
    const date = parseCsvDate(cols[0]);
    if(!date) continue;
    const hanchanNo = Number(cols[1]) || 1;
    const kyoku = cols[2];
    const honba = Number(cols[3]) || 0;
    const resultType = reverseResultLabel(cols[4]);
    const names = [];
    const scores = [];
    const stats = [0,1,2,3].map(pi=>{
      const base = 5 + pi*colsPerPlayer;
      if(hasNames){
        names.push(cols[base] || `P${pi+1}`);
        if(hasScore){
          const sc = cols[base+7];
          scores.push(sc==="" || sc===undefined ? null : Number(sc));
        }
        return [0,1,2,3,4,5].map(k => Number(cols[base+1+k]) || 0);
      }
      return [0,1,2,3,4,5].map(k => Number(cols[base+k]) || 0);
    });
    const rec = { id: uid(), date, hanchanNo, kyoku, honba, resultType, stats };
    const sig = kyokuRecordSignature(rec);
    if(seenSignatures.has(sig)){ skippedDuplicate++; continue; }
    seenSignatures.add(sig);
    newRecords.push(rec);
    if(hasNames){
      const key = `${date}_${hanchanNo}`;
      if(!snapshotsToApply[key]) snapshotsToApply[key] = names;
      if(hasScore && !scoresByHanchan[key] && scores.every(s=>s!==null && !isNaN(s))){
        scoresByHanchan[key] = scores;
      }
    }
  }
  if(!newRecords.length){
    toast(skippedDuplicate
      ? `追加できる局データがありませんでした（すべて既存データと重複：${skippedDuplicate}件）`
      : "有効な局データが見つかりませんでした（書き出し形式と一致するか確認してください）");
    return;
  }
  if(!confirm(`${newRecords.length}件の局データを、既存のデータに追加します${skippedDuplicate?`（重複スキップ:${skippedDuplicate}件）`:""}。よろしいですか？`)) return;
  state.records = state.records.concat(newRecords);
  Object.entries(snapshotsToApply).forEach(([key,names])=>{
    if(!state.recordPlayers[key]) state.recordPlayers[key] = names;
  });
  // 素点が4人分そろっている半荘のみ、まだ未確定であればこのアプリの計算式で順位・得点ptを確定する
  let confirmedCount = 0;
  Object.entries(scoresByHanchan).forEach(([key,scores])=>{
    if(state.hanchanConfirmed[key]) return;
    if(scoreSumDiff(scores) !== null) return;
    const idx = key.lastIndexOf("_");
    const date = key.slice(0,idx), hanchanNo = Number(key.slice(idx+1));
    state.finalScores[key] = scores;
    const result = tryConfirmHanchan(date, hanchanNo);
    if(result.ok) confirmedCount++;
  });
  saveRecords();
  saveRecordPlayers();
  saveFinalScores(); saveRanks(); saveFinalPoints(); saveHanchanConfirmed();
  render();
  const notes = [];
  if(confirmedCount) notes.push(`うち${confirmedCount}半荘の順位を確定`);
  if(skippedDuplicate) notes.push(`重複${skippedDuplicate}件をスキップ`);
  toast(`${newRecords.length}件を追加しました${notes.length?`（${notes.join("、")}）`:""}`);
}

// ================= 半荘結果（順位・スコア）のみのロング形式CSV読み込み =================
// 局の詳細（リーチ・副露など）を持たない「結果のみ」の半荘データを、ロング形式（1行=1半荘×1プレイヤー）で
// 読み込む。過去大会の集計表（元データシート：半荘ID,年,月日,曜日,回,プレイヤー,素点,スコア,順位）
// をそのまま読み込めるよう、半荘ID列（YYYYMMDD-NN形式）から日付と半荘Noを復元する。
// スコア(pt)・順位は取り込み時にこのアプリのMリーグ公式ルール計算式で必ず再計算する（ファイル内の値は使わない）
// ことで、ウマ・オカの計算方法をアプリ内の記録と完全に統一する。

// 半荘ID（例："20240911-01"）から日付("2024-09-11")と半荘No(1)を復元する。形式が合わなければnull。
function reverseHanchanIdToDateNo(id){
  const m = /^(\d{4})(\d{2})(\d{2})-(\d+)$/.exec((id||"").trim());
  if(!m) return null;
  return { date: `${m[1]}-${m[2]}-${m[3]}`, hanchanNo: Number(m[4]) };
}
// "YYYY/MM/DD" "YYYY-MM-DD" のどちらでも受け付ける日付パーサ（半荘IDが無い場合のフォールバック用）
function parseFlexibleDate(s){
  const m = /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/.exec((s||"").trim());
  if(!m) return null;
  return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
}

// 半荘ID・日付・プレイヤー・素点などの列を持つロング形式（過去大会データ／旧集計表）を読み込む。
// 局の詳細を持たないため「結果のみ入力」の半荘として取り込み、統計の打点系スタッツ（リーチ率など）には含めない。
function importLegacyHanchanResultsCsv(lines, header){
  const idxOf = (...names)=>{ for(const n of names){ const i = header.indexOf(n); if(i!==-1) return i; } return -1; };
  const colId = idxOf("半荘ID");
  const colDate = idxOf("日付");
  const colNo = idxOf("半荘No","回");
  const colName = idxOf("プレイヤー","プレイヤー名","名前");
  const colScore = idxOf("素点");
  if(colName===-1 || colScore===-1){ toast("CSVの形式が正しくありません（プレイヤー・素点の列が必要です）"); return; }

  const existingKeys = new Set(hanchanGroups().map(g=>`${g.date}_${g.hanchanNo}`));
  const groupsMap = new Map(); // key -> {date, hanchanNo, rows:[{name,score}]}
  for(let li=1; li<lines.length; li++){
    const cols = lines[li].split(",");
    let date=null, hanchanNo=null;
    if(colId!==-1){
      const parsed = reverseHanchanIdToDateNo(cols[colId]);
      if(parsed){ date=parsed.date; hanchanNo=parsed.hanchanNo; }
    }
    if(!date && colDate!==-1){
      date = parseFlexibleDate(cols[colDate]);
      hanchanNo = colNo!==-1 ? (Number(cols[colNo])||1) : 1;
    }
    if(!date || !hanchanNo) continue;
    const name = (cols[colName]||"").trim();
    const score = Number(cols[colScore]);
    if(!name || cols[colScore]==="" || isNaN(score)) continue;
    const key = `${date}_${hanchanNo}`;
    if(!groupsMap.has(key)) groupsMap.set(key, {date, hanchanNo, rows:[]});
    groupsMap.get(key).rows.push({name, score});
  }

  let skippedExisting=0, skippedInvalid=0;
  const validGroups = [];
  groupsMap.forEach((g,key)=>{
    if(existingKeys.has(key)){ skippedExisting++; return; }
    if(g.rows.length !== 4){ skippedInvalid++; return; }
    const scores = g.rows.map(r=>r.score);
    if(scoreSumDiff(scores) !== null){ skippedInvalid++; return; }
    validGroups.push(g);
  });

  if(!validGroups.length){
    toast(`取り込める半荘がありませんでした（既存と重複:${skippedExisting}件／形式不正:${skippedInvalid}件）`);
    return;
  }
  if(!confirm(`${validGroups.length}件の半荘結果を新規に取り込みます（重複スキップ:${skippedExisting}件、形式不正スキップ:${skippedInvalid}件）。\nこれらは「結果のみ入力」の半荘として、統計の打点系スタッツ（リーチ率など）には含めず、順位・スコア系の集計にのみ反映されます。よろしいですか？`)) return;

  validGroups.forEach(g=>{
    const key = `${g.date}_${g.hanchanNo}`;
    const names = g.rows.map(r=>r.name);
    const scores = g.rows.map(r=>r.score);
    state.recordPlayers[key] = names;
    state.finalScores[key] = scores;
    state.records.push({ id: uid(), date:g.date, hanchanNo:g.hanchanNo, kyoku:"-", honba:0, resultType:"resultonly", stats: emptyToggles() });
    tryConfirmHanchan(g.date, g.hanchanNo); // 合計は上で検証済みのため必ず成功する
  });

  saveRecords(); saveRecordPlayers(); saveFinalScores(); saveRanks(); saveFinalPoints(); saveHanchanConfirmed();
  render();
  toast(`${validGroups.length}件の半荘結果を取り込みました`);
}

loadAll();
</script>
</body>
