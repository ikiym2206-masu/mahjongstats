// GitHub上の最新backup.jsonを取得してローカルへマージする。
// opts.silent: trueならエラーをトースト表示しない（バックグラウンド復帰時など、頻繁に走る場面で使う）
// opts.initial: trueなら取り込み後に入力再開位置も再計算する（起動直後のみ）
async function pullLatestFromGithub(opts){
  opts = opts || {};
  if(!githubConfigured()) return;
  const { owner, repo, path, token } = state.github;
  const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  const headers = { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" };
  let res;
  try{
    res = await fetch(apiUrl, { headers, cache: "no-store" });
  }catch(e){
    if(!opts.silent) toast("GitHubから最新データを取得できませんでした（通信エラー）");
    return;
  }
  if(res.status === 404) return; // まだファイルが存在しない（初回保存前）
  if(res.status === 401 || res.status === 403){
    state.github.lastError = "トークンが無効か、権限が不足しています";
    if(!opts.silent) toast(`⚠️ ${state.github.lastError}`);
    updateGithubStatusUi();
    return;
  }
  if(res.status !== 200){
    if(!opts.silent) toast(`GitHubから最新データを取得できませんでした（${res.status}）`);
    return;
  }
  let remote;
  try{
    const info = await res.json();
    remote = JSON.parse(base64ToUtf8(info.content));
  }catch(e){
    if(!opts.silent) toast("GitHub上のデータ形式を読み取れませんでした");
    return;
  }
  if(!remote || !Array.isArray(remote.records)) return { remoteHasNew:false, localOnlyAdded:false };
  const { localOnlyAdded, remoteHasNew, rankingChanged } = mergeRemoteIntoState(remote);
  if(opts.initial) recomputeCurrentPosition();
  if(remoteHasNew || localOnlyAdded || rankingChanged) render();
  if(remoteHasNew) toast("GitHubの最新データを取り込みました");
  else if(rankingChanged) toast("GitHubのランキング条件を取り込みました");
  // ローカルにしかない分がある場合も自動送信はしない（手動同期）。必要なら「⬆️ 今すぐGitHubへ送信」を押してもらう。
  return { remoteHasNew, localOnlyAdded, rankingChanged };
}

// GitHub Contents APIで対象ファイルを取得（sha取得）→内容を書き換えてPUT（コミット）する。
// 他の人がほぼ同時に保存してsha不一致（409）になった場合は、最新shaを取り直して1回だけ自動リトライする。
async function uploadBackupToGithub(retryCount){
  retryCount = retryCount || 0;
  const { owner, repo, path, token } = state.github;
  const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  const headers = { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" };

  let sha = null;
  const getRes = await fetch(apiUrl, { headers, cache: "no-store" });
  if(getRes.status === 200){
    const info = await getRes.json();
    sha = info.sha;
    // pushする前に、GitHub側の最新内容をこの時点でローカルへマージしておく。
    // 他の端末が自分より先に保存していた場合、その内容を消さずに含めてから書き戻すため。
    try{
      const remote = JSON.parse(base64ToUtf8(info.content));
      if(remote && Array.isArray(remote.records)){
        const { remoteHasNew, rankingChanged } = mergeRemoteIntoState(remote);
        if(remoteHasNew || rankingChanged) render();
      }
    }catch(e){ /* 解析できなければローカルの内容だけで続行する */ }
  }else if(getRes.status === 401 || getRes.status === 403){
    throw new Error("トークンが無効か、権限が不足しています");
  }else if(getRes.status !== 404){
    throw new Error(`ファイル情報の取得に失敗（${getRes.status}）`);
  }

  const content = utf8ToBase64(JSON.stringify(buildBackupPayload(), null, 2));
  const body = { message: `update backup.json (input-app / ${new Date().toISOString()})`, content };
  if(sha) body.sha = sha;

  const putRes = await fetch(apiUrl, {
    method: "PUT",
    headers: { ...headers, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if(putRes.status === 200 || putRes.status === 201){
    state.seatFixPending = []; // 送信済みになったので、席・起家修正のローカル優先は解除する
    saveSeatFixPending();
    clearMembersPending(); // 既定メンバー・プレイヤーリストのローカル優先も解除する
    clearRankingPending(); // ランキング条件のローカル優先も解除する
    return;
  }
  if(putRes.status === 409 && retryCount < 2){ await uploadBackupToGithub(retryCount + 1); return; }
  if(putRes.status === 401 || putRes.status === 403) throw new Error("トークンが無効か、権限が不足しています");
  throw new Error(`保存に失敗しました（${putRes.status}）`);
}

// 設定タブの「最終同期」表示だけを、再描画（render）なしで更新する。
// render()を呼ぶとトークン入力中などにフォーカスが失われてしまうため、DOM直接更新にしている。
function githubStatusLabel(){
  if(!githubConfigured()) return "未設定です（トークン・owner・repoを入力して保存してください）";
  if(state.github.syncing) return "GitHubへ同期中…";
  if(state.github.lastError) return `前回の同期に失敗しました：${state.github.lastError}`;
  if(state.github.lastSyncAt) return `最終同期：${formatDateTimeJa(state.github.lastSyncAt)}`;
  return "まだ同期していません";
}
function formatDateTimeJa(isoStr){
  const d = new Date(isoStr);
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function updateGithubStatusUi(){
  const el = document.getElementById("githubStatusText");
  if(el) el.textContent = githubStatusLabel();
}

// Viewer遷移時に、この端末の記録データをlocalStorage経由で1回だけ引き継ぐための書き込み。
// （同一オリジンのためlocalStorageを共有できる。Viewer側は読み込み後すぐにこのキーを削除する）
const VIEWER_HANDOFF_KEY = "mj-viewer-handoff";
function handoffToViewer(){
  try{
    localStorage.setItem(VIEWER_HANDOFF_KEY, JSON.stringify(buildBackupPayload()));
  }catch(e){ /* 書き込み失敗時はViewer側で手動読み込みにフォールバックされる */ }
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{ processBackupText(reader.result); };
  reader.readAsText(file, "utf-8");
}
// バックアップJSONのテキストをパースして検証する（形式不正ならnull）。
function parseBackupJson(rawText){
  let data;
  try{ data = JSON.parse(rawText); }catch(e){ return null; }
  if(!data || !Array.isArray(data.records)) return null;
  return data;
}
// ランキングの期間・曜日条件を反映する（settings／backup.json に保存されている場合のみ。無ければ現在値のまま）。
function applyRankingRange(rr){
  if(!rr || typeof rr !== "object") return;
  state.rankingRange = {
    from: typeof rr.from === "string" ? rr.from : "",
    to: typeof rr.to === "string" ? rr.to : "",
    weekday: ["all","weekday","weekend"].includes(rr.weekday) ? rr.weekday : "all",
  };
}
// 検証済みのバックアップデータを現在の状態に適用して保存する（確認ダイアログは呼び出し側の責任）。
function applyBackupData(data){
  hideUndo();
  state.players = (data.players && data.players.length===4) ? data.players : state.players;
  state.playerRoster = data.playerRoster || data.usedNames || state.playerRoster;
  state.records = data.records || [];
  state.ranks = data.ranks || {};
  state.dealers = data.dealers || {};
  state.hanchanConfirmed = data.hanchanConfirmed || {};
  state.finalScores = data.finalScores || {};
  state.finalPoints = data.finalPoints || {};
  state.hanchanEndAt = data.hanchanEndAt || {};
  state.recordPlayers = data.recordPlayers || {};
  applyRankingRange(data.rankingRange);
  saveSettings(); saveRecords(); saveRanks(); saveDealers(); saveHanchanConfirmed();
  saveFinalScores(); saveFinalPoints(); saveRecordPlayers(); saveHanchanEndAt();
  clearMembersPending(); // バックアップの内容で置き換えたので、未送信の変更扱いは解除する
  clearRankingPending();
}
// バックアップJSONのテキストそのものを受け取って復元する共通処理（ファイル選択・サーバー読み込みの両方から呼ばれる）。
// 既存データがある状態からの上書きなので、実行前に確認ダイアログを出す。
function processBackupText(rawText){
  const data = parseBackupJson(rawText);
  if(!data){ toast("ファイルを読み込めませんでした、またはバックアップ形式が正しくありません"); return; }
  if(!confirm("現在の端末のデータを、このバックアップの内容で上書きします。よろしいですか？")) return;
  applyBackupData(data);
  render();
  toast("バックアップを復元しました");
}
// このアプリと同じサイトのルートに置かれているbackup.jsonをfetchで取得して復元する。
async function importBackupFromServer(){
  try{
    const res = await fetch("./backup.json", { cache: "no-store" });
    if(!res.ok){ toast(`サーバーのバックアップを取得できませんでした（${res.status}）`); return; }
    const text = await res.text();
    processBackupText(text);
  }catch(e){
    toast("サーバーのバックアップを取得できませんでした（通信エラー）");
  }
}
// 起動時の選択モーダルから呼ばれる読み込み処理。モーダルの「読み込む」ボタン自体が明示的な選択・確認であるため、
// processBackupTextと違い追加の上書き確認ダイアログは出さずそのまま適用する。
// ウェルカム（起動時のbackup.json読み込み選択）を閉じたら、続けて半荘開始準備オーバーレイの判定を行う。
async function loadWelcomeBackup(){
  state.showWelcomeBackupPrompt = false;
  try{
    const res = await fetch("./backup.json", { cache: "no-store" });
    if(!res.ok){ toast(`サーバーのバックアップを取得できませんでした（${res.status}）`); maybeOpenHanchanSetup(); render(); return; }
    const text = await res.text();
    const data = parseBackupJson(text);
    if(!data){ toast("サーバーのバックアップ形式が正しくありません"); maybeOpenHanchanSetup(); render(); return; }
    applyBackupData(data);
    maybeOpenHanchanSetup();
    render();
    toast("サイト上のバックアップを読み込みました");
  }catch(e){
    toast("サーバーのバックアップを取得できませんでした（通信エラー）");
    maybeOpenHanchanSetup();
    render();
  }
}
// 「ようこそ」：端末の記録を使わずに始める。対局の記録だけを消す（名簿・既定メンバー・設定・サーバー連携の設定は残す）
function startFreshWelcome(){
  if(state.records.length && !confirm("この端末の対局記録（局・順位・持ち点）を消して、記録ゼロから始めます。元に戻せません。\n（残したい場合は先に設定タブの「バックアップ管理」で保存してください）\n\nよろしいですか？")) return;
  hideUndo();
  state.records = []; state.ranks = {}; state.dealers = {}; state.hanchanConfirmed = {};
  state.finalScores = {}; state.finalPoints = {}; state.hanchanEndAt = {}; state.recordPlayers = {};
  state.seatFixPending = []; saveSeatFixPending();
  saveRecords(); saveRanks(); saveDealers(); saveHanchanConfirmed(); saveFinalScores(); saveFinalPoints(); saveHanchanEndAt(); saveRecordPlayers();
  recomputeCurrentPosition();
  state.current.toggles = emptyToggles();
  state.showWelcomeBackupPrompt = false;
  maybeOpenHanchanSetup();
  render();
  toast("記録ゼロから始めます");
}
function skipWelcomeBackup(){
  state.showWelcomeBackupPrompt = false;
  maybeOpenHanchanSetup();
  render();
}

// この端末（ブラウザ）に保存されている、このアプリのデータ（mj-stats:接頭辞のキー）をすべて削除する。
function resetAllData(){
  if(!confirm("この端末に保存されている記録・設定をすべて削除します。元に戻せません。\n（先に「バックアップ管理」の「バックアップをダウンロード」で保存することをおすすめします）\n\n本当に削除しますか？")) return;
  Object.keys(localStorage)
    .filter(k => k.startsWith(LOCAL_KEY_PREFIX))

// 座席（東家→南家→西家→北家の順で、どの位置（0自家/1下家/2対面/3上家）が該当するか）は半荘単位(date_hanchanNo)で保持する。
// 東家が決まれば残りは手番順（自家→下家→対面→上家）で機械的に決まる。
// （旧バージョンでは起家indexの数値のみを保持していたため、その場合は単純ローテーションへフォールバックする）
function getSeatOrder(date, hanchanNo){
  const v = state.dealers[`${date}_${hanchanNo}`];
  if(Array.isArray(v) && v.length===4) return v;
  const start = (typeof v === "number") ? v : 0;
  return [0,1,2,3].map(i=>(start+i)%4);
}
function setSeatOrder(date, hanchanNo, order){
  state.dealers[`${date}_${hanchanNo}`] = order;
  saveDealers();
}
// 起家（東家）の位置から、手番順に沿った座席順 [東家,南家,西家,北家] を作る
function seatOrderFromStarter(starter){ return [0,1,2,3].map(i=>(starter+i)%4); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// Mリーグ公式戦ルール（集計特化版）に基づく次局の位置（半荘No・局・本場）を求める。
// ・チョンボ　　　　　　　　　　　　　　→ その局はやり直し。同一局・同一積み場のまま（積み場は増えない）
// ・親のアガリ／親テンパイでの流局　　　→ 同一局が連荘、積み場+1（南4ならそのまま南4-n本場が続く＝延長）
// ・南4で子のアガリ、または親ノーテン流局 → 南4局は半荘の最終局のため、半荘終了。次の半荘No.の東1(積み場0)へ
// ・南4以外で子のアガリ　　　　　　　　　→ 次局へ進行、積み場は消滅（0にリセット）
// ・南4以外で親ノーテンでの流局　　　　　→ 次局へ進行するが、積み場は+1のまま維持
function nextPositionFromRecord(rec){
  const idx = KYOKU_LIST.indexOf(rec.kyoku);
  const honba = rec.honba || 0;
  if(rec.resultType === "resultonly"){
    // 局の詳細を入力せず最終結果のみを記録した半荘は、そのまま次の半荘（東1・積み場0）へ進む
    return {hanchanNo: rec.hanchanNo + 1, kyoku: 0, honba: 0};
  }
  if(rec.resultType === "chombo"){
    return {hanchanNo: rec.hanchanNo, kyoku: idx, honba: honba};
  }
  if(rec.resultType === "renchan"){
    return {hanchanNo: rec.hanchanNo, kyoku: idx, honba: honba + 1};
  }
  if(idx === 7){
    return {hanchanNo: rec.hanchanNo + 1, kyoku: 0, honba: 0};
  }
  if(rec.resultType === "ryuukyoku"){
    return {hanchanNo: rec.hanchanNo, kyoku: idx + 1, honba: honba + 1};
  }
  return {hanchanNo: rec.hanchanNo, kyoku: idx + 1, honba: 0};
}

// find where to resume input for a given date (after the last record on that date, across any hanchanNo)
function resumePositionForDate(date){
  const recs = state.records.filter(r=>r.date===date);
  if(!recs.length) return {hanchanNo:1, kyoku:0, honba:0};
  const last = recs[recs.length-1];
  return nextPositionFromRecord(last);
}

// find where to resume input for a specific date+半荘No.（「日付＋半荘No.」でユニークな組として扱う）
function resumePositionForDateHanchan(date, hanchanNo){
  const recs = state.records.filter(r=>r.date===date && r.hanchanNo===hanchanNo);
  if(!recs.length) return {hanchanNo, kyoku:0, honba:0};
  const last = recs[recs.length-1];
  const pos = nextPositionFromRecord(last);
  if(pos.hanchanNo === hanchanNo) return pos;
  // 最終局(南4)まで入力済みでこの半荘はすでに終了している → 南4の状態をそのまま表示（参照用）
  return {hanchanNo, kyoku: 7, honba: last.honba || 0};
}

// 指定した半荘（date_hanchanNo）にすでに1局でも記録があるかどうか
function hanchanHasRecords(date, hanchanNo){
  return state.records.some(r=>r.date===date && r.hanchanNo===hanchanNo);
}

function hanchanGroups(){
  const map = new Map();
  state.records.forEach(r=>{
    const key = `${r.date}_${r.hanchanNo}`;
    if(!map.has(key)) map.set(key, {date:r.date, hanchanNo:r.hanchanNo});
  });
  Object.keys(state.ranks).forEach(k=>{
    if(!map.has(k) && state.ranks[k]){
      const idx = k.lastIndexOf("_");
      const date = k.slice(0,idx), hanchanNo = Number(k.slice(idx+1));
      if(date) map.set(k, {date, hanchanNo});
    }
  });
  return Array.from(map.values()).sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.hanchanNo - b.hanchanNo;
  });
}

function computeHanchanTotals(date, hanchanNo){
  const totals = [0,1,2,3].map(()=>({riichi:0, fuuro:0, tsumo:0, ron:0, houjuu:0, chombo:0}));
  state.records.filter(r=>r.date===date && r.hanchanNo===hanchanNo).forEach(r=>{
    r.stats.forEach((s,i)=>{
      totals[i].riichi += s[K_RIICHI]; totals[i].fuuro += s[K_FUURO]||0; totals[i].tsumo += s[K_TSUMO];
      totals[i].ron += s[K_RON]; totals[i].houjuu += s[K_HOUJUU]; totals[i].chombo += s[K_CHOMBO]||0;
    });
  });
  return totals;
}

// 総局数（その半荘で記録された局の数）と流局数（誰もアガらなかった＝ツモ・ロンが誰にも付いていない局の数）を数える。
// 「連荘」は親の和了と親テンパイ流局の両方で使われるため、resultTypeではなく実際のツモ/ロンの有無で流局を判定する。
// チョンボは「その局のやり直し」であり完了した1局ではないため、総局数・流局数のどちらにも含めない。
// 「結果のみ入力」は局の詳細を伴わない記録のため、こちらも総局数・流局数のどちらにも含めない。
function computeHanchanKyokuStats(date, hanchanNo){
  const recs = state.records.filter(r=>r.date===date && r.hanchanNo===hanchanNo && r.resultType!=="chombo" && r.resultType!=="resultonly");
  const total = recs.length;
  const ryuukyoku = recs.filter(r=>!r.stats.some(s=>s[K_TSUMO]===1 || s[K_RON]===1)).length;
  return {total, ryuukyoku};
}

// 4人分の最終持ち点（素点）から順位を算出する（持ち点が高い順に1〜4位）。
// 4人全員分が入力されていない場合は null を返す。
// 同点の場合は同着（同じ順位番号）とする（例：2位が2人いる場合は 1,2,2,4）。
function computeRanksFromScores(scores){
  if(!scores || scores.length!==4 || scores.some(s=>s===null || s===undefined || s==="" || isNaN(s))) return null;
  return scores.map((s,i)=> 1 + scores.filter(s2=>s2>s).length);
}

// 4人分の最終持ち点（素点）の合計が配給原点の合計(100,000点)と一致しているか確認する。
// 一致していれば null、していなければ差分（100,000-合計）を返す。
function scoreSumDiff(scores){
  if(!scores || scores.length!==4 || scores.some(s=>s===null || s===undefined || s==="" || isNaN(s))) return null;
  const sum = scores.reduce((a,b)=>a+Number(b),0);
  return sum === 100000 ? null : (100000 - sum);
}

// 配給原点25,000点・精算基準点(オカ)30,000点・ウマ(+50,000/+10,000/▲10,000/▲30,000)を用いて、
// 4人分の素点から最終スコア(pt)を自動算出する（Mリーグ公式戦ルール・集計特化版 第2項準拠）。
// 同着（同点）の場合は該当するウマを均等に分配し、割り切れない端数は起家（東家）に近い座席の対局者から優先的に多く取得する。
const UMA_TABLE = [50000, 10000, -10000, -30000];
function computeFinalPoints(scores, seatOrder){
  if(!scores || scores.some(s=>s===null || s===undefined || s==="" || isNaN(s))) return null;
  const idxs = [0,1,2,3];
  const sorted = idxs.slice().sort((a,b)=> scores[b]-scores[a]);
  const umaYen = [0,0,0,0];
  let pos = 0;
  while(pos < 4){
    let end = pos;
    while(end+1 < 4 && scores[sorted[end+1]] === scores[sorted[pos]]) end++;
    const group = sorted.slice(pos, end+1);
    const size = group.length;
    const sum = UMA_TABLE.slice(pos, end+1).reduce((a,b)=>a+b, 0);
    const base = Math.floor(sum / size);
    const remainder = sum - base * size; // 0 <= remainder < size
    // 起家（座席0＝東家）に近い順に端数を多く配分する
    const bySeatProximity = group.slice().sort((a,b)=>{
      const da = seatOrder.indexOf(a), db = seatOrder.indexOf(b);
      return da - db;
    });
    bySeatProximity.forEach((playerIdx, k)=>{ umaYen[playerIdx] = base + (k < remainder ? 1 : 0); });
    pos = end + 1;
  }
  return scores.map((s,i)=> ((s - 30000) + umaYen[i]) / 1000);
}
function fmtPt(n){
  if(n===null || n===undefined || isNaN(n)) return "-";
  const v = Math.round(n*10)/10;
  return (v>0?"+":"") + v.toFixed(1);
}

// 4人分の最終持ち点(素点)から、順位・得点pt・確定フラグをまとめて確定させる。
// 半荘集計タブの「順位を確定する」ボタンと、CSVインポート（過去大会データの一括取り込み）の両方から共通で使う。
// 呼び出し前に state.finalScores[key] を設定しておくこと。ok:false の場合は状態を一切変更しない。
function tryConfirmHanchan(date, hanchanNo){
  const key = `${date}_${hanchanNo}`;
  const scores = state.finalScores[key] || [null,null,null,null];
  const computedRanks = computeRanksFromScores(scores);
  if(!computedRanks) return {ok:false, reason:"4人全員の最終持ち点を入力してください"};
  const diff = scoreSumDiff(scores);
  if(diff !== null){
    const sum = scores.reduce((a,b)=>a+Number(b),0);
    return {ok:false, reason:`合計が100,000点になっていません（現在の合計:${sum}点／差分:${diff>0?'+':''}${diff}点）`};
  }
  const seatOrder = getSeatOrder(date, hanchanNo);
  const basePoints = computeFinalPoints(scores, seatOrder);
  const chomboPt = computeHanchanChomboPt(date, hanchanNo);
  state.ranks[key] = computedRanks;
  state.finalPoints[key] = basePoints.map((p,i)=> p + chomboPt[i]);
  state.hanchanConfirmed[key] = true;
  return {ok:true};
}

// チョンボの罰則（本人-15pt、他3名+5ptずつ・ゼロサム）を、指定した半荘の全記録から集計する。
function computeHanchanChomboPt(date, hanchanNo){
  const pt = [0,0,0,0];
  state.records.filter(r=>r.date===date && r.hanchanNo===hanchanNo).forEach(r=>{
    r.stats.forEach((s,i)=>{
      if(s[K_CHOMBO]){
        pt[i] -= 15;
        for(let j=0;j<4;j++){ if(j!==i) pt[j] += 5; }
      }
    });
  });
  return pt;
}

// 統計は「プレイヤーindex(0-3)」単位ではなく「プレイヤー名」単位で集計する（名前は半荘ごとのrecordPlayersから取得）。
function computeOverallStats(range){
  // 曜日フィルタ：半荘集計タブと共通のisWeekendDate()で土日を「週末」、それ以外を「平日」とする
  const weekdayOk = (date)=>{
    if(!range || !range.weekday || range.weekday === "all") return true;
    return range.weekday === "weekend" ? isWeekendDate(date) : !isWeekendDate(date);
  };
  const inRange = (date)=> !range || (((!range.from || date>=range.from) && (!range.to || date<=range.to)) && weekdayOk(date));
  const byName = new Map();
  function ensure(name){
    const key = name || "";
    if(!byName.has(key)){
      byName.set(key, {
        name: key,
        riichi:0, fuuro:0, tsumo:0, ron:0, houjuu:0, riichiAgari:0, riichiHoujuu:0, fuuroAgari:0, fuuroHoujuu:0,
        chombo:0, chomboPt:0, kyokuCount:0, ranks:[], scores:[], pts:[]
      });
    }
    return byName.get(key);
  }
  // 登録済みのプレイヤー名リストは、まだ対局実績が無くても一覧に表示できるよう先に登録しておく
  state.playerRoster.forEach(n=>{ if(n) ensure(n); });

  state.records.forEach(r=>{
    if(!inRange(r.date)) return;
    const names = namesForHanchan(r.date, r.hanchanNo);
    const isChomboResult = r.resultType === "chombo";
    const isResultOnly = r.resultType === "resultonly"; // 結果のみ入力（局の詳細なし）は打点系スタッツの対象外
    r.stats.forEach((s,i)=>{
      const name = names[i] || `P${i+1}`;
      const p = ensure(name);
      const ri=s[K_RIICHI], fu=s[K_FUURO]||0, tsu=s[K_TSUMO], ron=s[K_RON], ho=s[K_HOUJUU];
      p.riichi += ri; p.fuuro += fu; p.tsumo += tsu; p.ron += ron; p.houjuu += ho;
      if(ri && (tsu || ron)) p.riichiAgari += 1;
      if(ri && ho) p.riichiHoujuu += 1;
      if(fu && (tsu || ron)) p.fuuroAgari += 1;
      if(fu && ho) p.fuuroHoujuu += 1;
      if(!isChomboResult && !isResultOnly) p.kyokuCount += 1; // チョンボ・結果のみ入力は率の分母から除く
      if(s[K_CHOMBO]){
        // チョンボは個人トータルポイントから15pt減算、他3名に5ptずつ加算（ゼロサム）
        p.chombo += 1;
        p.chomboPt -= 15;
        for(let j=0;j<4;j++){ if(j!==i) ensure(names[j] || `P${j+1}`).chomboPt += 5; }
      }
    });
  });

  Object.entries(state.ranks).forEach(([key,arr])=>{
    if(!arr || !state.hanchanConfirmed[key]) return; // 「確定」済みの半荘のみ着順・スコア集計に含める
    const idx = key.lastIndexOf("_");
    const date = key.slice(0,idx), hanchanNo = Number(key.slice(idx+1));
    if(!inRange(date)) return;
    const names = namesForHanchan(date, hanchanNo);
    const scores = state.finalScores[key] || [null,null,null,null];
    const pts = state.finalPoints[key] || [null,null,null,null];
    arr.forEach((rk,i)=>{
      if(!rk) return;
      const p = ensure(names[i] || `P${i+1}`);
      p.ranks.push(rk);
      if(scores[i]!==null && scores[i]!==undefined && !isNaN(scores[i])) p.scores.push(scores[i]);
      if(pts[i]!==null && pts[i]!==undefined && !isNaN(pts[i])) p.pts.push(pts[i]);
    });
  });

  return Array.from(byName.values()).map(p=>{
    const n = p.ranks.length;
    const avg = n ? p.ranks.reduce((a,b)=>a+b,0)/n : 0;
    const rate = (k)=> n ? p.ranks.filter(x=>x===k).length/n : 0;
    const agari = p.tsumo + p.ron;
    const scoreN = p.scores.length;
    return {
      ...p,
      agari,
      hanchanRankedCount: n,
      avgRank: avg,
      top: rate(1), second: rate(2), third: rate(3), last: rate(4),
      lastAvoidRate: n ? 1 - rate(4) : 0,
      cumulativePt: p.pts.reduce((a,b)=>a+b,0),
      avgScore: scoreN ? p.scores.reduce((a,b)=>a+b,0)/scoreN : 0,
      maxScore: scoreN ? Math.max(...p.scores) : 0,
      hakoRate: scoreN ? p.scores.filter(s=>s<0).length/scoreN : 0,
      riichiRate: p.kyokuCount ? p.riichi/p.kyokuCount : 0,
      fuuroRate: p.kyokuCount ? p.fuuro/p.kyokuCount : 0,
      agariRate: p.kyokuCount ? agari/p.kyokuCount : 0,
      houjuuRate: p.kyokuCount ? p.houjuu/p.kyokuCount : 0,
      riichiAgariRate: p.riichi ? p.riichiAgari/p.riichi : 0,
      riichiHoujuuRate: p.riichi ? p.riichiHoujuu/p.riichi : 0,
      fuuroAgariRate: p.fuuro ? p.fuuroAgari/p.fuuro : 0,
      fuuroHoujuuRate: p.fuuro ? p.fuuroHoujuu/p.fuuro : 0,
    };
  });
}

// ---- 通算ランキング（累計得点pt順・期間指定つき） ----
// 期間チップ（今月／先月／今年／全期間）の期間
function rankingPresetRange(p){
  const t = todayStr(), y = Number(t.slice(0,4)), mo = Number(t.slice(5,7));
  const pad = n=>String(n).padStart(2,"0");
  if(p==="month") return {from:`${y}-${pad(mo)}-01`, to:""};
  if(p==="last"){ const ly = mo===1 ? y-1 : y, lm = mo===1 ? 12 : mo-1; const last = new Date(ly, lm, 0).getDate(); return {from:`${ly}-${pad(lm)}-01`, to:`${ly}-${pad(lm)}-${pad(last)}`}; }
  if(p==="year") return {from:`${y}-01-01`, to:""};
  return {from:"", to:""};
}
const RANKING_PRESETS = [["month","今月"],["last","先月"],["year","今年"],["all","全期間"]];
const CROWN_SVG = `<svg class="crown" viewBox="0 0 26 14" fill="none" aria-hidden="true"><path d="M2 12.5h22L22 3l-5 4.5L13 1 9 7.5 4 3z" fill="#e2bb62" stroke="#a87c2c" stroke-width="1.2" stroke-linejoin="round"/><circle cx="13" cy="9" r="1.6" fill="#b8322a"/></svg>`;
function renderRankingTab(){
  const range = state.rankingRange;
  const rangedStats = computeOverallStats(range);
  const ranked = rangedStats.filter(s=>s.hanchanRankedCount>0).slice().sort((a,b)=>b.cumulativePt-a.cumulativePt);
  const chips = RANKING_PRESETS.map(([k,l])=>{
    const p = rankingPresetRange(k);
    const on = p.from===range.from && p.to===range.to;
    return `<button type="button" class="${on?'active':''}" data-period="${k}">${l}</button>`;
  }).join("");
  // 表彰台（2位・1位・3位の順に並べる）
  const pod = [1,0,2].map(i=> ranked[i] ? `
    <div class="pd p${i+1}">${i===0?CROWN_SVG:""}
      <div class="nm">${escapeHtml(ranked[i].name)}</div>
      <div class="pt ${ranked[i].cumulativePt<0?'neg':''}">${fmtPt(ranked[i].cumulativePt)}</div>
      <div class="step">${i+1}<small>位</small></div>
    </div>` : `<div></div>`).join("");
  // 累計ptの棒：0を中心に、プラスは右へ緑・マイナスは左へ赤
  const maxAbs = Math.max(1, ...ranked.map(s=>Math.abs(s.cumulativePt)));
  const rows = ranked.map((s,i)=>`
    <div class="rrow">

// 局の記録を文章にする（略記は使わない）。例：「田中 ロン ← 鈴木／リーチ：田中」「流局（親テンパイ）」「チョンボ：鈴木」
function describeRecordMain(r, names){
  const nm = (i)=> names[i] || `P${i+1}`;
  if(r.resultType === "resultonly") return "局の詳細なし（最終持ち点のみで記録）";
  const w = r.stats.findIndex(s=>s[K_TSUMO] || s[K_RON]);
  const l = r.stats.findIndex(s=>s[K_HOUJUU]);
  const ch = r.stats.map((s,i)=>s[K_CHOMBO] ? nm(i) : null).filter(Boolean);
  if(r.resultType === "chombo" || (ch.length && w < 0)) return `チョンボ：${ch.join("、") || "-"}`;
  if(w >= 0) return r.stats[w][K_TSUMO] ? `${nm(w)} ツモ` : `${nm(w)} ロン ← ${l>=0 ? nm(l) : "?"}`;
  return r.resultType === "renchan" ? "流局（親テンパイ）" : "流局（親ノーテン）";
}
function describeRecord(r, names){
  const nm = (i)=> names[i] || `P${i+1}`;
  const parts = [describeRecordMain(r, names)];
  if(r.resultType === "resultonly") return parts[0];
  const ri = r.stats.map((s,i)=>s[K_RIICHI] ? nm(i) : null).filter(Boolean);
  const fu = r.stats.map((s,i)=>s[K_FUURO] ? nm(i) : null).filter(Boolean);
  if(ri.length) parts.push(`リーチ：${ri.join("、")}`);
  if(fu.length) parts.push(`鳴き：${fu.join("、")}`);
  return parts.join("／");
}
// 局の見出し。例：「半荘1 東1 1本場」
function kyokuLabel(r, withHanchan){
  const h = withHanchan ? `半荘${r.hanchanNo} ` : "";
  if(r.resultType === "resultonly") return `${h}結果のみ入力`;
  return `${h}${r.kyoku}${r.honba ? ` ${r.honba}本場` : ""}`;
}
// 1行ぶんの記録（直近の入力・半荘集計の局一覧で共通）。✎は「結果のみ入力」には出さない
function historyItemHtml(r, names, tag, editAttr, delAttr){
  const editable = r.resultType !== "resultonly";
  return `<div class="history-item">

      <button type="button" class="del" ${delAttr}="${r.id}" aria-label="削除">×</button>

}

  const names = currentNames();
  const nm = (i)=> escapeHtml(names[i] || "プレイヤー"+(i+1));
  if(ov.type === "winner" || ov.type === "loser" || ov.type === "chombo"){
    // 和了者・放銃者・チョンボは卓の形で選ぶ。各席に位置・名前・親／リーチ／鳴きの状態を出し、親の席は枠で強調する
    const cur = state.current;
    const dealer = getSeatOrder(cur.date, cur.hanchanNo)[cur.kyoku % 4];
    const tags = (i)=>{
      const t = cur.toggles[i], a = [];
      if(i===dealer) a.push(`<span class="pk-tag oya">親</span>`);
      if(t[K_RIICHI]) a.push(`<span class="pk-tag riichi">リーチ</span>`);
      if(t[K_FUURO]) a.push(`<span class="pk-tag fuuro">鳴き</span>`);
      return a.join("");
    };
    const seatHtml = (i, extra)=>`<span class="pos">${POS_LABELS[i]}</span><span class="nm">${nm(i)}</span><span class="pk-tags">${extra || tags(i)}</span>`;
    const sub = "リーチ・鳴きの付け忘れはキャンセルして修正";
    if(ov.type === "winner"){
      const title = ov.action === "tsumo" ? "誰がツモりましたか？" : "誰がロンしましたか？";
      return overlaySheet(title, sub, renderPickTable("data-pick-winner", (i)=>seatHtml(i), (i)=> i===dealer?'is-dealer':'', ov.action === "tsumo" ? "ツモ" : "ロン"));
    }
    if(ov.type === "loser"){
      // 和了者の席は押せない
      return overlaySheet(`誰の放銃ですか？`, sub, renderPickTable("data-pick-loser",
        (i)=> i===ov.winner ? seatHtml(i, `<span class="pk-tag win">ロン</span>`) : seatHtml(i),
        (i)=> `${i===dealer?'is-dealer':''} ${i===ov.winner?'disabled':''}`,
        "放銃者を<br>タップ",
        (i)=> i===ov.winner ? 'disabled aria-disabled="true"' : ''));
    }
    const sel = ov.selected;
    const any = sel.some(Boolean);
    return overlaySheet("チョンボ", sub + "（複数選択可）",
      `${renderPickTable("data-pick-chombo", (i)=>seatHtml(i), (i)=> `${i===dealer?'is-dealer':''} ${sel[i]?'picked':''}`, "複数<br>選択可")}
       <button type="button" class="overlay-confirm" id="confirmChomboBtn" ${any?'':'disabled'}>この内容でチョンボを記録</button>`);
  }
  if(ov.type === "ryuukyoku"){
    const btns = `
      <button type="button" class="overlay-btn" data-pick-ryuukyoku="oya">聴牌<span class="pos">親は連荘</span></button>
      <button type="button" class="overlay-btn" data-pick-ryuukyoku="noten">ノーテン<span class="pos">次の局へ</span></button>`;
    return overlaySheet("流局", "親のテンパイ有無を選んでください", `<div class="overlay-grid">${btns}</div>`);
  }
  if(ov.type === "hanchanSetup") return renderHanchanSetupOverlay(ov);
  if(ov.type === "seatFix") return renderSeatFixOverlay(ov);
  return "";
}
// 卓の形（上=対面、左=上家、右=下家、下=自家）に4つの席ボタンを並べる共通部品。
// seatHtml(i) が各席の中身、dataAttr が各ボタンに付けるdata属性名。
function renderPickTable(dataAttr, seatHtml, seatClass, centerHtml, seatAttr){
  const seats = [0,1,2,3].map(i=>
    `<button type="button" class="seat-pick ${POS_CLASSES[i]} ${seatClass(i)}" ${dataAttr}="${i}" ${seatAttr ? seatAttr(i) : ""}>${seatHtml(i)}</button>`).join("");
  return `
    <div class="table-wrap compact">
      <div class="table-grid">
        ${seats}
        <div class="table-center static">${centerHtml}</div>
      </div>
    </div>`;
}
// ---------- 半荘開始時の準備：前の半荘と同じ並びを初期値に、起家をタップするだけで開始する ----------
// まだ決まっていない席（空欄・仮の名前・重複した2人目以降）の位置
function setupUndecided(players){
  return players.map((n,i)=> (isPlaceholderName(n) || players.indexOf(n) !== i) ? i : -1).filter(i=>i>=0);
}
function setupInvalid(players){ return setupUndecided(players).length > 0; }
// まだ決まっていない席があれば、その最初の席を選ぶ（無ければ選択なし）
function setupAutoPick(ov){ const u = setupUndecided(ov.players); ov.pick = u.length ? u[0] : null; }
function renderHanchanSetupOverlay(ov){
  const undecided = new Set(setupUndecided(ov.players));
  const showName = (i)=> isPlaceholderName(ov.players[i]) ? "未定" : ov.players[i];
  let table, members = "";
  if(ov.editMembers){

    table = renderPickTable("data-setup-seat",
      (i)=>`<span class="pos">${POS_LABELS[i]}</span><span class="nm ${undecided.has(i)?'undecided':''}">${escapeHtml(showName(i))}</span>`,
      (i)=> ov.pick===i ? 'selected' : '',
      ov.pick===null ? "席を<br>タップ" : "名前を<br>タップ");
    const nameBtns = state.playerRoster.map(n=>{
      const at = ov.players.indexOf(n);
      return `<button type="button" class="name-btn ${at>=0?'seated':''}" data-setup-name="${escapeAttr(n)}"><span>${escapeHtml(n)}</span>${at>=0?`<small>${POS_LABELS[at]}</small>`:""}</button>`;
    }).join("");
    members = `
      <div class="overlay-label">${ov.pick===null ? "席を選んでください" : `${POS_LABELS[ov.pick]}に座る人`}</div>
      <div class="name-grid">${nameBtns || `<div class="empty" style="grid-column:1/-1; padding:4px 0 2px;">下の欄に名前を入れて「追加」</div>`}</div>
      <div class="add-name-row">
        <input type="text" id="setupNewName" placeholder="名簿に無い名前を追加" autocomplete="off" enterkeyhint="done">
        <button type="button" class="btn-ghost" id="setupAddNameBtn">追加</button>
      </div>
      <button type="button" class="overlay-confirm" id="setupDoneBtn" ${undecided.size?'disabled':''}>この並びで決定</button>`;
  }else{
    table = renderPickTable("data-setup-start",
      (i)=>`<span class="pos">${POS_LABELS[i]}</span><span class="nm">${escapeHtml(showName(i))}</span>`,

        <div class="overlay-sub">${ov.editMembers ? "席をタップして、座る人の名前をタップ" : "起家（東家）の席をタップすると開始します"}</div>
        ${table}
        ${ov.editMembers ? members : `<button type="button" class="setup-members-btn" id="toggleSetupMembersBtn">${ICON_SWAP}メンバー・席を変更</button>`}
        <button type="button" class="overlay-cancel" id="setupLaterBtn">あとで</button>
      </div>
    </div>`;
}
// ---------- 席・起家の変更（席替え・席の間違い・選手の交代） ----------
// 2つの席を続けてタップすると、その2人を入れ替える（記録済みの局は「人」に付いたまま一緒に移動する）。
// 席をタップしてから名前をタップすると、その席の人を交代する（その席の記録済みの局は交代後の人の成績になる）。
function renderSeatFixOverlay(ov){
  const origNames = currentNames();
  const table = renderPickTable("data-fix-seat",
    (i)=>`<span class="pos">${POS_LABELS[i]}</span><span class="nm">${escapeHtml(ov.names[i] || "-")}</span><span class="wind">${i===ov.starter?'起家':''}</span>`,

  // 席を選んでいるときだけ、交代する人の名前ボタンを出す（座っている人を選ぶと入れ替え、いない人を選ぶと交代）
  const nameArea = ov.pick===null ? "" : `
     <div class="overlay-label">${POS_LABELS[ov.pick]}（${escapeHtml(ov.names[ov.pick] || "-")}）と入れ替える・交代する人</div>
     <div class="name-grid">${state.playerRoster.map(n=>{
       const at = ov.names.indexOf(n);
       return `<button type="button" class="name-btn ${at>=0?'seated':''}" data-fix-name="${escapeAttr(n)}"><span>${escapeHtml(n)}</span>${at>=0?`<small>${POS_LABELS[at]}</small>`:""}</button>`;
     }).join("")}</div>
     <div class="add-name-row">
       <input type="text" id="fixNewName" placeholder="名簿に無い名前を追加" autocomplete="off" enterkeyhint="done">
       <button type="button" class="btn-ghost" id="fixAddNameBtn">追加</button>
     </div>`;

    `<button type="button" class="${ov.starter===i?'selected':''}" data-fix-starter="${i}">${escapeHtml(ov.names[i] || label)}</button>`).join("");
  return overlaySheet("席・起家の変更", "2つの席をタップで入れ替え／席 → 名前で交代",
    `${table}
     ${nameArea}
     <div class="overlay-label">起家（東家）</div>
     <div class="starter-row">${starterBtns}</div>

// ---- 麻雀卓UIのアクション（ツモ・ロン・流局・チョンボ）フロー ----
// 結果フラグ（ツモ・ロン・放銃・チョンボ）を消す。結果を選び直すときは、前の結果を消してから付け直す
function clearResultFlags(){ state.current.toggles.forEach(t=>{ t[K_TSUMO]=0; t[K_RON]=0; t[K_HOUJUU]=0; t[K_CHOMBO]=0; }); }
function openTsumoFlow(){ hideUndo(); clearResultFlags(); state.overlay = {type:"winner", action:"tsumo"}; render(); }
function openRonFlow(){ hideUndo(); clearResultFlags(); state.overlay = {type:"winner", action:"ron"}; render(); }
function openRyuukyokuFlow(){ hideUndo(); clearResultFlags(); state.overlay = {type:"ryuukyoku"}; render(); }
function openChomboFlow(){
  hideUndo();
  const selected = state.current.toggles.map(t=>t[K_CHOMBO]?1:0);
  clearResultFlags();
  state.overlay = {type:"chombo", selected};
  render();
}
// オーバーレイを取り消す：フロー途中で仮に付いたツモ／ロン／放銃フラグ（リーチ・副露は対象外）を消してから閉じる
function closeOverlay(){
  const rec = state.editingId ? state.records.find(r=>r.id===state.editingId) : null;
  state.current.toggles.forEach((t,i)=>{
    if(rec){ [K_TSUMO,K_RON,K_HOUJUU,K_CHOMBO].forEach(k=>{ t[k] = rec.stats[i][k] || 0; }); } // 編集中は記録済みの結果に戻す
    else { t[K_TSUMO]=0; t[K_RON]=0; t[K_HOUJUU]=0; }
  });
  state.overlay = null;
  render();
}
function pickWinner(idx){
  const action = state.overlay.action;
  toggleStat(idx, action==="tsumo" ? K_TSUMO : K_RON);
  if(action==="tsumo"){
    finalizeAgari(idx);
  }else{
    state.overlay = {type:"loser", winner: idx};
    render();
  }
}
function pickLoser(idx){
  toggleStat(idx, K_HOUJUU);
  finalizeAgari(state.overlay.winner);
}
function finalizeAgari(winnerIdx){
  const cur = state.current;
  const seatOrder = getSeatOrder(cur.date, cur.hanchanNo);
  const dealerIndex = seatOrder[cur.kyoku % 4];
  const resultType = winnerIdx === dealerIndex ? "renchan" : "next";
  if(!validateAgariHoujuuConsistency()){ return; } // ロンで放銃者未選択のまま呼ばれることは無いはずだが念のため
  state.overlay = null;
  if(state.editingId) commitEdit(resultType); else onSave(resultType);
}
function pickRyuukyokuOutcome(oyaTenpai){
  const resultType = oyaTenpai ? "renchan" : "ryuukyoku";
  state.overlay = null;
  if(state.editingId) commitEdit(resultType); else onSave(resultType);
}
function toggleChomboSelect(idx){
  state.overlay.selected[idx] = state.overlay.selected[idx] ? 0 : 1;
  render();
}
function confirmChombo(){
  const sel = state.overlay.selected;
  if(!sel.some(Boolean)){ toast("チョンボしたプレイヤーを選んでください"); return; }
  sel.forEach((v,i)=>{
    const desired = v ? 1 : 0;
    if(state.current.toggles[i][K_CHOMBO] !== desired) toggleStat(i, K_CHOMBO);
  });
  state.overlay = null;
  if(state.editingId) commitEdit("chombo"); else onSave("chombo");
}

// 半荘開始準備：タップした席を起家として、その半荘の名前（recordPlayers）と座席（dealers）を確定する。
// 名前はこの時点で半荘ごとに固定し、以降の画面表示・保存・集計はすべてこの固定名を使う。
// あわせて既定メンバー（players）も同じ並びに更新し、次の半荘の初期値にする。
function startHanchanWithStarter(starter){
  const ov = state.overlay;
  if(setupInvalid(ov.players)){ ov.editMembers = true; setupAutoPick(ov); render(); toast("まだ決まっていない席があります"); return; }
  hideUndo();
  const cur = state.current;
  const key = `${cur.date}_${cur.hanchanNo}`;
  state.players = ov.players.slice();
  saveSettings();
  markMembersPending();
  state.recordPlayers[key] = ov.players.slice();
  saveRecordPlayers();
  setSeatOrder(cur.date, cur.hanchanNo, seatOrderFromStarter(starter));
  state.overlay = null;
  render();
  toast(`半荘${cur.hanchanNo}開始（起家：${ov.players[starter]}）`);
}
// 準備オーバーレイ（メンバー変更）：選択中の席に name を座らせる。すでに別の席にいる人なら2人の席を入れ替える
function setupAssign(name){
  const ov = state.overlay;
  if(ov.pick === null){ setupAutoPick(ov); }
  if(ov.pick === null){ toast("先に席をタップしてください"); render(); return; }
  const i = ov.pick, j = ov.players.indexOf(name);
  if(j >= 0 && j !== i) ov.players[j] = ov.players[i];
  ov.players[i] = name;
  setupAutoPick(ov); // まだ決まっていない席があれば、次はその席を選ぶ
  render();
}
// 名簿に無い名前を、その場で名簿へ追加して選択中の席に座らせる
function setupAddName(){
  const inp = document.getElementById("setupNewName");
  const val = (inp && inp.value || "").trim();
  if(!val){ toast("名前を入力してください"); return; }
  if(!state.playerRoster.includes(val)){
    state.playerRoster.push(val);
    saveSettings(); markMembersPending();
  }
  setupAssign(val);
}
// ---- 席・起家の修正 ----
function openSeatFix(){
  hideUndo();
  const cur = state.current;
  const seatOrder = getSeatOrder(cur.date, cur.hanchanNo);
  state.overlay = { type:"seatFix", names: currentNames().slice(), perm:[0,1,2,3], starter: seatOrder[0], pick:null };
  render();
}
// 席・起家の変更：選択中の席に name を座らせる。同じ半荘に座っている人なら2人の席を入れ替え、いない人なら交代（その席の記録はその人の成績になる）
function tapFixName(name){
  const ov = state.overlay;
  if(ov.pick === null) return;
  const i = ov.pick, j = ov.names.indexOf(name);
  if(j === i){ ov.pick = null; render(); return; }
  if(j >= 0){
    [ov.names[i], ov.names[j]] = [ov.names[j], ov.names[i]];
    [ov.perm[i], ov.perm[j]] = [ov.perm[j], ov.perm[i]];
  }else{
    ov.names[i] = name;
  }
  ov.pick = null;
  render();
}
function fixAddName(){
  const inp = document.getElementById("fixNewName");
  const val = (inp && inp.value || "").trim();
  if(!val){ toast("名前を入力してください"); return; }
  if(!state.playerRoster.includes(val)){ state.playerRoster.push(val); saveSettings(); markMembersPending(); }
  tapFixName(val);
}
function tapFixSeat(i){
  const ov = state.overlay;
  if(ov.pick === null){ ov.pick = i; }
  else if(ov.pick === i){ ov.pick = null; }
  else{
    const a = ov.pick, b = i;
    [ov.names[a], ov.names[b]] = [ov.names[b], ov.names[a]];
    [ov.perm[a], ov.perm[b]] = [ov.perm[b], ov.perm[a]];
    ov.pick = null;
  }
  render();
}
// 配列を「新しい位置i ← 元の位置perm[i]」の対応で並べ替える
function permuteArray(arr, perm){ return perm.map(old=>arr[old]); }
// 席の修正を、その半荘に属するすべてのデータへ反映する。
// 名前・各局のスタッツ・入力中のトグル・素点／順位／得点ptを同じ対応で並べ替えるため、「誰が何をしたか」は変わらない。
// 起家は卓上の位置で指定し直す（座席順は手番順に沿って機械的に決まる）。
function applySeatFix(date, hanchanNo, perm, starter, finalNames){
  const key = `${date}_${hanchanNo}`;
  const identity = perm.every((v,i)=>v===i);
  if(!identity){
    state.records.forEach(r=>{
      if(r.date===date && r.hanchanNo===hanchanNo) r.stats = permuteArray(r.stats, perm);
    });
    ["ranks","finalScores","finalPoints"].forEach(k=>{
      if(Array.isArray(state[k][key])) state[k][key] = permuteArray(state[k][key], perm);
    });
    saveRecords(); saveRanks(); saveFinalScores(); saveFinalPoints();
  }
  // 名前は入れ替え・交代を反映した最終の並びをそのまま保存する
  const names = finalNames || permuteArray(namesForHanchan(date, hanchanNo).slice(), perm);
  state.recordPlayers[key] = names.slice();
  saveRecordPlayers();
  setSeatOrder(date, hanchanNo, seatOrderFromStarter(starter));
}

function confirmSeatFix(){
  const ov = state.overlay;
  const cur = state.current;
  const seatOrder = getSeatOrder(cur.date, cur.hanchanNo);
  const identity = ov.perm.every((v,i)=>v===i);
  const sameNames = ov.names.every((n,i)=>n===currentNames()[i]);
  if(identity && sameNames && ov.starter === seatOrder[0]){ state.overlay = null; render(); return; }
  applySeatFix(cur.date, cur.hanchanNo, ov.perm, ov.starter, ov.names);
  cur.toggles = permuteArray(cur.toggles, ov.perm);
  const fixedKey = `${cur.date}_${cur.hanchanNo}`;
  if(!state.seatFixPending.includes(fixedKey)){ state.seatFixPending.push(fixedKey); saveSeatFixPending(); }
  // 修正後の並びを既定メンバーにも反映し、次の半荘の初期値にする
  state.players = currentNames().slice();
  saveSettings();
  markMembersPending();
  state.overlay = null;
  render();
  toast("席・起家を変更しました");
}

// 閉じたカードでも結果が分かる：1〜4着の名前とpt（確定済みのみ）
function hanchanResultStrip(key, names){
  const ranks = state.ranks[key], pts = state.finalPoints[key];
  if(!ranks || !pts || !state.hanchanConfirmed[key]) return "";
  const order = [0,1,2,3].sort((a,b)=>(ranks[a]||9)-(ranks[b]||9) || a-b);
  return `<div class="hc-result">${order.map(i=>`
    <div class="hr r${ranks[i]}"><div class="top"><span class="rk k${ranks[i]}">${ranks[i]}</span><span class="nm">${escapeHtml(names[i]||"P"+(i+1))}</span></div>
    <div class="pt ${pts[i]<0?'neg':''}">${fmtPt(pts[i])}</div></div>`).join("")}</div>`;
}
// 局の流れ：東場・南場の2段に、1局を小さな牌1枚で並べる（ツ／ロ／流／チ＋和了者の頭文字。連荘は赤点）
function flowTileInfo(r, names){
  const nm = (i)=> names[i] || `P${i+1}`;
  const w = r.stats.findIndex(s=>s[K_TSUMO] || s[K_RON]);
  if(r.resultType === "chombo"){ const c = r.stats.findIndex(s=>s[K_CHOMBO]); return {cls:"chombo", g:"チ", w: c>=0 ? nm(c).slice(0,1) : ""}; }
  if(w < 0) return {cls:"ryu", g:"流", w:""};
  return r.stats[w][K_TSUMO] ? {cls:"tsumo", g:"ツ", w:nm(w).slice(0,1)} : {cls:"ron", g:"ロ", w:nm(w).slice(0,1)};
}
function hanchanFlowBand(key, date, hanchanNo, names){

// ---- 半荘の時間（終了時刻・所要時間） ----
// 局レコードのid（uid()）の先頭8文字は保存時刻（Date.nowの36進数）なので、そこから各局の保存時刻を復元できる。
// CSV取り込みなど、対局日と異なる日に作られたidは保存時刻として使えないため除外する（対局日または翌日の深夜帯のみ有効）。
function recordSavedAt(rec){
  const ms = parseInt(String(rec.id||"").slice(0,8), 36);
  if(!isFinite(ms) || ms < Date.UTC(2020,0,1) || ms > Date.UTC(2100,0,1)) return null;
  const t = new Date(ms);
  const ymd = (d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  if(ymd(t) === rec.date) return t;
  const next = new Date(rec.date+"T00:00:00"); next.setDate(next.getDate()+1);
  if(ymd(t) === ymd(next) && t.getHours() < 6) return t;
  return null;
}
// 終了時刻：記録済み（hanchanEndAt）を優先し、無ければ最後の局の保存時刻で代用する。
// 所要時間：最初の局の保存時刻〜終了時刻に、その半荘の1局あたり平均時間を足して東1局分を補う（推定値のため「約」表記）。
//   1局あたり平均 ＝（最初の局の保存時刻〜終了時刻）÷（保存時刻のある局数−1）
function hanchanTiming(date, hanchanNo){
  const key = `${date}_${hanchanNo}`;
  const times = state.records
    .filter(r=>r.date===date && r.hanchanNo===hanchanNo && r.resultType!=="resultonly")
    .map(recordSavedAt).filter(Boolean).sort((a,b)=>a-b);
  let end = state.hanchanEndAt[key] ? new Date(state.hanchanEndAt[key]) : null;
  if(end && isNaN(end)) end = null;
  if(!end && times.length) end = times[times.length-1];
  if(!end) return null;
  const start = times.length ? times[0] : null;
  const span = start ? end - start : 0;
  const perKyoku = times.length >= 2 ? span / (times.length - 1) : 0; // 東1局分の推定時間
  const minutes = (start && span >= 60000) ? Math.round((span + perKyoku)/60000) : null;
  const perKyokuMin = (minutes !== null && perKyoku > 0) ? Math.round(perKyoku/6000)/10 : null; // 局平均時間（分、小数1桁）
  return { end, minutes, perKyokuMin };
}
function fmtHanchanTiming(t){
  if(!t) return "";
  const hm = `${t.end.getHours()}:${String(t.end.getMinutes()).padStart(2,"0")}`;
  const avg = t.perKyokuMin!==null ? `・局平均${t.perKyokuMin.toFixed(1)}分` : "";
  return `${hm}終了${t.minutes!==null ? `（約${t.minutes}分${avg}）` : ""}`;
}

// チョンボは発生することが稀なため、発生した場合のみ小さなマークとして選手名の隣に添える。
function chomboMark(count){
  return count>0 ? ` <span class="chombo-mark">チョンボ×${count}</span>` : "";
}

// 素点の入力文字列を正規化する（全角数字・各種マイナス記号・カンマ・空白を吸収）
function normalizeScoreText(raw){
  return String(raw||"")
    .replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[−－‐‑–—ー▲]/g, "-")
    .replace(/[,，\s]/g, "");
}
// 正規化した素点文字列を整数（点）に変換する。空欄・「-」のみ・数値として不正な場合は null（未入力）。
// 入力欄は百の位以上のみを受け付け（十の位以下は「00」固定表示）、入力値×100 を素点とする（例：253 → 25300点、-12 → -1200点）。
function parseScoreInput(raw){
  const t = normalizeScoreText(raw);
  if(t === "" || t === "-") return null;
  const n = Number(t);
  return isFinite(n) ? Math.round(n*100) : null;
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

    document.querySelectorAll("[data-score-key]").forEach(inp=>{

        if(state.scoreAuto[key] === p){ delete state.scoreAuto[key]; inp.classList.remove("auto"); } // 自動で埋めた欄を手で入力したら、自動ではなくなる
        state.finalScores[key][p] = parseScoreInput(inp.value);
        applyScoreAutoFill(key);
        saveFinalScores();
        updateScoreUi(key, p);
      };
      inp.onkeydown = (e)=>{ if(e.key === "Enter"){ e.preventDefault(); focusNextScore(inp); } };
    });
    // 「−」ボタン：素点の符号を反転する。入力欄のフォーカスを外さないよう pointerdown で処理する
    document.querySelectorAll("[data-score-sign-key]").forEach(b=>{
      const handle = (e)=>{
        e.preventDefault();
        const key = b.dataset.scoreSignKey, p = Number(b.dataset.scoreSignP);
        const inp = document.querySelector(`[data-score-key="${key}"][data-score-p="${p}"]`);
        if(!inp) return;
        const cur = normalizeScoreText(inp.value);
        if(cur === "" || cur === "-"){
          // 未入力なら先頭に「-」だけ置いて入力欄へ。続けて数字を打てばマイナスの素点になる
          inp.value = cur === "-" ? "" : "-";
          inp.focus();
          return;
        }
        const v = parseScoreInput(cur);
        if(v === null) return;
        if(!state.finalScores[key]) state.finalScores[key] = [null,null,null,null];
        if(state.scoreAuto[key] === p) delete state.scoreAuto[key];
        const nv = v === 0 ? 0 : -v;
        state.finalScores[key][p] = nv;
        inp.value = nv / 100;
        applyScoreAutoFill(key);
        saveFinalScores();
        updateScoreUi(key, p);
      };
      if(window.PointerEvent) b.onpointerdown = handle; else b.onclick = handle;
    });

    document.querySelectorAll("[data-ft]").forEach(b=>b.onclick=(e)=>{

      delete state.hanchanEndAt[key]; saveHanchanEndAt();
      delete state.hanchanConfirmed[key]; delete state.dealers[key]; delete state.recordPlayers[key];

    if(githubPullNowBtn) githubPullNowBtn.onclick = ()=>{
      if(!githubConfigured()){ toast("先にトークン・owner・repoを保存してください"); return; }
      pullLatestFromGithub({}).then(result=>{
        if(result && !result.remoteHasNew && !result.localOnlyAdded && !result.rankingChanged) toast("最新の状態です（変更はありませんでした）");
      });
    };
  }
}

// 直近の入力の「✎」から呼ばれる：既存レコードの内容を入力フォームに読み込んで編集状態にする
function startEdit(id){
  const rec = state.records.find(r=>r.id===id);
  if(!rec) return;
  hideUndo();
  state.editBackup = JSON.parse(JSON.stringify(state.current)); // 編集キャンセル時に戻すための退避
  state.editingId = id;
  state.overlay = null;
  state.current.date = rec.date;
  state.current.hanchanNo = rec.hanchanNo;
  state.current.kyoku = KYOKU_LIST.indexOf(rec.kyoku);
  state.current.honba = rec.honba || 0;
  state.current.toggles = rec.stats.map(t=>t.slice());
  render();
  window.scrollTo(0, 0); // 編集を始めたら画面の先頭へ
}
// 「結果はそのまま保存」：リーチ・鳴きだけ直し、ツモ・ロン・放銃・チョンボと結果種別は記録済みのまま保存する
function keepResultSave(){
  const rec = state.records.find(r=>r.id===state.editingId);
  if(!rec) return;
  state.current.toggles.forEach((t,i)=>{ [K_TSUMO,K_RON,K_HOUJUU,K_CHOMBO].forEach(k=>{ t[k] = rec.stats[i][k] || 0; }); });
  commitEdit(rec.resultType);
}
function cancelEdit(){
  if(state.editBackup) state.current = state.editBackup;
  state.editBackup = null;
  state.editingId = null;
  render();
  toast("編集をキャンセルしました");
}
function commitEdit(resultType){
  const idx = state.records.findIndex(r=>r.id===state.editingId);
  if(idx===-1){ state.editingId = null; state.editBackup = null; render(); return; }
  const snap = snapshotForUndo(false); // 更新の取り消しは記録だけを戻す（入力位置は編集前の位置のまま）
  const cur = state.current;
  ensureRecordPlayersSnapshot(cur.date, cur.hanchanNo);
  state.records[idx] = {
    ...state.records[idx],
    date: cur.date, hanchanNo: cur.hanchanNo, kyoku: KYOKU_LIST[cur.kyoku], honba: cur.honba,
    resultType, stats: cur.toggles.map(t=>t.slice())
  };
  saveRecords();
  state.current = state.editBackup || state.current; // 編集前の入力位置に戻る（進行状態は動かさない）
  state.editBackup = null;
  state.editingId = null;
  render();
  const updated = state.records[idx];
  showUndo(`${kyokuLabel(updated, true)} を更新しました`, ()=>restoreSnapshot(snap));
}

// 「結果のみ入力する」：局の詳細を記録せず、この半荘そのものを「詳細なし」の1件のマーカーレコードとして記録し、
// 即座に半荘集計タブへ遷移して最終持ち点・順位の入力を促す（resultType==="resultonly"）。
// 局を実際にプレイしていないため、座席（起家〜北家の割り当て）は明示的にクリアする
// （すでに他の局の記録がある半荘に対して押した場合は、その局の座席データを壊さないよう座席クリアは行わない）。
function onSaveResultOnly(){
  const cur = state.current;
  ensureRecordPlayersSnapshot(cur.date, cur.hanchanNo);
  const hasOtherRecords = state.records.some(r=>r.date===cur.date && r.hanchanNo===cur.hanchanNo);
  const rec = {
    id: uid(), date: cur.date, hanchanNo: cur.hanchanNo, kyoku: "-", honba: cur.honba,
    resultType: "resultonly",
    stats: emptyToggles()
  };
  state.records.push(rec);
  saveRecords();
  state.hanchanEndAt[`${rec.date}_${rec.hanchanNo}`] = new Date().toISOString();
  saveHanchanEndAt();

  if(!hasOtherRecords){
    const key = `${cur.date}_${cur.hanchanNo}`;
    if(state.dealers[key] !== undefined){
      delete state.dealers[key];
      saveDealers();
    }
  }

  const pos = nextPositionFromRecord(rec);
  cur.hanchanNo = pos.hanchanNo;
  cur.kyoku = pos.kyoku;
  cur.honba = pos.honba;
  cur.toggles = emptyToggles();

  state.tab = "hanchan";
  state.hanchanMonthFilter = ""; // 遷移先の半荘が確実に見えるよう、月・曜日フィルタは解除する
  state.hanchanWeekdayFilter = "all";
  state.scrollToHanchanKey = `${rec.date}_${rec.hanchanNo}`;
  render();
  toast("結果のみ入力で記録しました。順位を入力しましょう");
}


// 局を保存して次の局へ進める。結果種別（next/renchan/ryuukyoku/chombo）は和了者が親かどうか等から自動判定済み。
// ※南4局で連荘・チョンボ以外の保存が発生した場合は、その半荘の最終局のため半荘は終了。
//   次の半荘No.の東1・積み場0からとなり、半荘集計タブで順位を入力できるよう自動的に切り替える。
function onSave(resultType){
  const cur = state.current;
  const snap = snapshotForUndo(true); // 取り消しで、保存前の局の位置とリーチ・鳴きの入力に戻すため
  ensureRecordPlayersSnapshot(cur.date, cur.hanchanNo); // 通常は半荘開始時に作成済み（旧データ用の保険）
  const rec = {
    id: uid(), date: cur.date, hanchanNo: cur.hanchanNo, kyoku: KYOKU_LIST[cur.kyoku], honba: cur.honba,
    resultType: resultType,
    stats: cur.toggles.map(t=>t.slice())
  };
  state.records.push(rec);
  saveRecords();

  const hanchanEnded = isHanchanEndingRecord(rec); // 南4で子のアガリ／親ノーテン流局（チョンボは局のやり直しなので半荘は終了しない）
  const pos = nextPositionFromRecord(rec);
  cur.hanchanNo = pos.hanchanNo;
  cur.kyoku = pos.kyoku;
  cur.honba = pos.honba;
  cur.toggles = emptyToggles();

  const names = namesForHanchan(rec.date, rec.hanchanNo);
  playSaveCutin(rec, names);
  if(hanchanEnded){
    state.hanchanEndAt[`${rec.date}_${rec.hanchanNo}`] = new Date().toISOString();
    saveHanchanEndAt();
    state.tab = "hanchan";
    state.hanchanMonthFilter = ""; // 遷移先の半荘が確実に見えるよう、月・曜日フィルタは解除する
    state.hanchanWeekdayFilter = "all";
    state.scrollToHanchanKey = `${rec.date}_${rec.hanchanNo}`;
    render();
    toast("半荘が終了しました。順位を入力しましょう");
  }else{
    state.flashCenter = true; // 局が進んだことが分かるよう、卓中央の局表示を一瞬光らせる
    render();
  }
  showUndo(`${kyokuLabel(rec, true)}　${describeRecordMain(rec, names)}`, ()=>restoreSnapshot(snap));
}

// その局で半荘が終わったかどうか（南4で連荘・チョンボ以外／結果のみ入力）
function isHanchanEndingRecord(rec){
  if(rec.resultType === "resultonly") return true;
  return rec.kyoku === "南4" && rec.resultType !== "renchan" && rec.resultType !== "chombo";
}

// ---------- 取り消し（局の保存・更新・削除の直後に6秒間、タブバーの位置に「取り消す」バーを出す） ----------
// 取り消し用の控え：記録・終了時刻（＋必要なら入力位置とタブ）
function snapshotForUndo(withPosition){
  return {
    records: JSON.parse(JSON.stringify(state.records)),
    hanchanEndAt: Object.assign({}, state.hanchanEndAt),
    current: withPosition ? JSON.parse(JSON.stringify(state.current)) : null,
    tab: state.tab,
  };
}
function restoreSnapshot(snap){
  state.records = snap.records; saveRecords();
  state.hanchanEndAt = snap.hanchanEndAt; saveHanchanEndAt();
  if(snap.current){ state.current = snap.current; state.tab = snap.tab; }
  state.overlay = null;
  render();
  toast("取り消しました");
}
let undoTimer = null;
function showUndo(msg, fn){
  const bar = document.getElementById("undoBar");
  if(!bar) return;
  clearTimeout(undoTimer);
  bar.innerHTML = `<span class="ub-msg">${escapeHtml(msg)}</span><button type="button" class="ub-btn" id="undoBtn">取り消す</button><button type="button" class="ub-close" id="undoCloseBtn" aria-label="閉じる">×</button><i class="ub-timer" aria-hidden="true"></i>`;
  bar.classList.remove("show"); void bar.offsetWidth; bar.classList.add("show");
  document.getElementById("undoBtn").onclick = ()=>{ hideUndo(); fn(); };
  document.getElementById("undoCloseBtn").onclick = hideUndo;
  undoTimer = setTimeout(hideUndo, 6000);
}
function hideUndo(){
  clearTimeout(undoTimer); undoTimer = null;
  const bar = document.getElementById("undoBar");
  if(bar) bar.classList.remove("show");
}

// 局の削除（直近の入力・半荘集計の局一覧の×）。確認ダイアログは出さず、取り消しバーで戻せるようにする。
// 削除した局が今の入力位置を決めている最後の局なら、入力位置もその局に戻す（その局のリーチ・鳴きも戻す）。
// 半荘を終わらせた局（南4の終了局・結果のみ入力）を消した場合は、終了時刻も消す。
function deleteRecordWithUndo(id){
  const rec = state.records.find(r=>r.id===id);
  if(!rec) return;
  if(state.editingId === id){ // 編集中の局を消すときは、先に編集を終えて編集前の位置に戻る
    if(state.editBackup) state.current = state.editBackup;
    state.editingId = null; state.editBackup = null;
  }
  const snap = snapshotForUndo(true);
  const cur = state.current;
  const lastOfDate = state.records.filter(r=>r.date===rec.date).pop();
  const next = nextPositionFromRecord(rec);
  const decides = cur.date===rec.date && lastOfDate && lastOfDate.id===rec.id &&
    next.hanchanNo===cur.hanchanNo && next.kyoku===cur.kyoku && next.honba===cur.honba;
  state.records = state.records.filter(r=>r.id!==id);
  saveRecords();
  const key = `${rec.date}_${rec.hanchanNo}`;
  if(isHanchanEndingRecord(rec) && state.hanchanEndAt[key]){ delete state.hanchanEndAt[key]; saveHanchanEndAt(); }
  if(decides){
    cur.hanchanNo = rec.hanchanNo;
    cur.kyoku = rec.resultType==="resultonly" ? 0 : Math.max(0, KYOKU_LIST.indexOf(rec.kyoku));
    cur.honba = rec.honba || 0;
    cur.toggles = rec.stats.map(t=>[t[K_RIICHI]||0, t[K_FUURO]||0, 0, 0, 0, 0]);
  }
  render();
  showUndo(`${kyokuLabel(rec, true)} を削除しました`, ()=>restoreSnapshot(snap));
}

// ---------- 演出：保存した局のカットイン（操作は止めない。約2.5秒で自然に消える） ----------
function showCutin(kind, main, sub){
  const fx = document.getElementById("fx");
  if(!fx) return;
  fx.querySelectorAll(".cutin").forEach(x=>x.remove()); // 続けて保存したときは前のカットインを消す
  const el = document.createElement("div");
  el.className = `cutin ${kind}`;
  el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="ci-main">${main}</div>${sub ? `<div class="ci-sub">${sub}</div>` : ""}`;
  fx.appendChild(el);
  setTimeout(()=>el.remove(), 2600); // 文字が読めるよう約2.5秒残す（操作は止めない）
}
function playSaveCutin(rec, names){
  const nm = (i)=> escapeHtml(names[i] || `P${i+1}`);
  const w = rec.stats.findIndex(s=>s[K_TSUMO] || s[K_RON]);
  const l = rec.stats.findIndex(s=>s[K_HOUJUU]);
  const dealer = getSeatOrder(rec.date, rec.hanchanNo)[Math.max(0, KYOKU_LIST.indexOf(rec.kyoku)) % 4];
  if(rec.resultType === "chombo"){
    showCutin("ryu", "チョンボ", rec.stats.map((s,i)=>s[K_CHOMBO] ? nm(i) : null).filter(Boolean).join("・"));
  }else if(w >= 0){
    const ren = w === dealer ? "　親 連荘" : "";
    if(rec.stats[w][K_TSUMO]) showCutin("tsumo", "ツモ", `<b>${nm(w)}</b>${ren}`);
    else showCutin("ron", "ロン", `<b>${nm(w)}</b>← ${l>=0 ? nm(l) : ""}${ren}`);
  }else{
    showCutin("ryu", "流局", rec.resultType === "renchan" ? "親テンパイ・連荘" : "親ノーテン");
  }
}

// ---------- 演出：半荘の結果発表（順位を確定した直後。4着から順に牌がめくれ、トップは少し溜めて出る） ----------
function showResultAnnouncement(key, toNext){
  const idx = key.lastIndexOf("_");
  const date = key.slice(0, idx), hanchanNo = Number(key.slice(idx+1));
  const names = namesForHanchan(date, hanchanNo);
  const ranks = state.ranks[key], sc = state.finalScores[key], pts = state.finalPoints[key];
  if(!ranks || !sc || !pts) return;
  const order = [0,1,2,3].sort((a,b)=>ranks[a]-ranks[b] || a-b);
  const delays = [1.25, 0.8, 0.45, 0.1]; // 表示の上から：1着は最後に
  const rows = order.map((i,p)=>`
    <div class="rp-row r${ranks[i]}" style="animation-delay:${delays[p]}s">
      <div class="rp-rank">${ranks[i]}<small>着</small></div>
      <div class="rp-name">${escapeHtml(names[i]||"P"+(i+1))}<small>${Number(sc[i]).toLocaleString()}点</small></div>
      <div class="rp-pt ${pts[i]<0?'neg':''}">${fmtPt(pts[i])}</div>
    </div>`).join("");
  const timing = fmtHanchanTiming(hanchanTiming(date, hanchanNo));
  const el = document.createElement("div");
  el.className = "result-backdrop";
  el.innerHTML = `<div class="result-panel" role="dialog" aria-label="半荘${hanchanNo}の結果">
    <div class="rp-eyebrow">RESULT</div>
    <div class="rp-title">半荘${hanchanNo} 結果<small>${fmtDate(date)}${timing ? `　${timing}` : ""}</small></div>
    <div class="riichi" aria-hidden="true"></div>
    <div class="rp-rows">${rows}</div>
    <div class="rp-close"><button type="button" class="overlay-confirm" id="rpCloseBtn">${toNext ? "次の半荘へ" : "閉じる"}</button></div>
  </div>`;
  document.getElementById("fx").appendChild(el);
  el.onclick = (e)=>{ if(!e.target.closest("#rpCloseBtn")) el.classList.add("skip"); }; // 途中でタップしたら演出を飛ばす
  el.querySelector("#rpCloseBtn").onclick = ()=>{
    el.remove();
    if(toNext){
      const cur = state.current;
      delete state.setupDismissed[`${cur.date}_${cur.hanchanNo}`];
      state.tab = "input";
      state.overlay = null;
      render(); // 一局ずつ入力なら、次の半荘の準備オーバーレイが開く
      window.scrollTo(0, 0);
    }
  };
}

// ---------- 素点入力：画面全体を描き直さず、順位・pt・合計の表示だけ差し替える ----------
// 3人分が入っていて1人だけ空欄なら、その人の素点を「100,000−3人の合計」で自動で埋める（他の3人が変わるたびに計算し直す）
function applyScoreAutoFill(key){
  const sc = state.finalScores[key] || (state.finalScores[key] = [null,null,null,null]);
  const auto = state.scoreAuto[key];
  const filled = (i)=> sc[i]!==null && sc[i]!==undefined && sc[i]!=="" && !isNaN(sc[i]);
  const manual = [0,1,2,3].filter(i=> i!==auto && filled(i));
  if(manual.length === 3){
    const t = [0,1,2,3].find(i=>!manual.includes(i));
    sc[t] = 100000 - manual.reduce((a,i)=>a+Number(sc[i]), 0);
    state.scoreAuto[key] = t;
  }else if(auto !== undefined){
    if(manual.length < 3) sc[auto] = null;
    delete state.scoreAuto[key];
  }
}
function updateScoreUi(key, editingP){
  const card = document.getElementById(`hanchan-${key}`);
  if(!card) return;
  const idx = key.lastIndexOf("_");
  const date = key.slice(0, idx), hanchanNo = Number(key.slice(idx+1));
  const scores = state.finalScores[key] || [null,null,null,null];
  const ranks = computeRanksFromScores(scores) || [null,null,null,null];
  const base = computeFinalPoints(scores, getSeatOrder(date, hanchanNo));
  const chomboPt = computeHanchanChomboPt(date, hanchanNo);
  const auto = state.scoreAuto[key];
  card.querySelectorAll(".rank-preview").forEach((el,i)=>{ el.className = `rank-chip rank-preview ${ranks[i]?'on-'+ranks[i]:''}`; el.textContent = ranks[i] || "-"; });
  card.querySelectorAll(".pt-preview").forEach((el,i)=>{ el.textContent = base ? fmtPt(base[i] + chomboPt[i]) : "-"; });
  card.querySelectorAll("[data-score-key]").forEach(inp=>{
    const i = Number(inp.dataset.scoreP);
    inp.classList.toggle("auto", auto === i);
    if(i !== editingP){ const v = scores[i]; inp.value = (v===null || v===undefined) ? "" : v/100; }
  });
  const note = document.getElementById(`sumnote-${key}`);
  if(note) note.innerHTML = scoreSumNoteHtml(scores);
}
// キーボードの「次へ」：次の欄へ（自動で埋めた欄は飛ばす）。最後なら閉じる
function focusNextScore(inp){
  const key = inp.dataset.scoreKey, p = Number(inp.dataset.scoreP);
  for(let i=p+1; i<4; i++){
    if(state.scoreAuto[key] === i) continue;
    const nx = document.querySelector(`[data-score-key="${key}"][data-score-p="${i}"]`);
    if(nx){ nx.focus(); nx.select && nx.select(); return; }
  }
  inp.blur();
}

// CSVは「局データ」と「半荘の最終素点」を1行＝1局のワイド形式1種類に統一して書き出す。
// 各プレイヤーの列は 名前/リーチ/副露/ツモ/ロン/放銃/チョンボ/素点 の8列で、
// 素点はその半荘が「確定済み」の場合のみ、同じ半荘の全行に同じ値を繰り返し記載する（未確定なら空欄）。
function exportCsv(){
  const header = ["日付","半荘No","局","本場","結果", ...[0,1,2,3].flatMap(i=>[`P${i+1}_名前`,`P${i+1}_リーチ`,`P${i+1}_副露`,`P${i+1}_ツモ`,`P${i+1}_ロン`,`P${i+1}_放銃`,`P${i+1}_チョンボ`,`P${i+1}_素点`])];
  const lines = [header.join(",")];
  state.records.forEach(r=>{
    const names = namesForHanchan(r.date, r.hanchanNo);
    const key = `${r.date}_${r.hanchanNo}`;
    const confirmed = !!state.hanchanConfirmed[key];
    const scores = confirmed ? (state.finalScores[key] || [null,null,null,null]) : [null,null,null,null];
    const perPlayer = [0,1,2,3].flatMap(i=>[
      names[i]||`P${i+1}`, ...r.stats[i],
      (scores[i]===null||scores[i]===undefined) ? "" : scores[i]
    ]);
    const row = [fmtDate(r.date), r.hanchanNo, r.kyoku, r.honba||0, RESULT_LABEL[r.resultType]||"", ...perPlayer];
    lines.push(row.join(","));
  });
  if(lines.length<2){ toast("書き出せるデータがありません"); return; }
  const blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "hanchan.csv"; a.click();
  URL.revokeObjectURL(url);
}

function reverseResultLabel(label){
  const entry = Object.entries(RESULT_LABEL).find(([k,v])=>v===label);
  return entry ? entry[0] : "next";
}
function parseCsvDate(s){
  const parts = (s||"").trim().split("/");
  if(parts.length!==3) return null;
  const [y,m,d] = parts;
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
// CSVの読み込みは1種類の入力窓口（importCsvFile）に統一する。ヘッダーに「半荘ID」列があれば、
// 局の詳細を持たない過去大会の結果データ（旧集計表の元データ形式も含む）とみなしてロング形式で読み込み、
// それ以外はこのアプリの標準書き出し形式（1行＝1局のワイド形式、末尾に各プレイヤーの素点列を含む）として読み込む。
function importCsvFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{ processCsvText(String(reader.result||"")); };
  reader.readAsText(file, "utf-8");
}
// CSVテキストそのものを受け取って取り込む共通処理（ファイル選択・サーバー読み込みの両方から呼ばれる）。
function processCsvText(rawText){
  hideUndo();
  const text = String(rawText||"").replace(/^﻿/, "");
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
  if(lines.length < 2){ toast("読み込めるデータがありません"); return; }
  const header = lines[0].split(",").map(h=>h.trim());
  if(header.includes("半荘ID")){
    importLegacyHanchanResultsCsv(lines, header);
  }else{
    importWideKyokuCsv(lines);
  }
}
// このアプリと同じサイトのルートに置かれているhanchan.csvをfetchで取得して取り込む。
async function importCsvFromServer(){
  try{
    const res = await fetch("./hanchan.csv", { cache: "no-store" });
    if(!res.ok){ toast(`サーバーのCSVを取得できませんでした（${res.status}）`); return; }
    const text = await res.text();
    processCsvText(text);
  }catch(e){
    toast("サーバーのCSVを取得できませんでした（通信エラー）");
  }
}

// 局データの「重複」判定キー。日付・半荘No・局・本場・結果種別・各プレイヤーのスタッツが
// すべて一致する場合のみ同一の局とみなす。
function kyokuRecordSignature(r){
  return [r.date, r.hanchanNo, r.kyoku, r.honba, r.resultType, JSON.stringify(r.stats)].join("|");
}

// 標準形式（日付,半荘No,局,本場,結果, [名前,リーチ,副露,ツモ,ロン,放銃,チョンボ,素点]×4人）を読み込む。
// 素点列が無い古い書き出し（名前あり／名前なし）も引き続き読み込める。
function importWideKyokuCsv(lines){
  const colsPerPlayerScore = 8; // 名前 + 6スタッツ + 素点（現行形式）
  const colsPerPlayerNew = 7;   // 名前 + 6スタッツ（素点列を追加する前の形式）
  const colsPerPlayerOld = 6;   // 6スタッツのみ（最旧形式・名前列なし）
  const requiredColsScore = 5 + 4*colsPerPlayerScore;
  const requiredColsNew = 5 + 4*colsPerPlayerNew;
  const requiredColsOld = 5 + 4*colsPerPlayerOld;
  const newRecords = [];
  const snapshotsToApply = {}; // key -> [name0..3]（既存スナップショットが無い半荘にのみ後で適用）
  const scoresByHanchan = {};  // key -> [素点0..3]（4人分そろった半荘のみ、後でまとめて確定判定する）
  const seenSignatures = new Set(state.records.map(kyokuRecordSignature)); // 既存レコード＋今回取り込み済み分
  let skippedDuplicate = 0;
  for(let li=1; li<lines.length; li++){
    const cols = lines[li].split(",");
    const hasScore = cols.length >= requiredColsScore;
    const hasNames = hasScore || cols.length >= requiredColsNew;
    if(!hasNames && cols.length < requiredColsOld) continue;
    const colsPerPlayer = hasScore ? colsPerPlayerScore : (hasNames ? colsPerPlayerNew : colsPerPlayerOld);
    const date = parseCsvDate(cols[0]);
    if(!date) continue;
    const hanchanNo = Number(cols[1]) || 1;
    const kyoku = cols[2];
    const honba = Number(cols[3]) || 0;
    const resultType = reverseResultLabel(cols[4]);
    const names = [];
    const scores = [];
    const stats = [0,1,2,3].map(pi=>{
      const base = 5 + pi*colsPerPlayer;
      if(hasNames){
        names.push(cols[base] || `P${pi+1}`);
        if(hasScore){
          const sc = cols[base+7];
          scores.push(sc==="" || sc===undefined ? null : Number(sc));
        }
        return [0,1,2,3,4,5].map(k => Number(cols[base+1+k]) || 0);
      }
      return [0,1,2,3,4,5].map(k => Number(cols[base+k]) || 0);
    });
    const rec = { id: uid(), date, hanchanNo, kyoku, honba, resultType, stats };
    const sig = kyokuRecordSignature(rec);
    if(seenSignatures.has(sig)){ skippedDuplicate++; continue; }
    seenSignatures.add(sig);
    newRecords.push(rec);
    if(hasNames){
      const key = `${date}_${hanchanNo}`;
      if(!snapshotsToApply[key]) snapshotsToApply[key] = names;
      if(hasScore && !scoresByHanchan[key] && scores.every(s=>s!==null && !isNaN(s))){
        scoresByHanchan[key] = scores;
      }
    }
  }
  if(!newRecords.length){
    toast(skippedDuplicate
      ? `追加できる局データがありませんでした（すべて既存データと重複：${skippedDuplicate}件）`
      : "有効な局データが見つかりませんでした（書き出し形式と一致するか確認してください）");
    return;
  }
  if(!confirm(`${newRecords.length}件の局データを、既存のデータに追加します${skippedDuplicate?`（重複スキップ:${skippedDuplicate}件）`:""}。よろしいですか？`)) return;
  state.records = state.records.concat(newRecords);
  Object.entries(snapshotsToApply).forEach(([key,names])=>{
    if(!state.recordPlayers[key]) state.recordPlayers[key] = names;
  });
  // 素点が4人分そろっている半荘のみ、まだ未確定であればこのアプリの計算式で順位・得点ptを確定する
  let confirmedCount = 0;
  Object.entries(scoresByHanchan).forEach(([key,scores])=>{
    if(state.hanchanConfirmed[key]) return;
    if(scoreSumDiff(scores) !== null) return;
    const idx = key.lastIndexOf("_");
    const date = key.slice(0,idx), hanchanNo = Number(key.slice(idx+1));
    state.finalScores[key] = scores;
    const result = tryConfirmHanchan(date, hanchanNo);
    if(result.ok) confirmedCount++;
  });
  saveRecords();
  saveRecordPlayers();
  saveFinalScores(); saveRanks(); saveFinalPoints(); saveHanchanConfirmed();
  render();
  const notes = [];
  if(confirmedCount) notes.push(`うち${confirmedCount}半荘の順位を確定`);
  if(skippedDuplicate) notes.push(`重複${skippedDuplicate}件をスキップ`);
  toast(`${newRecords.length}件を追加しました${notes.length?`（${notes.join("、")}）`:""}`);
}

// ================= 半荘結果（順位・スコア）のみのロング形式CSV読み込み =================
// 半荘ID（例："20240911-01"）から日付("2024-09-11")と半荘No(1)を復元する。形式が合わなければnull。
function reverseHanchanIdToDateNo(id){
  const m = /^(\d{4})(\d{2})(\d{2})-(\d+)$/.exec((id||"").trim());
  if(!m) return null;
  return { date: `${m[1]}-${m[2]}-${m[3]}`, hanchanNo: Number(m[4]) };
}
// "YYYY/MM/DD" "YYYY-MM-DD" のどちらでも受け付ける日付パーサ（半荘IDが無い場合のフォールバック用）
function parseFlexibleDate(s){
  const m = /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/.exec((s||"").trim());
  if(!m) return null;
  return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
}

// 半荘ID・日付・プレイヤー・素点などの列を持つロング形式（過去大会データ／旧集計表）を読み込む。
// 局の詳細を持たないため「結果のみ入力」の半荘として取り込み、統計の打点系スタッツ（リーチ率など）には含めない。
function importLegacyHanchanResultsCsv(lines, header){
  const idxOf = (...names)=>{ for(const n of names){ const i = header.indexOf(n); if(i!==-1) return i; } return -1; };
  const colId = idxOf("半荘ID");
  const colDate = idxOf("日付");
  const colNo = idxOf("半荘No","回");
  const colName = idxOf("プレイヤー","プレイヤー名","名前");
  const colScore = idxOf("素点");
  if(colName===-1 || colScore===-1){ toast("CSVの形式が正しくありません（プレイヤー・素点の列が必要です）"); return; }

  const existingKeys = new Set(hanchanGroups().map(g=>`${g.date}_${g.hanchanNo}`));
  const groupsMap = new Map(); // key -> {date, hanchanNo, rows:[{name,score}]}
  for(let li=1; li<lines.length; li++){
    const cols = lines[li].split(",");
    let date=null, hanchanNo=null;
    if(colId!==-1){
      const parsed = reverseHanchanIdToDateNo(cols[colId]);
      if(parsed){ date=parsed.date; hanchanNo=parsed.hanchanNo; }
    }
    if(!date && colDate!==-1){
      date = parseFlexibleDate(cols[colDate]);
      hanchanNo = colNo!==-1 ? (Number(cols[colNo])||1) : 1;
    }
    if(!date || !hanchanNo) continue;
    const name = (cols[colName]||"").trim();
    const score = Number(cols[colScore]);
    if(!name || cols[colScore]==="" || isNaN(score)) continue;
    const key = `${date}_${hanchanNo}`;
    if(!groupsMap.has(key)) groupsMap.set(key, {date, hanchanNo, rows:[]});
    groupsMap.get(key).rows.push({name, score});
  }

  let skippedExisting=0, skippedInvalid=0;
  const validGroups = [];
  groupsMap.forEach((g,key)=>{
    if(existingKeys.has(key)){ skippedExisting++; return; }
    if(g.rows.length !== 4){ skippedInvalid++; return; }
    const scores = g.rows.map(r=>r.score);
    if(scoreSumDiff(scores) !== null){ skippedInvalid++; return; }
    validGroups.push(g);
  });

  if(!validGroups.length){
    toast(`取り込める半荘がありませんでした（既存と重複:${skippedExisting}件／形式不正:${skippedInvalid}件）`);
    return;
  }
  if(!confirm(`${validGroups.length}件の半荘結果を新規に取り込みます（重複スキップ:${skippedExisting}件、形式不正スキップ:${skippedInvalid}件）。\nこれらは「結果のみ入力」の半荘として、統計の打点系スタッツ（リーチ率など）には含めず、順位・スコア系の集計にのみ反映されます。よろしいですか？`)) return;

  validGroups.forEach(g=>{
    const key = `${g.date}_${g.hanchanNo}`;
    const names = g.rows.map(r=>r.name);
    const scores = g.rows.map(r=>r.score);
    state.recordPlayers[key] = names;
    state.finalScores[key] = scores;
    state.records.push({ id: uid(), date:g.date, hanchanNo:g.hanchanNo, kyoku:"-", honba:0, resultType:"resultonly", stats: emptyToggles() });
    tryConfirmHanchan(g.date, g.hanchanNo); // 合計は上で検証済みのため必ず成功する
  });

  saveRecords(); saveRecordPlayers(); saveFinalScores(); saveRanks(); saveFinalPoints(); saveHanchanConfirmed();
  render();
  toast(`${validGroups.length}件の半荘結果を取り込みました`);
}

// 詳細入力の卓の高さを画面に合わせる：ツモ／ロン／流局ボタンの下端がタブバーのすぐ上に来るよう、
// リーチ／鳴きボタンの上下余白（--tb-pad、8〜24px）を実測しながら調整する。
// 詳細設定を開いている間は高さを変えず、閉じた状態で求めた値をそのまま使う（開閉で卓のサイズが変わらないように）。
// 既存の局の編集中は、編集バナー・結果タグのぶんだけ測り直す（その値は通常入力には持ち越さない）。
const FIT_TB_PAD_MIN = 8, FIT_TB_PAD_MAX = 24, FIT_TB_MARGIN = 6;
function fitInputTable(){
  const wrap = document.querySelector(".table-wrap.input-table");
  const bar = document.querySelector(".action-bar");
  const tab = document.querySelector("nav.tabbar");
  if(!wrap || !bar || !tab) return;
  if(fitInputTable.pad && !state.tableHeaderCollapsed){
    wrap.style.setProperty("--tb-pad", fitInputTable.pad + "px");
    return;
  }
  // 編集中は編集バナー・結果タグのぶん卓が伸びるため測り直す（通常入力の値 fitInputTable.pad は上書きしない）
  const editing = !!state.editingId;
  let pad = fitInputTable.pad || 12;
  const target = window.innerHeight - tab.offsetHeight - FIT_TB_MARGIN; // タブバー上端（スクロール0の状態での位置）
  for(let i=0; i<8; i++){
    wrap.style.setProperty("--tb-pad", pad + "px");
    const barBottom = bar.getBoundingClientRect().bottom + window.scrollY;
    const diff = target - barBottom;
    if(Math.abs(diff) < 1.5) break;
    const next = Math.min(FIT_TB_PAD_MAX, Math.max(FIT_TB_PAD_MIN, pad + diff / 13));
    if(Math.abs(next - pad) < 0.1) break;
    pad = next;
  }
  // 端数で少しはみ出す場合は少しずつ戻して確実にタブバーの上に収める
  for(let i=0; i<8 && pad > FIT_TB_PAD_MIN; i++){
    if(bar.getBoundingClientRect().bottom + window.scrollY <= target + 0.5) break;
    pad = Math.max(FIT_TB_PAD_MIN, pad - 0.5);
    wrap.style.setProperty("--tb-pad", pad + "px");
  }
  if(!editing) fitInputTable.pad = pad;
}
// 画面の回転・サイズ変更時に再計算する（スマホのアドレスバーの出し入れ程度の小さな高さ変化では再計算しない）
let fitLastW = window.innerWidth, fitLastH = window.innerHeight;
window.addEventListener("resize", ()=>{
  if(window.innerWidth === fitLastW && Math.abs(window.innerHeight - fitLastH) < 120) return;
  fitLastW = window.innerWidth; fitLastH = window.innerHeight;
  fitInputTable.pad = null;
  fitInputTable();
});

// ---- 見た目の補助（データ・機能には関与しない） ----
// 初回表示だけ牌を配るアニメーション（再描画のたびには動かさない）
document.documentElement.classList.add("deal");
setTimeout(()=>document.documentElement.classList.remove("deal"), 900);
// iOS Safari でボタンの押下中（:active＝牌が沈む）表現を有効にする
document.addEventListener("touchstart", ()=>{}, {passive:true});

loadAll();
</script>
